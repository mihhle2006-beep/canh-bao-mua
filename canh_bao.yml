# Cảnh báo MUA đa khung – chạy mỗi 15 phút trong phiên, tổng kết lúc 15:20 (giờ Việt Nam).
name: Canh bao mua

on:
  schedule:
    - cron: "*/15 2-4 * * 1-5"     # 09:00–11:45 giờ VN (UTC+7) – code tự bỏ qua ngoài phiên
    - cron: "*/15 6-7 * * 1-5"     # 13:00–14:45 giờ VN
    - cron: "20 8 * * 1-5"         # 15:20 giờ VN – tổng kết cuối ngày
  workflow_dispatch:
    inputs:
      che_do:
        description: "tu_dong | trong_phien | tong_ket"
        default: "tong_ket"
        type: choice
        options: [tu_dong, trong_phien, tong_ket]

permissions:
  contents: write

concurrency:
  group: canh-bao
  cancel-in-progress: true

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 20                # lần đầu mỗi ngày & tổng kết chạy thêm phân tích ptcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Khôi phục cache giá & phân tích ngày (ptcp)
        uses: actions/cache@v4
        with:
          path: |
            cache_gia
            cache_ptcp
          key: gia-${{ github.run_id }}
          restore-keys: gia-

      - name: Kiểm thử
        run: python -m pytest -q

      - name: Quét & gửi cảnh báo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python chay.py --che_do ${{ inputs.che_do || 'tu_dong' }}

      - name: Lưu trạng thái chống báo trùng & lịch sử tín hiệu
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trang_thai_canh_bao.json lich_su_tin_hieu.csv 2>/dev/null || true
          git diff --cached --quiet && echo "Không có thay đổi" && exit 0
          git commit -m "Trạng thái cảnh báo $(date -u +%F' '%H:%M) UTC"
          git pull --rebase || true
          git push || echo "Không đẩy được – Settings → Actions → General → Workflow permissions: Read and write"
