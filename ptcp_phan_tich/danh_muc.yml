# Chạy danh mục mỗi ngày giao dịch lúc 15:45 giờ Việt Nam, gửi Telegram (tóm tắt + dashboard + Excel).
name: Danh muc hang ngay

on:
  schedule:
    - cron: "45 8 * * 1-5"        # 08:45 UTC = 15:45 giờ VN, thứ Hai → thứ Sáu
  workflow_dispatch:               # nút "Run workflow" để chạy tay

permissions:
  contents: write

concurrency:
  group: danh-muc
  cancel-in-progress: false

defaults:
  run:
    working-directory: ptcp_phan_tich

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ptcp_phan_tich/requirements.txt

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Lấy danh mục mới nhất (file danh_muc.csv ở gốc repo)
        run: |
          cp ../danh_muc.csv danh_muc.csv
          if [ -f ../nhat_ky.csv ]; then cp ../nhat_ky.csv nhat_ky.csv; fi

      - name: Kiểm thử
        run: python -m pytest -q

      - name: Chạy danh mục
        env:
          TIEN_MAT: ${{ vars.TIEN_MAT || '8' }}
          GIU_TIEN_MAT: ${{ vars.GIU_TIEN_MAT }}
          CHON: ${{ vars.CHON || 'gmv' }}
          NHAT_KY: ${{ vars.NHAT_KY }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}   # tuỳ chọn – khoá vnstock (để trống vẫn chạy)
        run: |
          ARGS="--khong_ve --tien_mat ${TIEN_MAT:-8} --chon ${CHON:-gmv}"
          if [ -n "$GIU_TIEN_MAT" ]; then ARGS="$ARGS --giu_tien_mat $GIU_TIEN_MAT"; fi
          if [ -n "$NHAT_KY" ]; then ARGS="$ARGS --nhat_ky $NHAT_KY"; fi
          python -c "from dmuc.chuong_trinh import main; main()" $ARGS > ket_qua_log.txt 2>&1 || true
          cat ket_qua_log.txt

      - name: Gửi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gui_telegram.py

      - name: Lưu kết quả (tải ở mục Artifacts, giữ 30 ngày)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ket-qua-danh-muc
          path: |
            ptcp_phan_tich/ket_qua_danh_muc_*/
            ptcp_phan_tich/ket_qua_log.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Lưu trạng thái giữa các lần chạy
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp danh_muc.csv ../danh_muc.csv            # danh mục đã cập nhật ngày mua / cắt lỗ / chốt lời / đề xuất
          git add -f trang_thai_vi_the.json lich_su_danh_muc.csv cache_du_lieu ../danh_muc.csv 2>/dev/null || true
          git commit -m "Cập nhật danh mục $(date +%F)" || echo "Không có thay đổi"
          git pull --rebase || true
          git push || echo "Không đẩy được – kiểm tra Settings → Actions → Workflow permissions"
