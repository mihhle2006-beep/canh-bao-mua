# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI (token có quyền
# GHI Contents repo danh-muc – kết quả commit về danh-muc). CONG_KHAI=1: không đọc / in danh mục
# thật hay mã PTĐTTC (ptcp.cau_hinh.CONG_KHAI).
# LỌC QUỸ B – hạng GTGD TB20, RS 3T, biến động, tín hiệu mạnh trong rổ HOSE + HNX (~700 mã, 17/10/2026; trước ~420 mã)
# + định giá J8 cuối quý gần nhất (mã gần top + bản đồ ngành) → ptcp/loc_quy_b.json (trong gói ptcp,
# nên canh-bao-mua / gia_lap nhận qua lay_ptcp.py). Chạy 06:07 giờ VN mỗi ngày giao dịch (xong trước phiên 09:00 & tin tổng kết 15:20).
# Trước khi định giá: tải BCTC quý / năm vừa công bố (mã thiếu đúng kỳ mới nhất đã tới hạn – kho_bctc --moi) và lấy lại
# số CP của mã có sự kiện quyền mới (cổ tức, chia / thưởng, phát hành – cache_du_lieu/so_cp.json).
name: Loc quy B

on:
  workflow_dispatch:
  schedule:
    - cron: "7 23 * * 0-4"         # 06:07 giờ VN thứ Hai–Sáu (23:07 UTC CN–Năm): chạy ~30' + GitHub hay trễ lịch
                                   # → xong trước phiên 09:00 dù trễ ~1 giờ

permissions:
  contents: read

concurrency:
  group: dm-loc-quy-b
  cancel-in-progress: false

jobs:
  cap_nhat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
      TZ: Asia/Ho_Chi_Minh             # lịch chạy 23:07 UTC = sáng hôm sau giờ VN → ngày / quý / thứ Sáu chốt theo giờ VN
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          path: danh-muc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Lấy cache giá lần trước
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu
          key: gia-ngay-loc-${{ github.run_id }}
          restore-keys: gia-ngay-

      - name: Tải BCTC quý / năm mới công bố
        continue-on-error: true
        timeout-minutes: 30
        env:                               # tin chất lượng BCTC mới (mã top 100 GTGD / danh mục)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
        run: python -m ptcp.kho_bctc --moi 80

      - name: Xếp hạng GTGD + định giá
        run: python -m ptcp.loc_quy_b

      - name: Lịch sử mã (điểm ★ – tính lại khi file cũ ≥ 6 ngày)
        continue-on-error: true
        timeout-minutes: 60                # rổ HOSE + HNX ~700 mã (trước ~420: 40')
        run: |
          python -m ptcp.lich_su_ma > /dev/null 2>&1; echo "Lịch sử mã – mã thoát $?"

      - name: Lưu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ptcp/loc_quy_b.json du_lieu/bctc
          git add ptcp/lich_su_ma.json 2>/dev/null || true
          git commit -m "Lọc Quỹ B $(date +%F)" || { echo "Không có thay đổi"; exit 0; }
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep $((i * 5)); done
          echo "Không đẩy được – kiểm tra Settings → Actions → Workflow permissions"; exit 1
