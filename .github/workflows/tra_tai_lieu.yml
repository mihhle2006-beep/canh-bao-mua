# TRA TÀI LIỆU DOANH NGHIỆP (chạy tay): đọc báo cáo thường niên + BCTC năm kiểm toán (hợp nhất trước) của 1 mã, 1 năm –
# chữ PDF / OCR – rồi in câu có lời giải thích chứa từ khoá (danh-muc ptcp/giai_thich_bat_thuong.py --tra). Tài liệu công
# bố công khai của doanh nghiệp → in log được; KHÔNG đọc danh mục thật (xoá file).
name: Tra tai lieu doanh nghiep

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã"
        default: "MVN"
      nam:
        description: "Năm tài chính"
        default: "2020"
      tu_khoa:
        description: "Nhóm từ khoá – mỗi nhóm cách nhau dấu ; , trong nhóm cách nhau dấu ,"
        default: "chi phí quản lý doanh nghiệp,dự phòng;cổ phần hóa,quyết toán,doanh nghiệp nhà nước;chênh lệch,trước kiểm toán,điều chỉnh;thu nhập khác,xóa nợ,miễn giảm;hoàn nhập;lợi nhuận sau thuế,kế hoạch"

permissions:
  contents: read

jobs:
  tra:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cài thư viện + OCR tiếng Việt
        run: |
          pip install -q -r requirements.txt > /dev/null
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-vie poppler-utils > /dev/null
      - name: Khôi phục đệm chữ tài liệu
        uses: actions/cache/restore@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
          restore-keys: tai-lieu-bt-
      - name: Tra ${{ inputs.ma }} ${{ inputs.nam }}
        env:
          MA: ${{ inputs.ma }}
          NAM: ${{ inputs.nam }}
          TU_KHOA: ${{ inputs.tu_khoa }}
          CONG_KHAI: "1"
        run: python -m ptcp.giai_thich_bat_thuong --ma "$MA" --tra "$NAM" --tu_khoa "$TU_KHOA"
