# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI. CONG_KHAI=1: không đọc / in danh mục
# thật (ptcp.cau_hinh.CONG_KHAI).
# BÁO CÁO ĐẦY ĐỦ MÃ – bấm "Run workflow", nhập mã (VD HPG hoặc HPG,FPT) → phân tích đủ các phần (A–K, J6 dòng tiền)
# Đầu báo cáo: thẻ doanh nghiệp + khuyến nghị, rồi nón lịch sử (D2 dạng biểu đồ).
# → gửi Telegram: "Chỉ file HTML" ('<MÃ> báo cáo dd-mm-yyyy.html') hoặc "File HTML + khuyến nghị" (tin tóm tắt
#   khuyến nghị, vùng mua, cắt lỗ, mục tiêu… rồi file) · luôn lưu ở mục Artifacts của lần chạy (giữ 14 ngày).
# → kèm BẢN GHI NHỚ (ptcp.ghi_nho: dữ kiện + BCTN / NQ HĐQT / BC quản trị trên CafeF, PDF scan đọc bằng OCR) gửi Telegram.
name: Bao cao ma

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã cổ phiếu, phân cách dấu phẩy (VD HPG,FPT)"
        default: "HPG"
      noi_dung:
        description: "Gửi Telegram"
        type: choice
        options:
          - "Chỉ file HTML"
          - "File HTML + khuyến nghị"
          - "Không gửi (chỉ lưu Artifacts)"
        default: "Chỉ file HTML"

permissions:
  contents: read

jobs:
  bao_cao:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Cài OCR tiếng Việt (đọc PDF scan / ký số trong tài liệu gốc – ptcp/ocr.py)
        run: |
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-vie poppler-utils > /dev/null
          tesseract --list-langs 2>&1 | grep -q '^vie$' && echo 'OCR tiếng Việt: sẵn sàng'

      - name: Phân tích & gửi báo cáo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          MA: ${{ inputs.ma }}
          GUI: ${{ inputs.noi_dung == 'Chỉ file HTML' && '--chi_html' || (inputs.noi_dung == 'File HTML + khuyến nghị' && ' ' || '--khong_gui') }}
        run: python bao_cao_ma.py "$MA" $GUI

      - name: Bản ghi nhớ (dữ kiện + tài liệu CafeF đọc OCR – chiến lược, cổ đông lớn, phát hành…)
        if: inputs.noi_dung != 'Không gửi (chỉ lưu Artifacts)'
        continue-on-error: true
        timeout-minutes: 20
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          MA: ${{ inputs.ma }}
        run: python -m ptcp.ghi_nho --ma "$MA" --gui

      - name: Lưu file báo cáo (Artifacts)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bao-cao-${{ github.run_id }}
          path: danh-muc/ket_qua_*/*_bao_cao.html
          retention-days: 14
          if-no-files-found: ignore
