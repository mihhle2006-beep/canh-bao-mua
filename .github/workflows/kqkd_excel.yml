# FILE KẾT QUẢ KINH DOANH THEO QUÝ (chạy tay): HOSE + HNX từ kho BCTC danh-muc (du_lieu/bctc,
# Vietcap IQ; mã ngoài rổ chính ở du_lieu/bctc_kqkd) → Excel gửi Telegram (danh-muc ptcp/kqkd_excel.py). TỰ ĐỘNG: "BCTC
# moi hang dem" gửi khi quý / năm mới ĐỦ BCTC – chạy tay khi cần file ngay. "tai_them": tải mã chưa có + mã thiếu kỳ mới
# (chỉ mã có kỳ mới). BCTC công bố công khai → in log được; KHÔNG đọc danh mục thật.
name: File KQKD theo quy

on:
  workflow_dispatch:
    inputs:
      tai_them:
        description: "Tải mã chưa có / thiếu quý mới (Vietcap IQ) rồi lưu vào kho – bỏ chọn: chỉ dựng file từ kho"
        type: boolean
        default: true

permissions:
  contents: read                   # repo này; ghi danh-muc bằng DANH_MUC_TOKEN_GHI

concurrency:
  group: kqkd-excel
  cancel-in-progress: false

jobs:
  kqkd:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json; [ "$(git config --get core.sparseCheckout)" = true ] || git sparse-checkout set --no-cone '/*' '!/danh_muc*.csv' '!/da_ban*.csv' '!/lenh_that*.csv' '!/tien_mat_*.json' '!/trang_thai_vi_the.json' '!/lich_su_danh_muc.csv' '!/nhap*.txt' '!/trung_vang*.json' 2>/dev/null || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - run: pip install -q -r requirements.txt > /dev/null
      - name: Dựng file KQKD + gửi Telegram
        env:
          CONG_KHAI: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_NGHIEN_CUU || !contains(secrets.TELEGRAM_CHAT_ID_NGHIEN_CUU, ':') && secrets.TELEGRAM_CHAT_ID_NGHIEN_CUU && (secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN) || secrets.TELEGRAM_TOKEN }}   # kênh nghiên cứu
          TELEGRAM_CHAT_ID: ${{ !contains(secrets.TELEGRAM_CHAT_ID_NGHIEN_CUU, ':') && secrets.TELEGRAM_CHAT_ID_NGHIEN_CUU || secrets.TELEGRAM_CHAT_ID }}
        run: python -m ptcp.kqkd_excel ${{ inputs.tai_them && '--tai' || '' }} --gui --ra "KQKD_$(TZ=Asia/Ho_Chi_Minh date +%d-%m-%Y).xlsx"
      - name: Lưu kho mã ngoài rổ chính + kỳ đã gửi (danh-muc du_lieu/bctc_kqkd, kqkd_da_gui.json)
        if: always()
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          for f in du_lieu/bctc_kqkd du_lieu/kqkd_da_gui.json; do [ -e "$f" ] && git add "$f"; done
          git commit -q -m "File KQKD: kho mã ngoài rổ chính / kỳ đã gửi" > /dev/null 2>&1 || { echo "Kho không đổi"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; git rebase --abort 2>/dev/null || true; sleep $((i * 5)); done
          exit 1
