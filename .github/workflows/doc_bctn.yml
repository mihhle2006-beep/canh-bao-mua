# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – log CÔNG KHAI); code & cache ở repo riêng tư danh-muc (checkout vào danh-muc/).
# ĐỌC BÁO CÁO THƯỜNG NIÊN – chiến lược doanh nghiệp từng năm (ptcp/chien_luoc_dn.py): BCTN CafeF (thiếu → Vietcap),
# pdftotext + OCR tiếng Việt → trang "định hướng / chiến lược phát triển", chủ đề, cờ CÓ THỂ ĐỔI CHIẾN LƯỢC.
# Cache: danh-muc du_lieu/chien_luoc_dn/<MÃ>.json (mã đã đủ năm không đọc lại). Mỗi lượt: chia mã chưa xong thành tối đa
# 14 nhóm chạy song song (≤ 320 phút / nhóm) → gộp cache, commit vào danh-muc → còn mã chưa xong thì TỰ CHẠY LƯỢT SAU
# (tối đa vong_toi_da lượt) → đủ mã: Excel tổng hợp gửi Telegram. CONG_KHAI=1: log chỉ in số mã.
# NHANH (28/10/2026): OCR theo đợt 8 trang, dừng khi đã đọc qua phần chiến lược (không OCR đủ 40 trang ảnh); thư viện Python
# lấy từ cache; tesseract cài thẳng (chỉ apt-get update khi lỗi).
# CHỈ CHẠY BAN ĐÊM: lịch 22:17 giờ VN mỗi ngày; lượt sau chỉ tự gọi khi đang trong 21:00–03:59 giờ VN (sáng ra dừng, đêm sau
# lịch chạy tiếp phần còn lại). Đã đủ mã → lịch không đọc gì, không gửi lại Telegram.
name: Doc bao cao thuong nien

on:
  schedule:
    - cron: "17 15 * * *"               # 22:17 giờ VN
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã, phân cách dấu phẩy – bỏ trống = toàn bộ HOSE + HNX"
        default: ""
      tu:
        description: "Từ năm báo cáo"
        default: "2020"
      den:
        description: "Đến năm báo cáo (bỏ trống = năm trước – tự sang năm mới)"
        default: ""
      vong:
        description: "Lượt hiện tại (tự tăng khi workflow tự chạy lại)"
        default: "1"
      vong_toi_da:
        description: "Số lượt tối đa"
        default: "8"

permissions:
  contents: read
  actions: write

concurrency:
  group: doc-bctn
  cancel-in-progress: false

env:
  CONG_KHAI: "1"

jobs:
  chuan_bi:
    runs-on: ubuntu-24.04
    outputs:
      nhom: ${{ steps.chia.outputs.nhom }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Chia mã chưa xong thành nhóm
        id: chia
        working-directory: danh-muc
        env:
          MA: ${{ inputs.ma }}
        run: |
          [ "${{ steps.cache_py.outputs.cache-hit }}" = "true" ] || pip install -q -r requirements.txt > /dev/null
          ds=$(python -m ptcp.chien_luoc_dn con_lai ${MA:+--ma "$MA"} --tu ${{ inputs.tu || '2020' }} ${{ inputs.den && format('--den {0}', inputs.den) || '' }} | tail -1)
          nhom=$(DS="$ds" python -c "
          import json, os
          ds = [m for m in os.environ['DS'].split(',') if m]
          n = min(14, len(ds))
          print(json.dumps([','.join(ds[i::n]) for i in range(n)]))")
          echo "Còn $(echo "$ds" | tr ',' '\n' | grep -c .) mã chưa xong"
          echo "nhom=$nhom" >> "$GITHUB_OUTPUT"

  doc:
    needs: chuan_bi
    if: needs.chuan_bi.outputs.nhom != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 14                      # chừa runner cho backtest / workflow khác (giới hạn 20 job cùng lúc)
      matrix:
        nhom: ${{ fromJSON(needs.chuan_bi.outputs.nhom) }}
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện + OCR tiếng Việt
        run: |
          [ "${{ steps.cache_py.outputs.cache-hit }}" = "true" ] || pip install -q -r requirements.txt > /dev/null
          # danh sách gói của máy GitHub thường còn mới → cài thẳng; lỗi mới apt-get update (đỡ ~30–60 giây / nhóm)
          P="tesseract-ocr tesseract-ocr-vie poppler-utils"
          sudo apt-get install -y -q --no-install-recommends $P > /dev/null 2>&1 \
            || { sudo apt-get update -q > /dev/null && sudo apt-get install -y -q --no-install-recommends $P > /dev/null; }
      - name: Đọc BCTN (dừng nhận việc mới trước 06:30 giờ VN)
        env:
          NHOM: ${{ matrix.nhom }}
        run: |
          # dừng nhận việc mới trước 06:30 giờ VN (tối đa 320 phút) – chỉ chạy ban đêm
          con=$(( ( $(TZ=Asia/Ho_Chi_Minh date -d 'today 06:30' +%s) - $(date +%s) ) / 60 ))
          [ "$con" -lt 0 ] && con=$(( con + 1440 ))
          han=$(( con < 320 ? con : 320 )); [ "$han" -lt 20 ] && han=20
          echo "Đọc tối đa $han phút"
          python -m ptcp.chien_luoc_dn doc --ma "$NHOM" --tu ${{ inputs.tu || '2020' }} ${{ inputs.den && format('--den {0}', inputs.den) || '' }} --han_phut $han
      - name: Gom cache nhóm này
        if: always()
        env:
          NHOM: ${{ matrix.nhom }}
        run: |
          mkdir -p ../ra
          for m in ${NHOM//,/ }; do [ -f du_lieu/chien_luoc_dn/$m.json ] && cp du_lieu/chien_luoc_dn/$m.json ../ra/; done
          echo "id=$(echo "$NHOM" | md5sum | cut -c1-8)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bctn-${{ env.id }}
          path: ra/*.json
          retention-days: 2
          if-no-files-found: ignore

  gop:
    needs: [chuan_bi, doc]
    if: always() && needs.chuan_bi.result == 'success'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - uses: actions/download-artifact@v7
        with:
          pattern: bctn-*
          merge-multiple: true
          path: danh-muc/du_lieu/chien_luoc_dn
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Commit cache vào danh-muc
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          pip install -q -r requirements.txt > /dev/null && python -m ptcp.co_doanh_nghiep > /dev/null || true
          git add du_lieu/chien_luoc_dn ptcp/co_dn.json
          git commit -q -m "Chiến lược DN từ BCTN – lượt ${{ inputs.vong || '1' }} $(date +%F)" > /dev/null 2>&1 || { echo "Không có thay đổi"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Còn mã chưa xong → chạy lượt sau · xong → tổng hợp gửi Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          MA: ${{ inputs.ma }}
        run: |
          [ "${{ steps.cache_py.outputs.cache-hit }}" = "true" ] || pip install -q -r requirements.txt > /dev/null
          con=$(python -m ptcp.chien_luoc_dn con_lai ${MA:+--ma "$MA"} --tu ${{ inputs.tu || '2020' }} ${{ inputs.den && format('--den {0}', inputs.den) || '' }} | tail -1 | tr ',' '\n' | grep -c . || true)
          echo "Còn $con mã chưa xong sau lượt ${{ inputs.vong || '1' }}"
          gio=$(TZ=Asia/Ho_Chi_Minh date +%H)
          if [ "$con" -gt 0 ] && { [ "$gio" -ge 21 ] || [ "$gio" -lt 4 ]; } && [ "${{ inputs.vong || '1' }}" -lt "${{ inputs.vong_toi_da || '8' }}" ]; then
            gh workflow run doc_bctn.yml -R "${{ github.repository }}" -f ma="$MA" -f tu=${{ inputs.tu || '2020' }} -f den=${{ inputs.den }} \
              -f vong=$(( ${{ inputs.vong || '1' }} + 1 )) -f vong_toi_da=${{ inputs.vong_toi_da || '8' }}
            echo "→ đã gọi lượt $(( ${{ inputs.vong || '1' }} + 1 ))"
          elif [ "$con" -gt 0 ]; then
            echo "→ ngoài giờ đêm – dừng, đêm sau lịch chạy tiếp $con mã"
          elif [ "${{ needs.doc.result }}" != "skipped" ]; then
            python -m ptcp.chien_luoc_dn tong_hop --gui
          fi
