# DANH MỤC THẬT HẰNG NGÀY – chuyển từ repo riêng tư danh-muc (hết phút Actions) sang đây 10/2026, CHẠY KÍN:
#   repo này CÔNG KHAI (log ai cũng xem được) nên KHÔNG bước nào in nội dung danh mục: mọi đầu ra của chương trình
#   ghi vào file trong máy chạy rồi gửi Telegram (tóm tắt + dashboard + Excel); KHÔNG tải artifact; tổng vốn để ở
#   repo danh-muc (tien_mat_chinh.json / tien_mat_ptdttc.json – "tong_von_trieu" lần nhập gần nhất, giữ nguyên như
#   cũ); muốn đổi thì đặt SECRET TONG_VON_CHINH / TONG_VON_PTDTTC (bị che trong log) – không ghi số ở file này. Trạng thái cắt lỗ / lịch sử / tiền mặt / danh_muc.csv
#   commit về repo danh-muc bằng secret DANH_MUC_TOKEN_GHI (Contents: Read and write). Lỗi → chỉ in mã thoát.
#   Secret cần: DANH_MUC_TOKEN_GHI; tuỳ chọn TELEGRAM_TOKEN_DANH_MUC / TELEGRAM_CHAT_ID_DANH_MUC (trống → bot chung),
#   TONG_VON_CHINH / TONG_VON_PTDTTC (triệu đồng, chỉ khi đổi tổng tài sản), VNSTOCK_API_KEY. Giữ tiền mặt & cách chia
#   vốn theo luật Quỹ B trong code (không còn tham số GIU_TIEN_MAT / CHON).
#   Nhập lệnh: ghi dòng ngắn vào nhap.txt / nhap_ptdttc.txt ở repo danh-muc (VD "20/10 HPG 1000") → lần chạy kế tiếp
#   tự áp vào danh_muc.csv / da_ban.csv.
name: Danh muc hang ngay

on:
  schedule:
    - cron: "45 8 * * 1-5"        # 08:45 UTC = 15:45 giờ VN, thứ Hai → thứ Sáu
    - cron: "*/10 0-16 * * *"     # 7:00–23:59 giờ VN, mỗi 10 phút: CHỈ xem nhap.txt / nhap_ptdttc.txt ở danh-muc,
                                  # có dòng lệnh chưa áp mới chạy (sửa nhap.txt trên GitHub → ≤10–15 phút sau tự chạy)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  kiem:                                   # lịch 10 phút: chỉ chạy khi nhap*.txt có lệnh chưa áp và không có lần chạy khác
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chay: ${{ steps.k.outputs.chay }}
    steps:
      - id: k
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN_DM: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          REPO_DM: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
        run: |
          if [ "${{ github.event.schedule }}" != "*/10 0-16 * * *" ]; then echo "chay=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          dang=$(gh api "repos/${{ github.repository }}/actions/workflows/danh_muc.yml/runs?per_page=20" \
                 --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status != \"completed\")] | length" \
                 2>/dev/null || echo 0)
          co=0
          for f in nhap.txt nhap_ptdttc.txt; do
            if curl -sf -H "Authorization: Bearer $TOKEN_DM" -H "Accept: application/vnd.github.raw" \
                 "https://api.github.com/repos/$REPO_DM/contents/$f" | sed 's/#.*//' | grep -q '[A-Za-z0-9]'; then co=1; fi
          done
          if [ "$co" = 1 ] && [ "$dang" = 0 ]; then echo "chay=true" >> "$GITHUB_OUTPUT"; else echo "chay=false" >> "$GITHUB_OUTPUT"; fi
          echo "lệnh mới: $co · lần chạy khác đang chạy: $dang"

  chay:
    needs: kiem
    if: needs.kiem.outputs.chay == 'true'
    concurrency:
      group: danh-muc-that
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          path: danh-muc

      - uses: actions/checkout@v5                 # tổng kết tuần (thật + PTĐTTC) trong file HTML – code ở gia_lap
        with:
          repository: ${{ vars.GIA_LAP_REPO || 'mihhle2006-beep/gia_lap' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          path: gia_lap

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -q -r requirements.txt > /dev/null

      - name: Chạy danh mục chính (kín)
        env:
          TONG_VON: ${{ secrets.TONG_VON_CHINH }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          DM_CHI_LOI: "1"                  # tin hằng ngày: bước "Tóm tắt Telegram" (gộp thật + PTĐTTC)
        run: |
          # tổng vốn: secret nếu có, không thì giữ như cũ (lần nhập gần nhất lưu trong danh-muc) – không in ra log
          TONG_VON="${TONG_VON:-$(python -c 'import json; print(json.load(open("tien_mat_chinh.json"))["tong_von_trieu"])' 2>/dev/null)}"
          if [ -z "$TONG_VON" ]; then echo "::error::Chưa có tổng vốn – đặt secret TONG_VON_CHINH"; exit 1; fi
          ARGS="--khong_ve --tong_von $TONG_VON"
          ma=0; python -c "from dmuc.chuong_trinh import main; main()" $ARGS > ket_qua_log.txt 2>&1 || ma=$?
          echo "Danh mục chính: mã thoát $ma"
          gui=0; python gui_telegram.py > /tmp/gui_chinh.txt 2>&1 || gui=$?
          echo "Gửi Telegram: mã thoát $gui"

      - name: Danh mục PTĐTTC (kín)
        if: always() && hashFiles('danh-muc/danh_muc_ptdttc.csv') != ''
        env:
          TONG_VON: ${{ secrets.TONG_VON_PTDTTC }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          DM_TEN: ptdttc
          DM_LOG: ket_qua_log_ptdttc.txt
          DM_CHI_LOI: "1"
        run: |
          TONG_VON="${TONG_VON:-$(python -c 'import json; print(json.load(open("tien_mat_ptdttc.json"))["tong_von_trieu"])' 2>/dev/null)}"
          if [ -z "$TONG_VON" ]; then echo "::error::Chưa có tổng vốn PTĐTTC – đặt secret TONG_VON_PTDTTC"; exit 1; fi
          ma=0; python -c "from dmuc.chuong_trinh import main; main()" --khong_ve --khong_tran --ten ptdttc \
            --file danh_muc_ptdttc.csv --trang_thai trang_thai_ptdttc.json --lich_su lich_su_ptdttc.csv \
            --tong_von "$TONG_VON" --giu_tien_mat 0 > ket_qua_log_ptdttc.txt 2>&1 || ma=$?
          echo "Danh mục PTĐTTC: mã thoát $ma"
          gui=0; python gui_telegram.py > /tmp/gui_ptdttc.txt 2>&1 || gui=$?
          echo "Gửi Telegram: mã thoát $gui"

      - name: Tóm tắt Telegram (kín – gộp thật + PTĐTTC, 1 tin ngắn + trang HTML)
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          GIA_LAP_DIR: ${{ github.workspace }}/gia_lap
          TONG_KET_TUAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # thứ Sáu tự có; chạy tay → có
        run: |
          gui=0; python tom_tat_danh_muc.py > /tmp/tom_tat.txt 2>&1 || gui=$?
          echo "Tóm tắt Telegram: mã thoát $gui"

      - name: Danh mục cũ (kín)
        if: always() && hashFiles('danh-muc/danh_muc_cu.csv') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          ma=0; python -m dmuc.danh_muc_cu > /tmp/dm_cu.txt 2>&1 || ma=$?
          echo "Danh mục cũ: mã thoát $ma"

      - name: Lưu trạng thái về danh-muc
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in danh_muc.csv danh_muc_cu.csv danh_muc_ptdttc.csv trang_thai_ptdttc.json lich_su_ptdttc.csv \
                   tien_mat_chinh.json tien_mat_ptdttc.json trang_thai_vi_the.json gia_tham_chieu_quyen.json \
                   lich_su_danh_muc.csv nhap.txt nhap_ptdttc.txt da_ban.csv da_ban_ptdttc.csv cache_du_lieu; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -q -m "Cập nhật danh mục $(date +%F)" > /dev/null
          for i in 1 2 3; do
            if git pull -q --rebase --autostash > /dev/null 2>&1 && git push -q > /dev/null 2>&1; then echo "Đã lưu"; exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::Không đẩy được về danh-muc – kiểm tra secret DANH_MUC_TOKEN_GHI"; exit 1
