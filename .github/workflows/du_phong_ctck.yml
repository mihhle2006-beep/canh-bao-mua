# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI); code & dữ liệu ở repo riêng tư
# danh-muc (checkout bằng DANH_MUC_TOKEN_GHI). CONG_KHAI=1: không đọc / in danh mục thật.
# DỰ PHÓNG LNST CỦA CTCK vs HỆ THỐNG (19/11/2026 – chủ quỹ: "check học cùng công ty chứng khoán, bộ mô hình dự phóng ngta"):
# đọc PDF báo cáo phân tích (Simplize / CafeF) → bảng dự phóng LNST → so thực tế (kho BCTC) và cách dự phóng của hệ thống
# tại cùng ngày (danh-muc ptcp/du_phong_ctck.py). Chỉ bấm tay. Kết quả: log + artifact du_phong_ctck.csv; chữ PDF lưu đệm.
name: Du phong CTCK

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã (phân cách dấu phẩy; trống = ~60 mã phi tài chính nhiều báo cáo)"
        default: ""
      tu:
        description: "Báo cáo từ ngày"
        default: "2021-01-01"
      toi_da:
        description: "Tối đa báo cáo / mã (mỗi CTCK × nửa năm giữ 1, rải đều các nửa năm tới 10/2025)"
        default: "20"
      nhanh_danh_muc:
        description: "Nhánh repo danh-muc (trống = main)"
        default: ""

permissions:
  contents: read

jobs:
  du_phong:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          ref: ${{ inputs.nhanh_danh_muc || '' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json; [ "$(git config --get core.sparseCheckout)" = true ] || git sparse-checkout set --no-cone '/*' '!/danh_muc*.csv' '!/da_ban*.csv' '!/lenh_that*.csv' '!/tien_mat_*.json' '!/trang_thai_vi_the.json' '!/lich_su_danh_muc.csv' '!/nhap*.txt' '!/trung_vang*.json' 2>/dev/null || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Cài pdftotext (poppler-utils)
        run: command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
      - name: Lấy chữ PDF đã đọc lần trước
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu/du_phong_ctck
          key: du-phong-ctck-${{ github.run_id }}
          restore-keys: du-phong-ctck-
      - name: Đọc dự phóng CTCK & so hệ thống
        env:
          MA: ${{ inputs.ma }}
          TU: ${{ inputs.tu }}
          TOI_DA: ${{ inputs.toi_da }}
        run: python -m ptcp.du_phong_ctck ${MA:+--ma "$MA"} --tu "${TU:-2021-01-01}" --toi_da "${TOI_DA:-20}" --ra du_phong_ctck.csv
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: du-phong-ctck-${{ github.run_id }}
          path: danh-muc/du_phong_ctck.csv
          retention-days: 14
          if-no-files-found: ignore
