# DỮ LIỆU TRANG "TRA CỨU MÃ" (web docs/ma/ – GitHub Pages): danh-muc ptcp/web_tra_cuu.py dựng JSON từ số liệu CÔNG KHAI
# (kho BCTC Vietcap IQ, giá / tên / ngành VNDirect, kế hoạch ĐHCĐ, bất thường BCTC, chiến lược DN từ BCTN, bội số ngành,
# định giá hệ thống) – cùng cách tính file KQKD quý. KHÔNG đọc danh mục thật (xoá file trước khi chạy, CONG_KHAI=1).
# Kết quả → cache "tra-cuu-*" (không commit vào repo) → "Bang thi truong" lấy cache khi gói trang → gọi triển khai ngay.
#   • 06:41 giờ VN T2–T7: sau "BCTC moi hang dem" (04:15) – BCTC / bất thường / định giá mới nhất
#   • bấm tay khi cần
name: Du lieu tra cuu

on:
  schedule:
    - cron: "41 23 * * 0-5"        # 06:41 giờ VN thứ Hai – thứ Bảy
  workflow_dispatch:

permissions:
  contents: read
  actions: write                   # gọi bang_thi_truong.yml triển khai trang

concurrency:
  group: tra-cuu-web
  cancel-in-progress: false

jobs:
  dung:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Dựng dữ liệu tra cứu
        run: python -m ptcp.web_tra_cuu --ra "$GITHUB_WORKSPACE/docs/ma/du_lieu"

      - name: Lưu dữ liệu (cache cho Bang thi truong)
        uses: actions/cache/save@v5
        with:
          path: docs/ma/du_lieu
          key: tra-cuu-${{ github.run_id }}

      - name: Triển khai trang (gọi Bang thi truong)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/bang_thi_truong.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Đã gọi Bang thi truong" || echo "::warning::Gọi Bang thi truong lỗi – trang cập nhật ở lần chạy sau"
