# DỮ LIỆU TRANG "TRA CỨU MÃ" (web docs/ma/ – GitHub Pages): danh-muc ptcp/web_tra_cuu.py dựng JSON từ số liệu CÔNG KHAI
# (kho BCTC Vietcap IQ, giá / tên / ngành VNDirect, kế hoạch ĐHCĐ, bất thường BCTC, chiến lược DN từ BCTN, bội số ngành,
# định giá hệ thống) – cùng cách tính file KQKD quý. KHÔNG đọc danh mục thật (xoá file trước khi chạy, CONG_KHAI=1).
# + thi_truong/tra_cuu_dn.py (repo này): lịch sử giá ~2 năm, hồ sơ, cổ đông, sự kiện, giao dịch nội bộ, chỉ số theo quý, tin,
# báo cáo CTCK từ Vietcap IQ / CafeF / Simplize – xoay vòng mã cũ nhất trước trong giới hạn phút (Vietcap hay chặn).
# + thi_truong/canslim_web.py: điểm CANSLIM (C·A·N·S·L, RS kiểu IBD trong mọi mã, M VN-Index) ghi thêm vào ds.json.
# + thi_truong/xep_hang_web.py: xếp hạng A–F kiểu VGM (FiinTrade) – giá trị · tăng trưởng · động lượng.
# + thi_truong/su_kien_web.py: lịch sự kiện mọi mã (cổ tức tiền / cổ phiếu, phát hành, ĐHCĐ) −14 → +120 ngày.
# + thi_truong/rrg_web.py: đồ thị xoay vòng tương đối (RRG) ngành + mã so VN-Index, khung tuần / ngày.
# Kết quả → cache "tra-cuu-*" (không commit vào repo; lấy lại cache cũ trước để mã chưa tới lượt giữ file) → "Bang thi
# truong" lấy cache khi gói trang → gọi triển khai ngay.
#   • 06:41 giờ VN T2–T7: sau "BCTC moi hang dem" (04:15) – BCTC / bất thường / định giá mới nhất
#   • bấm tay khi cần
name: Du lieu tra cuu

on:
  schedule:
    - cron: "41 23 * * 0-5"        # 06:41 giờ VN thứ Hai – thứ Bảy
  workflow_dispatch:
    inputs:
      ma:
        description: "Chỉ lấy dữ liệu doanh nghiệp cho các mã này (trống = xoay vòng mọi mã)"
        default: ""
      phut:
        description: "Giới hạn phút cho phần doanh nghiệp"
        default: "40"
      lam_moi:
        description: "Làm cả mã đã cập nhật hôm nay (VD sau khi đổi định dạng dữ liệu)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                   # gọi bang_thi_truong.yml triển khai trang

concurrency:
  group: tra-cuu-web
  cancel-in-progress: false

jobs:
  gac:                             # lịch GitHub tới trễ mà đồng hồ / bấm tay đã chạy từ mốc này → bỏ lượt (gac.yml)
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gac.yml
    with:
      wf: tra_cuu_web.yml
    permissions:
      actions: read
      contents: read
  dung:
    needs: gac
    if: ${{ !cancelled() && needs.gac.outputs.chay != 'false' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 90                         # + nến phút mọi mã ~10–20 phút (lần đầu dài hơn)
    steps:
      - uses: actions/checkout@v5                   # repo này (thi_truong/tra_cuu_dn.py)
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Lấy dữ liệu lần trước (mã chưa tới lượt giữ file cũ)
        uses: actions/cache/restore@v5
        with:
          path: docs/ma/du_lieu
          key: tra-cuu-${{ github.run_id }}
          restore-keys: tra-cuu-

      - name: Dựng dữ liệu tra cứu (BCTC, định giá, kế hoạch, bất thường, chiến lược)
        run: |
          python -m ptcp.web_tra_cuu --ra "$GITHUB_WORKSPACE/docs/ma/du_lieu"
          # lệnh backtest luật hệ B theo mã (ptcp/lich_su_ma – workflow "Loc quy But Pha") → biểu đồ "Lệnh của hệ"
          cp ptcp/lich_su_lenh.json "$GITHUB_WORKSPACE/docs/ma/du_lieu/lenh_he.json" 2>/dev/null || echo "Chưa có lich_su_lenh.json"

      - name: Dữ liệu doanh nghiệp & giá (Vietcap IQ / CafeF / Simplize – xoay vòng)
        working-directory: .
        env:
          MA: ${{ inputs.ma }}
          PHUT: ${{ inputs.phut || '40' }}
          LAM_MOI: ${{ inputs.lam_moi && '--lam_moi' || '' }}
        run: python -m thi_truong.tra_cuu_dn --ra docs/ma/du_lieu --phut "$PHUT" --luong 8 $LAM_MOI ${MA:+--ma "$MA"}

      - name: Nến 1' / 5' (DNSE, ~3 tháng, MỌI mã + thi_truong/ma_them.txt) → phut/ – khung phút trang Biểu đồ
        working-directory: .
        timeout-minutes: 30
        run: python -m thi_truong.phut_web --ra docs/ma/du_lieu || echo "::warning::Nến phút lỗi – trang giữ dữ liệu cũ"

      - name: CANSLIM (C·A từ BCTC, N·S·L từ giá mọi mã, M VN-Index) → ds.json
        working-directory: .
        run: python -m thi_truong.canslim_web --ra docs/ma/du_lieu || echo "::warning::CANSLIM lỗi – trang giữ dữ liệu khác"

      - name: Xếp hạng A–F kiểu VGM (giá trị · tăng trưởng · động lượng) → ds.json
        working-directory: .
        run: python -m thi_truong.xep_hang_web --ra docs/ma/du_lieu || echo "::warning::Xếp hạng VGM lỗi – trang giữ dữ liệu khác"

      - name: Lịch sự kiện toàn thị trường (cổ tức, phát hành, ĐHCĐ) → su_kien.json
        working-directory: .
        run: python -m thi_truong.su_kien_web --ra docs/ma/du_lieu || echo "::warning::Lịch sự kiện lỗi – trang giữ dữ liệu khác"

      - name: Đồ thị RRG (ngành + mã so VN-Index, khung tuần / ngày) → rrg.json
        working-directory: .
        run: python -m thi_truong.rrg_web --ra docs/ma/du_lieu || echo "::warning::RRG lỗi – trang giữ dữ liệu khác"

      - name: VN-Index ngày từ 2010 (đường RS trang Biểu đồ) → vni.json
        working-directory: .
        run: python -m thi_truong.vni_web --ra docs/ma/du_lieu || echo "::warning::VN-Index lỗi – trang giữ dữ liệu cũ"

      - name: Dữ liệu hệ thống cho mục "Đọc biểu đồ" (điều kiện chọn mã Quỹ Bứt Phá + lịch sử tín hiệu bot) → he_thong.json, tin_hieu/
        working-directory: .
        run: python -m thi_truong.he_thong_web --ra docs/ma/du_lieu --loc danh-muc/ptcp/loc_quy_b.json --cau_hinh danh-muc/ptcp/cau_hinh.py || echo "::warning::Dữ liệu hệ thống lỗi – trang giữ dữ liệu khác"

      - name: Thống kê mẫu nến / mẫu hình / SMC trên 100 mã thanh khoản cho "Đọc biểu đồ" → thong_ke_mau.json
        working-directory: .
        run: node thi_truong/thong_ke_mau.js docs/ma/du_lieu danh-muc/ptcp/loc_quy_b.json 100 || echo "::warning::Thống kê mẫu lỗi – trang giữ dữ liệu cũ"

      - name: Lưu dữ liệu (cache cho Bang thi truong)
        uses: actions/cache/save@v5
        with:
          path: docs/ma/du_lieu
          key: tra-cuu-${{ github.run_id }}

      - name: Triển khai trang (gọi Bang thi truong)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/bang_thi_truong.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Đã gọi Bang thi truong" || echo "::warning::Gọi Bang thi truong lỗi – trang cập nhật ở lần chạy sau"
