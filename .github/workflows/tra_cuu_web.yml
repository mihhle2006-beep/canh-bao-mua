# DỮ LIỆU TRANG "TRA CỨU MÃ" (web docs/ma/ – GitHub Pages): danh-muc ptcp/web_tra_cuu.py dựng JSON từ số liệu CÔNG KHAI
# (kho BCTC Vietcap IQ, giá / tên / ngành VNDirect, kế hoạch ĐHCĐ, bất thường BCTC, chiến lược DN từ BCTN, bội số ngành,
# định giá hệ thống) – cùng cách tính file KQKD quý. KHÔNG đọc danh mục thật (xoá file trước khi chạy, CONG_KHAI=1).
# + thi_truong/tra_cuu_dn.py (repo này): lịch sử giá ~2 năm, hồ sơ, cổ đông, sự kiện, giao dịch nội bộ, chỉ số theo quý, tin,
# báo cáo CTCK từ Vietcap IQ / CafeF / Simplize – xoay vòng mã cũ nhất trước trong giới hạn phút (Vietcap hay chặn).
# + thi_truong/canslim_web.py: điểm CANSLIM (C·A·N·S·L, RS kiểu IBD trong mọi mã, M VN-Index) ghi thêm vào ds.json.
# + thi_truong/xep_hang_web.py: xếp hạng A–F kiểu VGM (FiinTrade) – giá trị · tăng trưởng · động lượng.
# + thi_truong/su_kien_web.py: lịch sự kiện mọi mã (cổ tức tiền / cổ phiếu, phát hành, ĐHCĐ) −14 → +120 ngày.
# + thi_truong/rrg_web.py: đồ thị xoay vòng tương đối (RRG) ngành + mã so VN-Index, khung tuần / ngày.
# Kết quả → cache "tra-cuu-*" (không commit vào repo; lấy lại cache cũ trước để mã chưa tới lượt giữ file) → "Bang thi
# truong" lấy cache khi gói trang → gọi triển khai ngay.
#   • 06:41 giờ VN T2–T7: sau "BCTC moi hang dem" (04:15) – BCTC / bất thường / định giá mới nhất
#   • 15:45 giờ VN T2–T6 – SAU PHIÊN (sau danh mục 15:02, tổng kết 15:20): lượt NHẸ – bỏ BCTC / dự phóng CTCK / xoay vòng
#     Vietcap, chỉ nến 1' / 5' mọi mã → ghép nến ngày còn thiếu vào gia/<MÃ>.json (cả phiên vừa đóng) + bộ lọc → triển
#     khai: biểu đồ Tra cứu mã đủ phiên ngay chiều hôm đó (27/11/2026: VIC nhảy 23 → 27 vì chưa tới lượt xoay vòng)
#   • bấm tay khi cần
# SAO LƯU (19/11/2026): cache Actions không vĩnh viễn (7 ngày không dùng / repo > 10 GB → xoá) – mất thì phải tải lại mọi
# mã vài giờ, Vietcap IQ dễ chặn. Lượt thứ Bảy (hoặc bấm tay sao_luu) nén docs/ma/du_lieu (dữ liệu CÔNG KHAI, đã đăng
# trên Pages) → tài sản du_lieu.tar.zst của bản phát hành "sao-luu-tra-cuu" (ghi đè, không phình lịch sử git); lượt nào
# không lấy được cache thì khôi phục từ bản sao lưu trước khi chạy.
name: Du lieu tra cuu

on:
  schedule:
    - cron: "41 23 * * 0-5"        # 06:41 giờ VN thứ Hai – thứ Bảy
    - cron: "45 8 * * 1-5"         # 15:45 giờ VN T2–T6 – lượt nhẹ sau phiên (đồng hồ gọi sau_phien=true)
  workflow_dispatch:
    inputs:
      sau_phien:
        description: "Lượt nhẹ sau phiên: chỉ nến phút → ghép nến ngày + bộ lọc (bỏ BCTC, dự phóng CTCK, xoay vòng Vietcap)"
        type: boolean
        default: false
      ma:
        description: "Chỉ lấy dữ liệu doanh nghiệp cho các mã này (trống = xoay vòng mọi mã)"
        default: ""
      phut:
        description: "Giới hạn phút cho phần doanh nghiệp"
        default: "40"
      lam_moi:
        description: "Làm cả mã đã cập nhật hôm nay (VD sau khi đổi định dạng dữ liệu)"
        type: boolean
        default: false
      sao_luu:
        description: "Sao lưu dữ liệu lên bản phát hành sao-luu-tra-cuu ngay (thường tự làm lượt thứ Bảy)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                   # gọi bang_thi_truong.yml triển khai trang

concurrency:
  group: tra-cuu-web
  cancel-in-progress: false

jobs:
  gac:                             # lịch GitHub tới trễ mà đồng hồ / bấm tay đã chạy từ mốc này → bỏ lượt (gac.yml)
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gac.yml
    with:
      wf: tra_cuu_web.yml
    permissions:
      actions: read
      contents: read
  dung:
    needs: gac
    if: ${{ !cancelled() && needs.gac.outputs.chay != 'false' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    permissions:
      contents: write              # tạo / ghi đè tài sản bản phát hành sao-luu-tra-cuu (sao lưu tuần)
      actions: write               # gọi bang_thi_truong.yml triển khai trang
    env:
      CONG_KHAI: "1"
      SAU_PHIEN: ${{ inputs.sau_phien == true || github.event.schedule == '45 8 * * 1-5' }}
    timeout-minutes: 90                         # + nến phút mọi mã ~10–20 phút (lần đầu dài hơn)
    steps:
      - uses: actions/checkout@v5                   # repo này (thi_truong/tra_cuu_dn.py)
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json; [ "$(git config --get core.sparseCheckout)" = true ] || git sparse-checkout set --no-cone '/*' '!/danh_muc*.csv' '!/da_ban*.csv' '!/lenh_that*.csv' '!/tien_mat_*.json' '!/trang_thai_vi_the.json' '!/lich_su_danh_muc.csv' '!/nhap*.txt' '!/trung_vang*.json' 2>/dev/null || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Lấy dữ liệu lần trước (mã chưa tới lượt giữ file cũ)
        id: kho
        uses: actions/cache/restore@v5
        with:
          path: docs/ma/du_lieu
          key: tra-cuu-${{ github.run_id }}
          restore-keys: tra-cuu-

      - name: Mất cache → khôi phục từ bản sao lưu tuần (bản phát hành sao-luu-tra-cuu)
        if: steps.kho.outputs.cache-matched-key == ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download sao-luu-tra-cuu -p du_lieu.tar.zst -D "$RUNNER_TEMP" -R "$GITHUB_REPOSITORY"; then
            mkdir -p docs/ma && tar --zstd -xf "$RUNNER_TEMP/du_lieu.tar.zst" -C docs/ma
            echo "::warning::Không có cache tra-cuu – đã khôi phục bản sao lưu tuần ($(du -sh docs/ma/du_lieu | cut -f1))"
          else
            echo "::warning::Không có cache tra-cuu và chưa có bản sao lưu – tải lại từ đầu"
          fi

      - name: Dựng dữ liệu tra cứu (BCTC, định giá, kế hoạch, bất thường, chiến lược)
        if: env.SAU_PHIEN != 'true'
        run: |
          python -m ptcp.web_tra_cuu --ra "$GITHUB_WORKSPACE/docs/ma/du_lieu"
          # lệnh backtest luật hệ B theo mã (ptcp/lich_su_ma – workflow "Loc quy But Pha") → biểu đồ "Lệnh của hệ"
          cp ptcp/lich_su_lenh.json "$GITHUB_WORKSPACE/docs/ma/du_lieu/lenh_he.json" 2>/dev/null || echo "Chưa có lich_su_lenh.json"

      # DỰ PHÓNG LNST CTCK (19/11/2026 – danh-muc ptcp/du_phong_ctck.py): báo cáo CTCK 120 ngày của mọi mã bản đồ ngành → đọc
      # PDF (chữ lưu đệm, chỉ tải báo cáo mới) → đồng thuận · hệ thống · kết hợp ½–½ → du_phong.json (tab Định giá). Lỗi / quá
      # giờ → giữ file lần trước (cache tra-cuu), các bước khác vẫn chạy.
      - name: Cài pdftotext + OCR tiếng Việt (dự phóng CTCK)
        if: env.SAU_PHIEN != 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-vie
      - name: Lấy chữ PDF báo cáo CTCK đã đọc (chung với workflow Du phong CTCK)
        if: env.SAU_PHIEN != 'true'
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu/du_phong_ctck
          key: du-phong-ctck-${{ github.run_id }}
          restore-keys: du-phong-ctck-
      - name: Dự phóng LNST CTCK 120 ngày + hệ thống + kết hợp ½–½ → du_phong.json
        if: env.SAU_PHIEN != 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          OCR_GIAY: "600"   # OCR (PDF ảnh / bảng dán ảnh) tối đa 10 phút CPU / lượt – phần còn lại OCR lượt sau (chữ lưu đệm)
        run: |
          ra="$GITHUB_WORKSPACE/docs/ma/du_lieu/du_phong.json"
          python -m ptcp.du_phong_ctck --web "$ra.moi" && mv "$ra.moi" "$ra" \
            || echo "::warning::Dự phóng CTCK lỗi – trang giữ du_phong.json lần trước"

      - name: Dữ liệu doanh nghiệp & giá (Vietcap IQ / CafeF / Simplize – xoay vòng)
        if: env.SAU_PHIEN != 'true'
        working-directory: .
        env:
          MA: ${{ inputs.ma }}
          PHUT: ${{ inputs.phut || '40' }}
          LAM_MOI: ${{ inputs.lam_moi && '--lam_moi' || '' }}
        run: python -m thi_truong.tra_cuu_dn --ra docs/ma/du_lieu --phut "$PHUT" --luong 8 $LAM_MOI ${MA:+--ma "$MA"}

      - name: Nến 1' / 5' (DNSE, ~3 tháng, MỌI mã + thi_truong/ma_them.txt) → phut/ – khung phút trang Biểu đồ
        working-directory: .
        timeout-minutes: 30
        run: python -m thi_truong.phut_web --ra docs/ma/du_lieu || echo "::warning::Nến phút lỗi – trang giữ dữ liệu cũ"

      - name: CANSLIM (C·A từ BCTC, N·S·L từ giá mọi mã, M VN-Index) → ds.json
        working-directory: .
        run: python -m thi_truong.canslim_web --ra docs/ma/du_lieu || echo "::warning::CANSLIM lỗi – trang giữ dữ liệu khác"

      - name: Bộ lọc kỹ thuật (lãi 1T–1N, so MA, RSI, KL đột biến, nền tích lũy / VCP) → ds.json
        working-directory: .
        run: python -m thi_truong.ky_thuat_web --ra docs/ma/du_lieu || echo "::warning::Bộ lọc kỹ thuật lỗi – trang giữ dữ liệu khác"

      - name: Xếp hạng A–F kiểu VGM (giá trị · tăng trưởng · động lượng) → ds.json
        working-directory: .
        run: python -m thi_truong.xep_hang_web --ra docs/ma/du_lieu || echo "::warning::Xếp hạng VGM lỗi – trang giữ dữ liệu khác"

      - name: Lịch sự kiện toàn thị trường (cổ tức, phát hành, ĐHCĐ) → su_kien.json
        working-directory: .
        run: python -m thi_truong.su_kien_web --ra docs/ma/du_lieu || echo "::warning::Lịch sự kiện lỗi – trang giữ dữ liệu khác"

      - name: Đồ thị RRG (ngành + mã so VN-Index, khung tuần / ngày) → rrg.json
        working-directory: .
        run: python -m thi_truong.rrg_web --ra docs/ma/du_lieu || echo "::warning::RRG lỗi – trang giữ dữ liệu khác"

      - name: VN-Index ngày từ 2010 (đường RS trang Biểu đồ) → vni.json
        working-directory: .
        run: python -m thi_truong.vni_web --ra docs/ma/du_lieu || echo "::warning::VN-Index lỗi – trang giữ dữ liệu cũ"

      - name: Phản ứng giá sau BCTC (tab Lịch sử giá) + kiểm định PEAD in ra log → ma/<MÃ>.json "pu"
        working-directory: .
        run: python -m thi_truong.phan_ung_bctc --ra docs/ma/du_lieu --kho danh-muc/du_lieu/bctc --pead || echo "::warning::Phản ứng BCTC lỗi – trang giữ dữ liệu khác"

      - name: Dữ liệu hệ thống cho mục "Đọc biểu đồ" (điều kiện chọn mã Quỹ Bứt Phá + lịch sử tín hiệu bot) → he_thong.json, tin_hieu/
        working-directory: .
        run: python -m thi_truong.he_thong_web --ra docs/ma/du_lieu --loc danh-muc/ptcp/loc_quy_b.json --cau_hinh danh-muc/ptcp/cau_hinh.py || echo "::warning::Dữ liệu hệ thống lỗi – trang giữ dữ liệu khác"

      - name: Thống kê mẫu nến / mẫu hình / SMC trên 100 mã thanh khoản cho "Đọc biểu đồ" → thong_ke_mau.json
        working-directory: .
        run: node thi_truong/thong_ke_mau.js docs/ma/du_lieu danh-muc/ptcp/loc_quy_b.json 100 || echo "::warning::Thống kê mẫu lỗi – trang giữ dữ liệu cũ"

      - name: Lưu dữ liệu (cache cho Bang thi truong)
        uses: actions/cache/save@v5
        with:
          path: docs/ma/du_lieu
          key: tra-cuu-${{ github.run_id }}

      - name: Sao lưu tuần (thứ Bảy / bấm tay) → bản phát hành sao-luu-tra-cuu
        if: github.ref == 'refs/heads/main'
        working-directory: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SAO_LUU: ${{ inputs.sao_luu }}
        run: |
          [ "$(TZ=Asia/Ho_Chi_Minh date +%u)" = 6 ] || [ "$SAO_LUU" = true ] || { echo "Không phải lượt sao lưu"; exit 0; }
          [ -d docs/ma/du_lieu ] && [ -f docs/ma/du_lieu/ds.json ] || { echo "::warning::Thiếu dữ liệu – không sao lưu"; exit 0; }
          tar --zstd -cf "$RUNNER_TEMP/du_lieu.tar.zst" -C docs/ma du_lieu
          gh release view sao-luu-tra-cuu -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create sao-luu-tra-cuu \
            -R "$GITHUB_REPOSITORY" --latest=false --title "Sao lưu dữ liệu Tra cứu mã" \
            --notes "Bản nén docs/ma/du_lieu (dữ liệu công khai của trang Tra cứu mã) – workflow Du lieu tra cuu ghi đè mỗi thứ Bảy; dùng khi mất cache Actions."
          gh release upload sao-luu-tra-cuu "$RUNNER_TEMP/du_lieu.tar.zst" --clobber -R "$GITHUB_REPOSITORY"
          echo "Đã sao lưu $(du -h "$RUNNER_TEMP/du_lieu.tar.zst" | cut -f1) ($(find docs/ma/du_lieu -type f | wc -l) tệp)"

      - name: Triển khai trang (gọi Bang thi truong)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/bang_thi_truong.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Đã gọi Bang thi truong" || echo "::warning::Gọi Bang thi truong lỗi – trang cập nhật ở lần chạy sau"
