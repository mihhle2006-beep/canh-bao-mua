# Quét SIÊU CỔ PHIẾU TIỀM NĂNG (bộ lọc bo_loc/, chiến lược sieu_cp) – MỖI THÁNG 1 LẦN, toàn sàn HOSE:
# vốn hoá ≤ 10.000 tỷ + thanh khoản tăng ≥ 1,3× (cộng điểm nền co, gần đỉnh 52T, xu hướng tăng).
# Gửi file HTML (bản người ngoài) qua Telegram. KHÔNG ghi vào ma_mua_bo_loc.json (danh sách MUA hằng ngày ở quet_dinh_ky.yml).
# Repo CÔNG KHAI: không quét / gửi mã PTĐTTC.
name: Sieu CP hang thang

on:
  schedule:
    - cron: "20 9 1 * *"           # 16:20 giờ VN ngày 1 hằng tháng (dữ liệu tới phiên gần nhất)
  workflow_dispatch:
    inputs:
      tham_so:
        description: "Tham số cho bộ lọc"
        default: "--nhom hose"
      gui_telegram:
        description: "Gửi file HTML qua Telegram"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sieu-cp-thang
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Khôi phục bộ nhớ đệm giá & cơ bản
        uses: actions/cache@v5
        with:
          path: |
            du_lieu_gia
            du_lieu_co_ban
          key: bo-loc-${{ github.run_id }}
          restore-keys: bo-loc-

      - name: Lấy ptcp – lõi dùng chung (repo danh-muc)
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.PTCP_REPO || vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}
        run: python lay_ptcp.py

      - name: Quét toàn sàn HOSE – sieu_cp
        env:
          MPLBACKEND: Agg
          THAM_SO: ${{ inputs.tham_so || '--nhom hose' }}
        run: python -m bo_loc --chien_luoc sieu_cp --khong_bieu_do $THAM_SO

      - name: Lưu kết quả chi tiết (Excel / HTML)
        if: always() && hashFiles('ket_qua_loc_*/**') != ''
        uses: actions/upload-artifact@v6
        with:
          name: sieu-cp-${{ github.run_id }}
          path: ket_qua_loc_*/
          retention-days: 35

      - name: Gửi file HTML qua Telegram
        if: github.event_name == 'schedule' || inputs.gui_telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bo_loc.gui_html --chien_luoc sieu_cp --chi_html --che_do ngoai || true
