# BẢNG THỊ TRƯỜNG (trang web docs/thi_truong/ – GitHub Pages): chỉ số, VN-Index trong phiên, bản đồ nhiệt HOSE, thống kê
# phiên, tác động lên VN-Index, lọc mã. Dữ liệu thị trường công khai + RIÊNG cột mã đang giữ (mục 💼, xem bước bên dưới).
#   • Trong giờ giao dịch: nhip_thi_truong.yml gọi 15' một lần (Tra cứu mã: nến phút, bước giá, giá trong phiên) + 15:10
#     chốt phiên: chụp bảng giá → du_lieu.json → triển khai Pages. BẢNG THỊ TRƯỜNG cập nhật ~30 giây ở repo riêng
#     bang-thi-truong (13/11/2026 – bang_rieng/bang.yml, thi_truong/vong_bang.py), không còn chạy 2' / lần ở đây.
#   • Trang Tra cứu mã docs/ma/: dữ liệu từ workflow "Du lieu tra cuu" (cache tra-cuu-*), gói cùng mỗi lần triển khai.
#   • 19:07: chuẩn bị cho phiên sau (lịch sử 260 phiên, khối ngoại / tự doanh, ngành, hồ sơ thanh khoản) → cache.
# Cần bật 1 lần: Settings → Pages → Build and deployment → Source: "GitHub Actions". Chưa bật → chỉ dựng, bỏ qua triển khai.
name: Bang thi truong

on:
  schedule:
    - cron: "10 8 * * 1-5"         # 15:10 chốt phiên (dự phòng cho máy nhịp)
    - cron: "7 12 * * 1-5"         # 19:07 chuẩn bị phiên sau
  push:
    branches: [main]
    paths: ["docs/**", "thi_truong/**", "trang_bang/**", "bang_rieng/**", ".github/workflows/bang_thi_truong.yml"]   # giao diện / code đổi → triển khai ngay
  workflow_dispatch:
    inputs:
      chuan_bi:
        description: "Dựng lại dữ liệu chuẩn bị (lịch sử, ngành…) trước khi chụp"
        type: boolean
        default: false
      ghi_nhanh:
        description: "(thử nghiệm) đẩy du_lieu.json về nhánh đang chạy"
        type: boolean
        default: false
      chi_bang:
        description: "Chỉ dựng bảng → trang riêng bang-thi-truong (bỏ nến phút / bước giá / triển khai Pages canh-bao-mua)"
        type: boolean
        default: false

permissions:
  contents: read

# Khoá TỪNG JOB (10/11/2026, trước là khoá cả workflow): Pages kẹt chỉ làm chờ bước triển khai – dựng dữ liệu & đẩy nhánh
# du-lieu-nhanh của lượt sau vẫn chạy. Mỗi khoá: 1 job chạy + 1 chờ (lượt chờ cũ hơn bị thay bởi lượt mới).
jobs:
  gac:                             # lịch GitHub tới trễ mà đồng hồ / bấm tay đã chạy từ mốc này → bỏ lượt (gac.yml). 14/11/2026:
    if: github.event_name == 'schedule'   # lịch 19:07 tới 02:30 → dựng lại chuẩn bị lúc nguồn đêm quá hạn → lượt lỗi
    uses: ./.github/workflows/gac.yml
    with:
      wf: bang_thi_truong.yml
    permissions:
      actions: read
      contents: read
  dung:
    needs: gac
    if: ${{ !cancelled() && needs.gac.outputs.chay != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: bang-thi-truong
      cancel-in-progress: false
    permissions:
      contents: write              # chỉ dùng khi ghi_nhanh (nhánh thử nghiệm)
    outputs:
      pages: ${{ steps.pages.outputs.bat }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Khôi phục dữ liệu chuẩn bị
        uses: actions/cache/restore@v5
        with:
          path: cache_thi_truong
          key: tt-${{ github.run_id }}
          restore-keys: tt-

      # Mã đang giữ cho mục 💼 của trang (chủ quỹ 05/11/2026 chọn hiện công khai): CHỈ cột mã danh_muc.csv của repo kín
      # danh-muc qua API (không checkout repo kín, không số lượng / giá vốn) → file tạm ngoài repo; log chỉ in SỐ mã.
      # Chỉ trên main (nhánh thử nghiệm có thể đẩy du_lieu.json lên repo công khai).
      - name: Mã đang giữ (chỉ mã – không in ra log)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
        run: |
          F="$RUNNER_TEMP/ma_giu.txt"
          curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
               "https://api.github.com/repos/$REPO/contents/danh_muc.csv" \
            | python3 -c "import csv,io,sys; r=csv.DictReader(io.StringIO(sys.stdin.read().lstrip(chr(65279)))); print(','.join(sorted({(x.get('ma') or '').strip().upper() for x in r} - {''})))" \
            > "$F" || : > "$F"
          echo "MA_GIU_FILE=$F" >> "$GITHUB_ENV"
          echo "Mã đang giữ: $(tr ',' '\n' < "$F" | grep -c . || true) mã"

      - name: Dựng dữ liệu
        env:
          CHUAN_BI: ${{ (github.event.schedule == '7 12 * * 1-5' || inputs.chuan_bi) && '--chuan_bi' || '' }}
        run: |
          mkdir -p cache_thi_truong
          T0=$(stat -c %Y cache_thi_truong/chuan_bi.json 2>/dev/null || echo 0)
          python -m thi_truong $CHUAN_BI
          T1=$(stat -c %Y cache_thi_truong/chuan_bi.json 2>/dev/null || echo 0)
          if [ "$T1" != "$T0" ]; then echo "LUU_CACHE=1" >> "$GITHUB_ENV"; fi

      - name: Lưu dữ liệu chuẩn bị
        if: env.LUU_CACHE == '1'
        uses: actions/cache/save@v5
        with:
          path: cache_thi_truong
          key: tt-${{ github.run_id }}

      - name: (thử nghiệm) đẩy du_lieu.json về nhánh
        if: inputs.ghi_nhanh && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f docs/thi_truong/du_lieu.json
          git commit -m "Bảng thị trường: dữ liệu mẫu [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF#refs/heads/}

      - name: Pages đã bật chưa
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MA=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$MA" = "200" ]; then echo "bat=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::GitHub Pages chưa bật (HTTP $MA) – Settings → Pages → Source: GitHub Actions. Bỏ qua triển khai."
               echo "bat=0" >> "$GITHUB_OUTPUT"; fi

      - name: Lấy dữ liệu trang Tra cứu mã (workflow "Du lieu tra cuu" – cache mới nhất)
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang
        uses: actions/cache/restore@v5
        with:
          path: docs/ma/du_lieu
          key: tra-cuu-${{ github.run_id }}
          restore-keys: tra-cuu-

      # Nến 1' / 5' HÔM NAY cho trang Biểu đồ (trong giờ giao dịch, mỗi lần chạy): nối nến mới vào bản dựng sáng của "Du lieu tra cuu"
      # cho ~60 mã thanh khoản cao nhất + mã đang giữ + mã bot đang khuyến nghị / bộ lọc. Chỉ vào bản triển khai (không lưu cache).
      - name: Nến phút hôm nay (trang Biểu đồ)
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang
        timeout-minutes: 4
        continue-on-error: true
        run: |
          GIO=$(TZ=Asia/Ho_Chi_Minh date +%H%M); THU=$(TZ=Asia/Ho_Chi_Minh date +%u)
          if [ "$THU" -le 5 ] && [ "$GIO" -ge 912 ] && [ "$GIO" -le 1515 ] && [ -d docs/ma/du_lieu/gia ]; then
            python -m thi_truong.phut_web --ra docs/ma/du_lieu --trong_phien --them_file "${MA_GIU_FILE:-}" \
              --tin_hieu docs/thi_truong/du_lieu.json --bo_loc ma_mua_bo_loc.json
          else echo "Ngoài giờ giao dịch – bỏ qua"; fi

      - name: Khớp theo bước giá hôm nay (trang Biểu đồ – Tự vẽ)
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang
        timeout-minutes: 3
        continue-on-error: true
        run: |
          GIO=$(TZ=Asia/Ho_Chi_Minh date +%H%M); THU=$(TZ=Asia/Ho_Chi_Minh date +%u)
          if [ "$THU" -le 5 ] && [ "$GIO" -ge 912 ] && [ "$GIO" -le 1515 ] && [ -d docs/ma/du_lieu/gia ]; then
            # KHÔNG thêm mã đang giữ (--them_file): danh sách file bước giá công khai sẽ lộ danh mục; quỹ chỉ mua top 100 GTGD
            python -m thi_truong.buoc_gia_web --ra docs/ma/du_lieu --tin_hieu docs/thi_truong/du_lieu.json --bo_loc ma_mua_bo_loc.json
          else echo "Ngoài giờ giao dịch – bỏ qua"; fi

      # chứng quyền (dữ liệu thị trường công khai, ~400 mã CW, 1–2 lệnh gọi): mọi lượt – giá CW đổi thì giá hoà vốn đổi
      - name: Chứng quyền (trang Biểu đồ – lớp hoà vốn / đáo hạn)
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang
        timeout-minutes: 2
        continue-on-error: true
        run: python -m thi_truong.chung_quyen_web --ra docs/ma/du_lieu

      - name: Gói trang
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang
        run: |
          mkdir -p _site && cp -r docs/. _site/
          # mã bản = băm CODE từng trang (không đổi khi chỉ dữ liệu đổi) → trang đang mở tự tải lại khi có bản mới
          sed -i "s/__BAN__/$(cat docs/ma/index.html docs/ma/*.js | sha1sum | cut -c1-10)/" _site/ma/index.html

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang
        with:
          path: _site

      - name: Gói bảng riêng (trang + dữ liệu + workflow + dữ liệu chuẩn bị)
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _bang/wf && cp docs/thi_truong/du_lieu.json trang_bang/index.html trang_bang/icon-*.png \
            trang_bang/manifest.webmanifest _bang/ && cp bang_rieng/*.yml _bang/wf/
          sed -i "s/__BAN__/$(sha1sum < trang_bang/index.html | cut -c1-10)/" _bang/index.html
          # dữ liệu chuẩn bị (thị trường công khai, ~1,3 MB) cho vòng bảng ở repo riêng – đẩy khi vừa dựng lại
          if [ -f cache_thi_truong/chuan_bi.json ]; then cp cache_thi_truong/chuan_bi.json _bang/; fi
          if [ "${LUU_CACHE:-}" = 1 ]; then touch _bang/cb_moi; fi

      - name: Gói cho trang riêng
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: bang-rieng
          path: _bang
          retention-days: 1

  # 10/11/2026 chủ quỹ "tách repo": TRANG RIÊNG bang-thi-truong (Pages chỉ ~vài trăm KB – không kẹt theo 95 MB Tra cứu).
  # 13/11/2026: trong phiên repo đó TỰ cập nhật ~30 giây / lượt (bang_rieng/bang.yml + thi_truong/vong_bang.py – đồng hồ gọi
  # 08:50 / 12:50); lượt của canh-bao-mua (15' / lần, chốt phiên, 19:07, đổi code) vẫn đẩy trang + du_lieu.json (mã đang giữ
  # cho vòng) lên nhánh du-lieu rồi gọi trien_khai.yml, đẩy dữ liệu chuẩn bị (nhánh chuan-bi) khi vừa dựng lại, và đồng bộ
  # MỌI workflow bản gốc bang_rieng/*.yml sang nhánh main repo đó. Token DANH_MUC_TOKEN_GHI phải được cấp repo này (Contents +
  # Actions + Workflows R/W); chưa cấp / chưa có repo → bỏ qua, không làm hỏng lượt.
  bang_rieng:
    needs: dung
    if: ${{ !cancelled() && needs.dung.result == 'success' && needs.dung.outputs.pages == '1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    concurrency:
      group: bang-thi-truong-rieng
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: bang-rieng
          path: bang
      - name: Đẩy trang bảng lên repo riêng + triển khai
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.BANG_REPO || format('{0}/bang-thi-truong', github.repository_owner) }}
        run: |
          H=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json")
          if ! curl -sf "${H[@]}" "https://api.github.com/repos/$REPO" > /dev/null; then
            echo "::notice::Chưa có repo $REPO hoặc token chưa được cấp quyền → bỏ qua trang riêng"; exit 0; fi
          cd bang
          git init -q -b du-lieu
          git add index.html du_lieu.json icon-*.png manifest.webmanifest
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Bảng thị trường $(date -u +%FT%TZ)"
          U="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if [ -z "$(git ls-remote "$U" refs/heads/main)" ]; then            # repo mới: main (workflow) TRƯỚC – nhánh đầu = mặc định
            mkdir -p ../main/.github/workflows && cp wf/*.yml ../main/.github/workflows/
            printf '# Bảng thị trường\nTrang riêng (GitHub Pages) – workflow bản gốc ở canh-bao-mua/bang_rieng.\n' > ../main/README.md
            (cd ../main && git init -q -b main && git add -A \
              && git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
                   commit -qm "Workflow bảng thị trường (từ canh-bao-mua/bang_rieng)" \
              && git push -q "$U" main && echo "Đã tạo nhánh main + workflow")
          elif git clone -q --depth 1 -b main "$U" ../main && ! diff -rq wf ../main/.github/workflows > /dev/null 2>&1; then
            # bản gốc bang_rieng/*.yml đổi → cập nhật workflow ở main (token cần quyền Workflows; lỗi → chỉ cảnh báo,
            # lượt này vẫn chạy bằng workflow cũ)
            (cp wf/*.yml ../main/.github/workflows/ && cd ../main && git add .github/workflows \
              && git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
                   commit -qm "Cập nhật workflow (từ canh-bao-mua/bang_rieng)" \
              && git push -q "$U" main && echo "Đã cập nhật workflow $REPO") \
              || echo "::warning::Không cập nhật được workflow ở $REPO (token thiếu quyền Workflows?)"
          fi
          git push -qf "$U" du-lieu
          # dữ liệu chuẩn bị cho vòng bảng (nhánh chuan-bi, 1 commit ghi đè): vừa dựng lại hoặc nhánh chưa có
          if [ -f chuan_bi.json ] && { [ -f cb_moi ] || [ -z "$(git ls-remote "$U" refs/heads/chuan-bi)" ]; }; then
            mkdir -p ../cb && cp chuan_bi.json ../cb/ && (cd ../cb && git init -q -b chuan-bi && git add chuan_bi.json \
              && git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
                   commit -qm "Dữ liệu chuẩn bị $(date -u +%FT%TZ)" && git push -qf "$U" chuan-bi && echo "Đã đẩy dữ liệu chuẩn bị") \
              || echo "::warning::Không đẩy được dữ liệu chuẩn bị lên $REPO"
          fi
          curl -sf -X POST "${H[@]}" "https://api.github.com/repos/$REPO/actions/workflows/trien_khai.yml/dispatches" \
            -d '{"ref":"main"}' && echo "Đã gọi triển khai $REPO"

  trien_khai:
    needs: dung
    if: ${{ !cancelled() && needs.dung.result == 'success' && needs.dung.outputs.pages == '1' && github.ref == 'refs/heads/main' && !inputs.chi_bang }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25                # 05/11/2026: Pages chậm / kẹt > 10' (3 lần liền) – chờ tới 20' trước khi huỷ
    concurrency:
      group: bang-thi-truong-trien-khai
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dp.outputs.page_url }}thi_truong/
    steps:
      - id: dp
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000             # 20 phút (mặc định 10) – kẹt hẳn thì đồng hồ chạy lại / commit sau triển khai
