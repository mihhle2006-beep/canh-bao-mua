# BẢNG THỊ TRƯỜNG (trang web docs/thi_truong/ – GitHub Pages): chỉ số, VN-Index trong phiên, bản đồ nhiệt HOSE, thống kê
# phiên, tác động lên VN-Index, lọc mã. Dữ liệu thị trường công khai + RIÊNG cột mã đang giữ (mục 💼, xem bước bên dưới).
#   • Trong giờ giao dịch: nhip_thi_truong.yml gọi 5' một lần (lịch "*/5" của GitHub hay trễ / bỏ hẳn – 05/11/2026 không
#     chạy lần nào) + 15:10 chốt phiên dự phòng: chụp bảng giá → du_lieu.json → triển khai Pages.
#   • 19:07: chuẩn bị cho phiên sau (lịch sử 260 phiên, khối ngoại / tự doanh, ngành, hồ sơ thanh khoản) → cache.
# Cần bật 1 lần: Settings → Pages → Build and deployment → Source: "GitHub Actions". Chưa bật → chỉ dựng, bỏ qua triển khai.
name: Bang thi truong

on:
  schedule:
    - cron: "10 8 * * 1-5"         # 15:10 chốt phiên (dự phòng cho máy nhịp)
    - cron: "7 12 * * 1-5"         # 19:07 chuẩn bị phiên sau
  push:
    branches: [main]
    paths: ["docs/**", "thi_truong/**", ".github/workflows/bang_thi_truong.yml"]   # giao diện / code đổi → triển khai ngay
  workflow_dispatch:
    inputs:
      chuan_bi:
        description: "Dựng lại dữ liệu chuẩn bị (lịch sử, ngành…) trước khi chụp"
        type: boolean
        default: false
      ghi_nhanh:
        description: "(thử nghiệm) đẩy du_lieu.json về nhánh đang chạy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bang-thi-truong
  cancel-in-progress: false

jobs:
  dung:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write              # chỉ dùng khi ghi_nhanh (nhánh thử nghiệm)
    outputs:
      pages: ${{ steps.pages.outputs.bat }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Khôi phục dữ liệu chuẩn bị
        uses: actions/cache/restore@v5
        with:
          path: cache_thi_truong
          key: tt-${{ github.run_id }}
          restore-keys: tt-

      # Mã đang giữ cho mục 💼 của trang (chủ quỹ 05/11/2026 chọn hiện công khai): CHỈ cột mã danh_muc.csv của repo kín
      # danh-muc qua API (không checkout repo kín, không số lượng / giá vốn) → file tạm ngoài repo; log chỉ in SỐ mã.
      # Chỉ trên main (nhánh thử nghiệm có thể đẩy du_lieu.json lên repo công khai).
      - name: Mã đang giữ (chỉ mã – không in ra log)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
        run: |
          F="$RUNNER_TEMP/ma_giu.txt"
          curl -sf -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github.raw" \
               "https://api.github.com/repos/$REPO/contents/danh_muc.csv" \
            | python3 -c "import csv,io,sys; r=csv.DictReader(io.StringIO(sys.stdin.read().lstrip(chr(65279)))); print(','.join(sorted({(x.get('ma') or '').strip().upper() for x in r} - {''})))" \
            > "$F" || : > "$F"
          echo "MA_GIU_FILE=$F" >> "$GITHUB_ENV"
          echo "Mã đang giữ: $(tr ',' '\n' < "$F" | grep -c . || true) mã"

      - name: Dựng dữ liệu
        env:
          CHUAN_BI: ${{ (github.event.schedule == '7 12 * * 1-5' || inputs.chuan_bi) && '--chuan_bi' || '' }}
        run: |
          mkdir -p cache_thi_truong
          T0=$(stat -c %Y cache_thi_truong/chuan_bi.json 2>/dev/null || echo 0)
          python -m thi_truong $CHUAN_BI
          T1=$(stat -c %Y cache_thi_truong/chuan_bi.json 2>/dev/null || echo 0)
          if [ "$T1" != "$T0" ]; then echo "LUU_CACHE=1" >> "$GITHUB_ENV"; fi

      - name: Lưu dữ liệu chuẩn bị
        if: env.LUU_CACHE == '1'
        uses: actions/cache/save@v5
        with:
          path: cache_thi_truong
          key: tt-${{ github.run_id }}

      - name: (thử nghiệm) đẩy du_lieu.json về nhánh
        if: inputs.ghi_nhanh && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f docs/thi_truong/du_lieu.json
          git commit -m "Bảng thị trường: dữ liệu mẫu [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF#refs/heads/}

      - name: Pages đã bật chưa
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MA=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$MA" = "200" ]; then echo "bat=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::GitHub Pages chưa bật (HTTP $MA) – Settings → Pages → Source: GitHub Actions. Bỏ qua triển khai."
               echo "bat=0" >> "$GITHUB_OUTPUT"; fi

      - name: Gói trang
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main'
        run: mkdir -p _site && cp -r docs/. _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.bat == '1' && github.ref == 'refs/heads/main'
        with:
          path: _site

  trien_khai:
    needs: dung
    if: needs.dung.outputs.pages == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dp.outputs.page_url }}thi_truong/
    steps:
      - id: dp
        uses: actions/deploy-pages@v4
