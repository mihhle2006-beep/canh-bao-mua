# LỆNH QUA TELEGRAM – mỗi giờ (cả cuối tuần; Telegram chỉ giữ tin chưa đọc 24 giờ): đọc tin chủ quỹ nhắn cho bot danh mục
# → nối vào nhap.txt repo danh-muc (canh_bao/lenh_tele.py). Trong phiên vòng quét 15' (canh_bao.yml) nghe liên tục (trả lời sau vài giây) và gọi
# danh mục ngay; ngoài phiên lệnh được áp lúc 08:30 / 15:02. Log chỉ in số lượng (repo công khai).
name: Lenh Telegram

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenh-tele
  cancel-in-progress: false

jobs:
  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            canh_bao/lenh_tele.py
            canh_bao/suat.py
          sparse-checkout-cone-mode: false
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN_DANH_MUC: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC }}
          TELEGRAM_CHAT_ID_DANH_MUC: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC }}
          DANH_MUC_TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          DANH_MUC_REPO: ${{ vars.DANH_MUC_REPO }}
        run: python3 canh_bao/lenh_tele.py
