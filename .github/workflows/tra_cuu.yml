# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI. CONG_KHAI=1: không đọc / in danh mục
# thật hay mã PTĐTTC (ptcp.cau_hinh.CONG_KHAI).
# TRA CỨU MÃ – bấm "Run workflow", nhập mã (VD HPG,FPT) → P/E, P/B, EPS, BVPS, số CP, ROE, điểm tài chính,
# chất lượng lợi nhuận, cảnh báo lệch nguồn. Kết quả ở trang Summary của lần chạy (+ Telegram nếu chọn).
# Thứ Bảy 08:00 giờ VN: TỰ KIỂM DỮ LIỆU NGUỒN trên mã mẫu (ptcp/cau_hinh.py MA_KIEM_NGUON) – chỉ nhắn Telegram khi
# có lệch (LNST 4 quý, số CP, BVPS so với VNDirect; LNST quá cũ).
name: Tra cuu ma

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã cổ phiếu, phân cách dấu phẩy (VD HPG,FPT)"
        default: "HPG"
      gui_telegram:
        description: "Gửi kết quả qua Telegram"
        type: boolean
        default: true
  schedule:
    - cron: "53 0 * * 6"           # 07:53 thứ Bảy giờ VN – tự kiểm nguồn (trước lịch sử 09:07 & tổng kết tuần)

permissions:
  contents: read

jobs:
  tra_cuu:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json trang_thai_ptdttc.json lich_su_danh_muc.csv lich_su_ptdttc.csv nhap*.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Tra cứu / tự kiểm nguồn
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          MA: ${{ inputs.ma }}
          GUI: ${{ inputs.gui_telegram && '--gui' || '' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m ptcp.tra_cuu --kiem
          else
            python -m ptcp.tra_cuu --ma "$MA" $GUI
          fi
