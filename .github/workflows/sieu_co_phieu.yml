# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI. CONG_KHAI=1: không đọc / in danh mục
# thật (ptcp.cau_hinh.CONG_KHAI).
# SIÊU CỔ PHIẾU – đặc điểm các mã tăng ≥ 100% / 12 tháng TRƯỚC khi tăng (phan_tich_sieu_cp.py). Kết quả: log + Artifacts.
# che_do = loc_ma: backtest CHIẾN LƯỢC LỌC MÃ độc lập (bt_loc_ma.py – top 15 mã theo bộ lọc / điểm, cân lại mỗi quý,
# so VN-Index · rổ đều · 1.000 rổ ngẫu nhiên; luật đạt đặt trước trong docstring). Lượt loc_ma (lịch 16/2 · 5 · 8 · 11 hoặc
# bấm tay, code danh-muc main) ghi danh sách chiến lược lọc mã kỳ gần nhất (chỉ chiến lược đạt kiểm định hiện trên web) vào thi_truong/chien_luoc.json → tab Lọc mã của Bảng thị
# trường (nhóm CHIẾN LƯỢC) đọc ở lượt dựng trang kế tiếp.
# che_do = phan_bo: backtest PHƯƠNG PHÁP PHÂN BỔ DANH MỤC (bt_phan_bo.py – 13 phương pháp của Cẩm nang × 10 loại danh mục
# × 200 danh mục ngẫu nhiên, cân đầu tháng 2016 → nay; luật "tối ưu" đặt trước trong docstring). Chỉ bấm tay.
name: Sieu co phieu

on:
  schedule:
    - cron: "23 3 16 2,5,8,11 *"     # 10:23 giờ VN ngày 16 tháng cân (kỳ 15/2 · 5 · 8 · 11): loc_ma → danh sách chiến lược mới
  workflow_dispatch:
    inputs:
      ma:
        description: "Danh sách mã (all = mọi mã ngành + huỷ niêm yết + kho BCTC)"
        default: "all"
      tu:
        description: "Từ năm"
        default: "2013"
      che_do:
        description: "sieu = đặc điểm siêu cổ phiếu · loc_ma = backtest chiến lược lọc mã (bt_loc_ma.py) · phan_bo = backtest phương pháp phân bổ (bt_phan_bo.py)"
        type: choice
        options: [sieu, loc_ma, phan_bo]
        default: sieu
      xem:
        description: "loc_ma: mã cần soi, cách nhau dấu phẩy – bộ lọc nào chọn được mã trước khi tăng (trống = không)"
        default: ""
      nhanh_danh_muc:
        description: "Nhánh repo danh-muc để chạy (trống = main) – thử code chưa gộp"
        default: ""

permissions:
  contents: write                   # loc_ma: commit thi_truong/chien_luoc.json (danh sách chiến lược cho tab Lọc mã)

jobs:
  phan_tich:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          ref: ${{ inputs.nhanh_danh_muc || '' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json; [ "$(git config --get core.sparseCheckout)" = true ] || git sparse-checkout set --no-cone '/*' '!/danh_muc*.csv' '!/da_ban*.csv' '!/lenh_that*.csv' '!/tien_mat_*.json' '!/trang_thai_vi_the.json' '!/lich_su_danh_muc.csv' '!/nhap*.txt' '!/trung_vang*.json' 2>/dev/null || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Lấy cache giá lần trước
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu
          key: gia-ngay-sieu-${{ github.run_id }}
          # gia-san-: đệm Backtest quy But Pha (giá HOSE + HNX + số CP đã tra) – lượt loc_ma 19/11 không có nó mất 150 phút tải
          restore-keys: |
            gia-san-
            gia-ngay-
      - name: Phân tích
        env:
          MA: ${{ inputs.ma || 'all' }}
          TU: ${{ inputs.tu || '2013' }}
          CHE_DO: ${{ inputs.che_do || 'loc_ma' }}            # lịch quý → loc_ma
          XEM: ${{ inputs.xem }}
        run: |
          if [ "$CHE_DO" = loc_ma ]; then python bt_loc_ma.py --ma "$MA" --tu "$TU" --xem "$XEM"
          elif [ "$CHE_DO" = phan_bo ]; then python bt_phan_bo.py --ma "$MA" --tu "$TU"
          else python phan_tich_sieu_cp.py --ma "$MA" --tu "$TU"; fi
      - uses: actions/checkout@v5                 # loc_ma: danh sách chiến lược kỳ gần nhất → trang (chỉ code danh-muc main)
        if: (inputs.che_do || 'loc_ma') == 'loc_ma' && !inputs.nhanh_danh_muc && hashFiles('danh-muc/chien_luoc_ky.json') != ''
        with:
          path: cbm
      - name: Lưu danh sách chiến lược lọc mã lên trang (thi_truong/chien_luoc.json)
        if: (inputs.che_do || 'loc_ma') == 'loc_ma' && !inputs.nhanh_danh_muc && hashFiles('danh-muc/chien_luoc_ky.json') != ''
        working-directory: cbm
        run: |
          cp ../danh-muc/chien_luoc_ky.json thi_truong/chien_luoc.json
          git add thi_truong/chien_luoc.json
          if git diff --cached --quiet; then echo "Danh sách chiến lược không đổi"; exit 0; fi
          git config user.name "github-actions[bot]"                 # cả rebase lúc pull cũng cần tên người commit
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Chiến lược lọc mã kỳ $(jq -r .ngay_can thi_truong/chien_luoc.json) – danh sách tab Lọc mã"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sieu-co-phieu-${{ github.run_id }}
          path: |
            danh-muc/sieu_co_phieu.xlsx
            danh-muc/bt_loc_ma.xlsx
            danh-muc/bt_phan_bo.xlsx
          retention-days: 30
          if-no-files-found: ignore
