# TẢI NẾN 15' HẰNG TUẦN cho backtest điểm vào (toàn sàn HOSE + HNX): chỉ tải phần mới → giữ cache backtest không bị GitHub xoá
# (7 ngày không dùng) và tích luỹ lịch sử 15' dài hơn giới hạn ~1 năm của nguồn. Cùng nhóm concurrency với Backtest.
name: Tai nen 15p

on:
  schedule:
    - cron: "43 18 * * 6"          # 18:43 UTC thứ Bảy = 01:43 giờ VN Chủ nhật
  workflow_dispatch:

permissions:
  contents: write                  # đẩy bản nén nến 15' lên Release nen-15p (bền, không bị xoá như cache)

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  tai:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Lấy ptcp – MỘT nguồn duy nhất (repo danh-muc)
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.PTCP_REPO || vars.DANH_MUC_REPO }}
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}
        run: python lay_ptcp.py

      - name: Khôi phục cache backtest
        uses: actions/cache/restore@v5
        with:
          path: |
            cache_gia
            cache_ptcp
            cache_du_lieu
          key: bt-${{ github.run_id }}
          restore-keys: |
            bt-
            gia-

      # Cache bị GitHub xoá (7 ngày không dùng / quá 10 GB) → lấy lại lịch sử từ Release trước khi tải phần mới
      - name: Khôi phục nến 15' từ Release (nếu cache mất)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls cache_gia/*_15_lich_su.csv >/dev/null 2>&1 && { echo "Cache còn nến 15'"; exit 0; }
          gh release download nen-15p -p nen_15p.tar.gz -R "$GITHUB_REPOSITORY" 2>/dev/null \
            && tar -xzf nen_15p.tar.gz && rm -f nen_15p.tar.gz && echo "Đã lấy lại nến 15' từ Release" \
            || echo "Chưa có Release nen-15p"

      - name: Tải phần nến 15' mới
        timeout-minutes: 100
        run: python chay.py --che_do tai_nen

      - name: Lưu cache backtest (kể cả khi lỗi / hết giờ)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            cache_gia
            cache_ptcp
            cache_du_lieu
          key: bt-${{ github.run_id }}

      - name: Lưu nến 15' lên Release nen-15p (bản bền, ghi đè bản cũ – đã gồm toàn bộ lịch sử)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls cache_gia/*_15_lich_su.csv >/dev/null 2>&1 || { echo "Không có nến 15' – bỏ qua"; exit 0; }
          tar -czf nen_15p.tar.gz cache_gia/*_15_lich_su.csv
          ls -lh nen_15p.tar.gz
          gh release view nen-15p -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create nen-15p -R "$GITHUB_REPOSITORY" \
            --title "Nến 15' toàn sàn (tự cập nhật hằng tuần)" --notes "Tải nen_15p.tar.gz – giải nén ra cache_gia/<MÃ>_15_lich_su.csv"
          gh release upload nen-15p nen_15p.tar.gz --clobber -R "$GITHUB_REPOSITORY"
