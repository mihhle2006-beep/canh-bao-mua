# QUÉT MÃ PTĐTTC – CHẠY KÍN ngay bằng bộ lọc bo_loc/ của repo này (10/2026 gộp repo Bo_Loc vào đây): lay_ptcp.py chép
# ptcp + danh_muc_ptdttc.csv từ danh-muc (CHEP_PTDTTC=1 – chỉ workflow này), quét đúng các mã PTĐTTC
# (quet_dinh_ky --chi_ptdttc), gửi tin 📌 PTĐTTC. Repo này CÔNG KHAI: mọi đầu ra chỉ ghi file trong
# máy chạy, log chỉ in mã thoát, không artifact, KHÔNG cache (giá các mã PTĐTTC không lưu lại ở đây).
name: Quet PTDTTC

on:
  schedule:
    - cron: "11 8 * * 1-5"         # 15:11 giờ VN mỗi phiên T2–T6 (lệch Quet dinh ky 15:05 – không tải giá cùng lúc)
  workflow_dispatch:
    inputs:
      gui_telegram:
        description: "Gửi tin 📌 PTĐTTC qua Telegram"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: quet-ptdttc
  cancel-in-progress: false

jobs:
  quet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài thư viện
        run: pip install -q -r requirements.txt > /dev/null

      - name: Lấy ptcp + danh_muc_ptdttc.csv (repo danh-muc)
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}
          CHEP_PTDTTC: "1"
        run: |
          ma=0; python lay_ptcp.py > /tmp/lay_ptcp.txt 2>&1 || ma=$?
          echo "Lấy ptcp: mã thoát $ma"; exit $ma

      - name: Quét mã PTĐTTC (kín)
        env:
          MPLBACKEND: Agg
        run: |
          ma=0; python -m bo_loc.quet_dinh_ky --chi_ptdttc --chien_luoc quy_b,xu_huong > /tmp/ptdttc.txt 2>&1 || ma=$?
          echo "Quét PTĐTTC: mã thoát $ma"; exit $ma

      # lịch tự động: gửi mỗi phiên (tắt bằng biến repo PTDTTC_KHONG_GUI = 1); chạy tay: ô gui_telegram
      - name: Gửi tin 📌 PTĐTTC (kín)
        if: inputs.gui_telegram || (github.event_name == 'schedule' && vars.PTDTTC_KHONG_GUI != '1')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ma=0; python -m bo_loc.gui_html --chi_ptdttc > /tmp/gui_ptdttc.txt 2>&1 || ma=$?
          echo "Gửi Telegram: mã thoát $ma"; exit $ma
