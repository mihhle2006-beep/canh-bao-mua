# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI. CONG_KHAI=1: không đọc / in danh mục
# thật (ptcp.cau_hinh.CONG_KHAI).
# BACKTEST QUỸ BỨT PHÁ – đúng luật QUY_* (chay_backtest_quy_b.py), rổ HOSE + HNX (RO_BT=hose_hnx, luôn kèm mã đã huỷ
# niêm yết; hạng GTGD / RS / biến động tính trong rổ). Các phần thử nghiệm đã có kết luận đã xoá: von3–von54 (kết luận
# ở danh-muc ptcp/cau_hinh.py), von55–von72 (28/10/2026) và von73–von84 (29/10/2026) – kết luận ở danh-muc
# KET_LUAN_BACKTEST_CU.md; code xem lịch sử git:
#   chuan – mốc luật đang áp dụng (khớp như live – nền v2; B, B + Trứng, + hệ bắt đáy) + ★ ngẫu nhiên + đối chiếu giả lập
#           (lịch hằng tháng)
#   von86 – tài khoản thật: B + Trứng vàng + hệ bắt đáy CHUNG DÒNG TIỀN – số lần thiếu tiền, lệnh mua trễ, hệ vào / bỏ
#   von93 – biến thể chỉ báo (đổi cách tính) × khung ngày / tuần / gộp: nghiên cứu sự kiện + giả dược, thử trên quỹ
#   von92 – độ bền luật "dự báo học dần → ½ rủi ro": lưới λ / ngưỡng / hệ số + 30 giả dược xoay vòng thời gian
#   von91 – điểm thị trường tổng hợp 19 chỉ số: dự báo đỉnh / đáy + rủi ro / thoát theo điểm trên quỹ
#   von90 – 16 chỉ báo đỉnh thị trường (Ichimoku, Stochastic, độ rộng, Hindenburg…): nghiên cứu sự kiện + thử trên quỹ
#   von89 – khoá lãi cả danh mục sau sóng lớn (NAV rơi từ đỉnh → bán ½ / hết)
#   von88 – chẩn đoán năm 2026: lãi theo tháng, lệnh 2026, phễu lọc tín hiệu, tắt từng phần luật
#   von87 – thoát ngắn kiểu "người 3" (cắt lỗ −2 %, chốt +3…6 %, giữ ≤ 5 phiên) trên chính điểm vào Quỹ B
#   von96 – cờ doanh nghiệp (bất thường BCTC / đổi chiến lược) có giúp lệnh B không + giả dược
#   von95 – đà mạnh (điểm xu hướng ≥ +50%) → tiền nhàn rỗi vào VN-Index thay Trứng + giả dược
#   von94 – nhiệt thị trường mở rộng ~18 nhóm chỉ báo × tham số (chọn 2013–19, kiểm 2020+) + 30 giả dược
#   von85 – luật mới 29/10/2026 (độ rộng × ½ + hệ bắt đáy bán mở cửa như bot) so với luật cũ + breakout nóng có điều kiện
# Kết quả: log + Artifacts (backtest_quy_b_<phần>.xlsx).
name: Backtest quy But Pha

on:
  schedule:
    - cron: "13 2 1 * *"            # 09:13 giờ VN ngày 1 hằng tháng: phần chuan (mốc luật hiện tại + đối chiếu giả lập)
    - cron: "29 3 2 1,4,7,10 *"     # 10:29 giờ VN ngày 2 đầu mỗi QUÝ: KIỂM LẠI các luật đã loại trên dữ liệu mới (von91–95:
                                    # điểm thị trường, độ bền dự báo, chỉ báo × khung, xu hướng, đà mạnh → VN30) – gửi
                                    # bảng kết quả qua Telegram để xem luật nào nay hơn gốc / hơn giả dược
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã tải giá (HOSE, HNX = toàn sàn; all = bản đồ ngành + kho BCTC + cache – rổ cũ, thiên lệch sống sót)"
        default: "HOSE,HNX"
      tu:
        description: "Từ ngày"
        default: "2012-01-01"
      phan:
        description: "Phần chạy: chuan / von85 / von86 / von87 / von88 / von89 / von90 / von91 / von92 / von93 / von94 / von95 / von96 (phân cách dấu phẩy; all = tất cả) – phần cũ von55–von84 đã xoá, kết luận ở danh-muc/KET_LUAN_BACKTEST_CU.md"
        default: "chuan"
      co_huy:
        description: "Thêm mã phá sản / huỷ niêm yết (true/false)"
        default: "true"
      dung_lai_ngay:
        description: "Dùng lại tín hiệu backtest đã lưu ≤ N ngày (0 = tính lại mỗi ngày; thử luật quỹ: 7)"
        default: "7"
      so_nn:
        description: "Số lần chạy ngẫu nhiên đối chứng (trống = mặc định của phần; 200 ≈ thêm 1–1,5 giờ)"
        default: ""
      nhanh_danh_muc:
        description: "Nhánh repo danh-muc để chạy (trống = main) – thử code chưa gộp"
        default: ""

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        phan: [chuan, von85, von86, von87, von88, von89, von90, von91, von92, von93, von94, von95, von96]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
      PYTHONUNBUFFERED: "1"            # log hiện tiến độ ngay (không gom từng đợt vài phút)
    timeout-minutes: 300
    steps:
      - name: Bỏ qua phần không chọn
        id: chon
        working-directory: .
        env:
          PHAN: ${{ inputs.phan || (github.event.schedule == '29 3 2 1,4,7,10 *' && 'von91,von92,von93,von94,von95' || 'chuan') }}   # lịch tháng → chuan · lịch quý → kiểm lại luật đã loại
        run: |
          case ",$PHAN," in *",${{ matrix.phan }},"*|*",all,"*) echo "chay=1" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v5
        if: steps.chon.outputs.chay
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          ref: ${{ inputs.nhanh_danh_muc || '' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt
      - uses: actions/checkout@v5                 # phần chuan: đối chiếu giả lập (repo kín – chỉ gửi Telegram)
        if: steps.chon.outputs.chay && matrix.phan == 'chuan'
        continue-on-error: true
        with:
          repository: ${{ vars.GIA_LAP_REPO || 'mihhle2006-beep/gia_lap' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: gia_lap
      - uses: actions/setup-python@v6
        if: steps.chon.outputs.chay
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        if: steps.chon.outputs.chay
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.chon.outputs.chay && steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Lấy cache giá lần trước
        if: steps.chon.outputs.chay
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu
          # giá toàn sàn HOSE + HNX (+ BCTC mã mới ở cache_du_lieu/bctc_moi) dùng chung mọi phần
          key: gia-san-${{ matrix.phan }}-${{ github.run_id }}
          restore-keys: |
            gia-san-
            gia-ngay-
      - name: Backtest (${{ matrix.phan }})
        if: steps.chon.outputs.chay
        env:
          TU: ${{ inputs.tu || '2012-01-01' }}
          MA: ${{ inputs.ma || 'HOSE,HNX' }}
          RO_BT: hose_hnx
          CO_HUY: ${{ inputs.co_huy || 'true' }}
          DUNG_LAI: ${{ inputs.dung_lai_ngay || '7' }}
          PHAN: ${{ matrix.phan }}
          SO_NN: ${{ inputs.so_nn }}
          # chỉ phần chuan gửi 1 tin đối chiếu giả lập (cùng bot giả lập); các phần khác không gửi Telegram
          TELEGRAM_TOKEN: ${{ matrix.phan == 'chuan' && (secrets.TELEGRAM_TOKEN_GIA_LAP || secrets.TELEGRAM_TOKEN) || '' }}
          TELEGRAM_CHAT_ID: ${{ matrix.phan == 'chuan' && (secrets.TELEGRAM_CHAT_ID_GIA_LAP || secrets.TELEGRAM_CHAT_ID) || '' }}
        run: |
          case "$PHAN" in
            von93) export CHI_VON93=1; unset SO_NN ;;          # biến thể chỉ báo × khung ngày / tuần
            von94) export CHI_VON94=1; unset SO_NN ;;          # nhiệt mở rộng + giả dược
            von95) export CHI_VON95=1; unset SO_NN ;;          # đà mạnh → VN-Index
            von96) export CHI_VON96=1; unset SO_NN ;;          # cờ doanh nghiệp
            von92) export CHI_VON92=1; unset SO_NN ;;          # độ bền luật dự báo học dần (lưới + giả dược)
            von91) export CHI_VON91=1; unset SO_NN ;;          # điểm thị trường tổng hợp
            von90) export CHI_VON90=1; unset SO_NN ;;          # chỉ báo đỉnh thị trường
            von89) export CHI_VON89=1; unset SO_NN ;;          # khoá lãi cả danh mục (13 cấu hình)
            von88) export CHI_VON88=1; unset SO_NN ;;          # chẩn đoán năm 2026 (5 cấu hình)
            von87) export CHI_VON87=1; unset SO_NN ;;          # thoát ngắn kiểu người 3 trên điểm vào B (8 cấu hình)
            von86) export CHI_VON86=1; unset SO_NN ;;          # tài khoản thật: B + Trứng + bắt đáy chung tiền (2 luật × 20 thứ tự ★)
            von85) export CHI_VON85=1; unset SO_NN ;;          # luật mới khớp như bot + BO nóng có điều kiện (5 biến thể × 20 thứ tự ★)
            chuan) export CHI_CHUAN=1                          # mốc luật hiện tại + ★ ngẫu nhiên 50 lần
                   if [ -d ../gia_lap ]; then export GIA_LAP_DIR=../gia_lap; fi ;;   # + đối chiếu giả lập
          esac
          # BCTC mã mới (chưa có trong kho repo) tải ở lần trước → nạp lại, khỏi tải lại (~40 phút với toàn sàn HNX);
          # cuối bước (kể cả khi lỗi) chép BCTC mới tải vào cache_du_lieu/bctc_moi (được lưu cùng cache giá)
          if [ -d cache_du_lieu/bctc_moi ]; then cp -n cache_du_lieu/bctc_moi/*.json du_lieu/bctc/ 2>/dev/null || true; fi
          trap 'mkdir -p cache_du_lieu/bctc_moi; git ls-files --others --exclude-standard du_lieu/bctc | xargs -r cp -t cache_du_lieu/bctc_moi/' EXIT
          set -o pipefail
          python chay_backtest_quy_b.py --tu "$TU" ${MA:+--ma "$MA"} --ra "backtest_quy_b_${PHAN}.xlsx" \
            --dung_lai_ngay "${DUNG_LAI:-0}" \
            $([ "$CO_HUY" = "true" ] && echo --co_huy) 2>&1 | tee "../kiem_lai_${PHAN}.txt"
      - name: Gửi kết quả kiểm lại hằng quý (Telegram)
        if: always() && steps.chon.outputs.chay && github.event.schedule == '29 3 2 1,4,7,10 *'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_GIA_LAP || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_GIA_LAP || secrets.TELEGRAM_CHAT_ID }}
          PHAN: ${{ matrix.phan }}
        working-directory: .
        run: |
          f="kiem_lai_${PHAN}.txt"; [ -s "$f" ] && [ -n "$TELEGRAM_TOKEN" ] || exit 0
          sed -n "/^${PHAN} –/,\$p" "$f" | grep -v "Warning\|^ *mt = " > "kq_${PHAN}.txt" || true
          [ -s "kq_${PHAN}.txt" ] || cp "$f" "kq_${PHAN}.txt"
          curl -sS -o /dev/null -w "Telegram %{http_code}\n" -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"kq_${PHAN}.txt" \
            -F caption="🔁 Kiểm lại quý ${PHAN} trên dữ liệu mới – luật đã loại nay có hơn gốc / giả dược không?" \
            "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
      - uses: actions/upload-artifact@v6
        if: always() && steps.chon.outputs.chay
        with:
          name: backtest-quy-b-${{ matrix.phan }}-${{ github.run_id }}
          path: danh-muc/backtest_quy_b_${{ matrix.phan }}.xlsx
          retention-days: 30
          if-no-files-found: ignore
