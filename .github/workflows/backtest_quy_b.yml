# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI. CONG_KHAI=1: không đọc / in danh mục
# thật hay mã PTĐTTC (ptcp.cau_hinh.CONG_KHAI).
# BACKTEST QUỸ B – đúng luật QUY_* (chay_backtest_quy_b.py). Các phần thử nghiệm đã có kết luận đã xoá (10/2026,
# xem lịch sử git):
#   chuan – mốc luật đang áp dụng + ★ ngẫu nhiên + đối chiếu giả lập (lịch hằng tháng)
#   von3  – tăng CAGR bằng vốn: rủi ro/lệnh, rủi ro mở, số mã, trần/mã, mã mới/tuần, nhồi 3 lần, tổ hợp
#   von4  – độ chắc mã mới/tuần 4–6 × rủi ro 0,75–1%, ★ ngẫu nhiên 50 lần, chẩn đoán 6/tuần
#   von5  – cải thiện danh mục: nới 9/10 mã theo chế độ thị trường, KL theo ★, đổi mã yếu, mức phí, tổ hợp
#   von12 – tăng CAGR / không lỡ lệnh lớn: chẩn đoán lệnh ≥5R bị lỡ, suất dự phòng rộng, rủi ro mở, nạp thêm, đổi mã chậm
#   von11 – cải thiện tỷ lệ thắng / lệnh lớn: xác nhận vào, khoá lãi, thoát MA20 tuần, nhồi, độ rộng yếu
#   von10 – đối chứng suất dự phòng: tín hiệu mạnh B so với cờ ngẫu nhiên cùng tỷ lệ, 9 mã mọi lúc
#   von9  – không lỡ lệnh lớn: cắt lệnh chết, suất dự phòng, đổi mã chết, vào trễ, ★ lệnh lớn (nền mới)
#   von8  – kiểm định chắc các ứng viên (phân bố xếp ngẫu nhiên, CAGR bỏ 2020–21)
#   von7  – bỏ mã đầu cơ: giá thấp, trần/sàn liên tục, biến động cao, thanh khoản không bền, vốn hoá nhỏ, tăng nóng
#   von6  – rổ mã: HOSE (như bot) / + HNX / + UPCoM × top 100–300 GTGD, cắt lệnh chết, tổ hợp (thêm toàn sàn HOSE + HNX)
# RỔ (input ro, 10/2026): hose_hnx = HOSE + HNX (MẶC ĐỊNH – người dùng chọn 17/10/2026) · hose = toàn sàn HOSE – luôn kèm mã đã huỷ
# niêm yết; giá tải cho cả HOSE + HNX (cache gia-san-), hạng GTGD / RS / độ rộng tính trong rổ. Rổ cũ (bản đồ ngành +
# kho BCTC, ma: all) chọn mã đã biết hôm nay → thiên lệch sống sót (CAGR 17,7% so với 12,7% trên HOSE thật).
# Kết quả: log + Artifacts (backtest_quy_b_<phần>_<rổ>.xlsx).
name: Backtest quy B

on:
  schedule:
    - cron: "13 2 1 * *"            # 09:13 giờ VN ngày 1 hằng tháng: phần chuan (mốc luật hiện tại + đối chiếu giả lập)
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã tải giá (HOSE, HNX = toàn sàn; all = bản đồ ngành + kho BCTC + cache – rổ cũ, thiên lệch sống sót)"
        default: "HOSE,HNX"
      tu:
        description: "Từ ngày"
        default: "2012-01-01"
      phan:
        description: "Phần chạy: chuan / von3 / von4 / von5 / von6 / von7 / von8 / von9 / von10 / von11 / von12 (phân cách dấu phẩy; all = tất cả)"
        default: "chuan"
      co_huy:
        description: "Thêm mã phá sản / huỷ niêm yết (true/false)"
        default: "true"
      dung_lai_ngay:
        description: "Dùng lại tín hiệu backtest đã lưu ≤ N ngày (0 = tính lại mỗi ngày; thử luật quỹ: 7)"
        default: "7"
      so_nn:
        description: "Số lần chạy ngẫu nhiên đối chứng (trống = mặc định của phần; 200 ≈ thêm 1–1,5 giờ)"
        default: ""
      ro:
        description: "Rổ mua: hose (như bot) / hose_hnx / cả hai (phân cách dấu phẩy); trống = tải gì mua nấy"
        default: "hose_hnx"
      nhanh_danh_muc:
        description: "Nhánh repo danh-muc để chạy (trống = main) – thử code chưa gộp"
        default: ""

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        phan: [chuan, von3, von4, von5, von6, von7, von8, von9, von10, von11, von12]
        ro: [hose, hose_hnx]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
      PYTHONUNBUFFERED: "1"            # log hiện tiến độ ngay (không gom từng đợt vài phút)
    timeout-minutes: 300
    steps:
      - name: Bỏ qua phần không chọn
        id: chon
        working-directory: .
        env:
          PHAN: ${{ inputs.phan || 'chuan' }}          # lịch hằng tháng (không có inputs) → chỉ phần chuan, rổ hose_hnx
          RO: ${{ github.event_name == 'workflow_dispatch' && inputs.ro || 'hose_hnx' }}
        run: |
          case ",$PHAN," in *",${{ matrix.phan }},"*|*",all,"*) ;; *) exit 0;; esac
          case ",$RO," in *",${{ matrix.ro }},"*) echo "chay=1" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/checkout@v5
        if: steps.chon.outputs.chay
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          ref: ${{ inputs.nhanh_danh_muc || '' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          path: danh-muc
      - uses: actions/checkout@v5                 # phần chuan: đối chiếu giả lập (repo kín – chỉ gửi Telegram)
        if: steps.chon.outputs.chay && matrix.phan == 'chuan' && matrix.ro == 'hose_hnx'
        continue-on-error: true
        with:
          repository: ${{ vars.GIA_LAP_REPO || 'mihhle2006-beep/gia_lap' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          path: gia_lap
      - uses: actions/setup-python@v6
        if: steps.chon.outputs.chay
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        if: steps.chon.outputs.chay
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.chon.outputs.chay && steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt
      - name: Lấy cache giá lần trước
        if: steps.chon.outputs.chay
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu
          # giá toàn sàn HOSE + HNX (+ BCTC mã mới ở cache_du_lieu/bctc_moi) dùng chung mọi phần
          key: gia-san-${{ matrix.phan }}-${{ matrix.ro }}-${{ github.run_id }}
          restore-keys: |
            gia-san-
            gia-von6-
            gia-ngay-
      - name: Backtest (${{ matrix.phan }})
        if: steps.chon.outputs.chay
        env:
          TU: ${{ inputs.tu || '2012-01-01' }}
          MA: ${{ inputs.ma || 'HOSE,HNX' }}
          RO_BT: ${{ matrix.ro }}
          CO_HUY: ${{ inputs.co_huy || 'true' }}
          DUNG_LAI: ${{ inputs.dung_lai_ngay || '7' }}
          PHAN: ${{ matrix.phan }}
          SO_NN: ${{ inputs.so_nn }}
        run: |
          case "$PHAN" in
            chuan) export CHI_CHUAN=1                          # mốc luật hiện tại + ★ ngẫu nhiên 50 lần
                   if [ -d ../gia_lap ]; then export GIA_LAP_DIR=../gia_lap; fi ;;   # + đối chiếu giả lập
            von3) export CHI_VON3=1 ;;                         # tăng CAGR bằng vốn: rủi ro, số mã, trần, nhồi
            von4) export CHI_VON4=1 ;;                         # độ chắc mã mới/tuần × rủi ro, ★ ngẫu nhiên 50 lần
            von5) export CHI_VON5=1 ;;                         # cải thiện danh mục: số mã, KL theo ★, đổi mã yếu, phí
            von6) export CHI_VON6=1 ;;                         # top GTGD, cắt lệnh chết (trong rổ RO_BT)
            von12) export CHI_VON12=1 ;;                       # tăng CAGR / không lỡ lệnh lớn (đổi mã chậm, nạp thêm…)
            von11) export CHI_VON11=1 ;;                       # cải thiện tỷ lệ thắng / lệnh lớn (xác nhận, khoá lãi, MA20w…)
            von10) export CHI_VON10=1 ;;                       # đối chứng suất dự phòng (B so với cờ ngẫu nhiên)
            von9) export CHI_VON9=1 ;;                         # không lỡ lệnh lớn trên nền mới (bỏ 30% biến động)
            von8) export CHI_VON8=1 ;;                         # kiểm định chắc ứng viên: phân bố 30 lần xếp ngẫu nhiên
            von7) export CHI_VON7=1 ;;                         # bỏ mã đầu cơ: trần/sàn, biến động, vốn hoá, thanh khoản bền
          esac
          # BCTC mã mới (chưa có trong kho repo) tải ở lần trước → nạp lại, khỏi tải lại (~40 phút với toàn sàn HNX);
          # cuối bước (kể cả khi lỗi) chép BCTC mới tải vào cache_du_lieu/bctc_moi (được lưu cùng cache giá)
          if [ -d cache_du_lieu/bctc_moi ]; then cp -n cache_du_lieu/bctc_moi/*.json du_lieu/bctc/ 2>/dev/null || true; fi
          trap 'mkdir -p cache_du_lieu/bctc_moi; git ls-files --others --exclude-standard du_lieu/bctc | xargs -r cp -t cache_du_lieu/bctc_moi/' EXIT
          python chay_backtest_quy_b.py --tu "$TU" ${MA:+--ma "$MA"} --ra "backtest_quy_b_${PHAN}_${RO_BT}.xlsx" --song \
            --dung_lai_ngay "${DUNG_LAI:-0}" \
            $([ "$CO_HUY" = "true" ] && echo --co_huy)
      - uses: actions/upload-artifact@v6
        if: always() && steps.chon.outputs.chay
        with:
          name: backtest-quy-b-${{ matrix.phan }}-${{ matrix.ro }}-${{ github.run_id }}
          path: danh-muc/backtest_quy_b_${{ matrix.phan }}_${{ matrix.ro }}.xlsx
          retention-days: 30
          if-no-files-found: ignore
