# TIN SỨC KHOẺ HỆ THỐNG – 19:55 giờ VN T2–T6 (chuyển từ gia_lap 10/2026): các workflow có chạy không, lần gần nhất
# OK / lỗi, NAV giả lập. Code ở repo gia_lap (checkout vào gia_lap/).
# CHẠY KÍN (repo công khai): đầu ra chương trình chỉ ghi file trong máy chạy / gửi Telegram, log chỉ in mã thoát.
name: Suc khoe he thong

on:
  schedule:
    - cron: "55 12 * * 1-5"         # 19:55 giờ VN (UTC+7)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gac:                             # lịch GitHub tới trễ mà đồng hồ / bấm tay đã chạy từ mốc này → bỏ lượt (gac.yml)
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gac.yml
    with:
      wf: suc_khoe.yml
    permissions:
      actions: read
      contents: read
  kiem:
    needs: gac
    if: ${{ !cancelled() && needs.gac.outputs.chay != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gia_lap
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GIA_LAP_REPO || 'mihhle2006-beep/gia_lap' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: gia_lap

      - uses: actions/checkout@v5                 # ptcp: bản đồ ngành + rổ top GTGD (mã chưa có ngành) + kiểm lịch quyền so
        with:                                      # giá tham chiếu sở (ptcp/kiem_quyen.py, 11/2026)
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
          sparse-checkout: |
            ptcp/
          sparse-checkout-cone-mode: false
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -q requests pandas numpy matplotlib openpyxl > /dev/null      # matplotlib / openpyxl: ptcp cần khi import

      - name: Gửi tin sức khoẻ (kín)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_GIA_LAP || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_GIA_LAP || secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DANH_MUC_TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}   # đọc lần chạy máy Mac (danh-muc) – không in
          DANH_MUC_DIR: ${{ github.workspace }}/danh-muc
        run: |
          ma=0; python suc_khoe.py > /tmp/suc_khoe.txt 2>&1 || ma=$?
          echo "Sức khoẻ: mã thoát $ma"; exit $ma
