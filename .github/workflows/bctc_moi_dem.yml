# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – log CÔNG KHAI); code & dữ liệu ở repo riêng tư danh-muc (checkout vào danh-muc/
# bằng secret DANH_MUC_TOKEN_GHI – kết quả commit về danh-muc). CONG_KHAI=1: không đọc / in danh mục thật.
# BCTC MỚI MỖI ĐÊM (22:13 giờ VN, cả cuối tuần – DN công bố cả thứ Bảy): tải kỳ BCTC quý / năm vừa công bố cho MỌI mã
# trong kho thiếu đúng kỳ mới nhất đã tới hạn (kho_bctc --moi_het – không giới hạn 80 mã như bước sáng của "Loc quy But
# Pha", mùa BCTC không phải chờ nhiều ngày) → tin Telegram "BCTC mới" (mã top 100 GTGD: kết quả quý, chấm điểm, dòng tiền
# & chất lượng lợi nhuận, bất thường số liệu – đã gộp, bỏ ý trùng) → commit kho → "Bat thuong BCTC" tự chạy tiếp (đọc
# báo cáo thường niên tìm giải thích). Bước sáng (--moi 80) vẫn chạy: lấy nốt mã công bố sau giờ chạy đêm.
name: BCTC moi hang dem

on:
  workflow_dispatch:
  schedule:
    - cron: "13 15 * * *"          # 22:13 giờ VN mỗi ngày (15:13 UTC)

permissions:
  contents: read

concurrency:
  group: dm-loc-quy-b              # chung nhóm với "Loc quy But Pha": không cùng lúc ghi kho BCTC
  cancel-in-progress: false

jobs:
  tai:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
      TZ: Asia/Ho_Chi_Minh             # kỳ đã tới hạn / ngày trong tin theo giờ VN
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Tải mọi BCTC quý / năm mới công bố + tin Telegram
        continue-on-error: true            # lỗi giữa chừng vẫn lưu phần đã tải
        timeout-minutes: 240
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
        run: python -m ptcp.kho_bctc --moi_het

      - name: Lưu kho BCTC
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          git add du_lieu/bctc
          git commit -q -m "BCTC mới (đêm) $(date +%F)" > /dev/null 2>&1 || { echo "Không có BCTC mới"; exit 0; }
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep $((i * 5)); done
          echo "Không đẩy được – kiểm tra Settings → Actions → Workflow permissions"; exit 1
