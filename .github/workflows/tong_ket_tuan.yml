# TỔNG KẾT TUẦN GIẢ LẬP – 20:17 tối thứ Sáu: tin + Excel gửi Telegram giả lập. Thật + PTĐTTC nằm trong file HTML
# của workflow Danh muc (thứ Sáu). Code ở repo gia_lap (checkout vào gia_lap/), repo này vào gia_lap/canh-bao-mua.
# CHẠY KÍN (repo công khai): đầu ra chương trình chỉ ghi file trong máy chạy / gửi Telegram, log chỉ in mã thoát.
name: Tong ket tuan (gia lap)

on:
  schedule:
    - cron: "17 13 * * 5"           # 20:17 tối thứ Sáu giờ VN (UTC+7) – sau Danh muc 15:45, Gia lap 18:53, Suc khoe 19:55
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tong_ket:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gia_lap
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.GIA_LAP_REPO || 'mihhle2006-beep/gia_lap' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: gia_lap

      - name: Lấy canh-bao-mua (Telegram, nhật ký tín hiệu, danh sách mua)
        uses: actions/checkout@v5
        with:
          path: gia_lap/canh-bao-mua

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gia_lap/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -q -r requirements.txt -r canh-bao-mua/requirements.txt > /dev/null

      - name: Lấy ptcp (repo danh-muc)
        working-directory: gia_lap/canh-bao-mua
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}
        run: python lay_ptcp.py

      - name: Gửi tin tổng kết tuần (kín)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_GIA_LAP || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_GIA_LAP || secrets.TELEGRAM_CHAT_ID }}
          DANH_MUC_TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          DANH_MUC_REPO: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
        run: |
          ma=0; python tong_ket_tuan.py > /tmp/tong_ket.txt 2>&1 || ma=$?
          echo "Tổng kết tuần: mã thoát $ma"; exit $ma
