# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – log CÔNG KHAI); code ở repo riêng tư danh-muc (checkout vào danh-muc/).
# BẤT THƯỜNG BCTC (chạy tay): bước 1 dò bất thường số liệu (ptcp/bat_thuong_bctc.py – phải thu, dự phòng, tồn kho, dòng
# tiền, biên gộp… + riêng theo ngành) → bước 2–3 đọc báo cáo thường niên + BCTC kiểm toán năm đó tìm lời giải thích, đối
# chiếu kế hoạch đầu tư với chi đầu tư / tài sản dở dang (ptcp/giai_thich_bat_thuong.py) → Excel gửi Telegram.
# 6 nhóm song song (≤ 320 phút / nhóm). CONG_KHAI=1: log chỉ in số mã. Kết quả chỉ gửi Telegram (artifact giữ 1 ngày).
# ĐỆM CHỮ TÀI LIỆU (cache_du_lieu/tai_lieu – chữ từng trang đã OCR, theo URL): mỗi nhóm khôi phục bản đệm chung (actions/cache),
# đọc thêm tài liệu mới, gửi phần đệm lên artifact; job gop gộp lại lưu bản đệm mới → lần sau không tải / OCR lại.
# KẾT QUẢ theo mã commit vào danh-muc du_lieu/bat_thuong_giai_thich/ → lần sau bỏ qua mã đã đọc tới năm mới nhất của kho
# (Excel vẫn gồm đủ mã từ kết quả lưu).
name: Bat thuong BCTC

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã, phân cách dấu phẩy – bỏ trống = các mã có RỦI RO / CẦN KIỂM TRA hoặc trọng yếu ≥ 5%"
        default: ""
      lam_moi:
        description: "Đọc lại cả mã đã có kết quả lưu (chấm lại sau khi đổi cách đọc; chữ tài liệu lấy từ đệm)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CONG_KHAI: "1"

jobs:
  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        nhom: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json trang_thai_ptdttc.json lich_su_danh_muc.csv lich_su_ptdttc.csv nhap*.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cài thư viện + OCR tiếng Việt
        run: |
          pip install -q -r requirements.txt > /dev/null
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-vie poppler-utils > /dev/null
      - name: Khôi phục đệm chữ tài liệu (lần chạy trước)
        uses: actions/cache/restore@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
          restore-keys: tai-lieu-bt-
      - name: Đọc tài liệu tìm giải thích (nhóm ${{ matrix.nhom }}/6)
        env:
          MA: ${{ inputs.ma }}
        run: python -m ptcp.giai_thich_bat_thuong ${MA:+--ma "$MA"} ${{ inputs.lam_moi && '--lam_moi' || '' }} --chia ${{ matrix.nhom }}/6 --han_phut 320 --ra ../ra/nhom_${{ matrix.nhom }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bt-${{ matrix.nhom }}
          path: ra/*.json
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tl-${{ matrix.nhom }}
          path: danh-muc/cache_du_lieu/tai_lieu
          retention-days: 1
          if-no-files-found: ignore

  gop:
    needs: doc
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: bt-*
          merge-multiple: true
          path: ra
      - name: Khôi phục đệm chữ cũ
        uses: actions/cache/restore@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
          restore-keys: tai-lieu-bt-
      - uses: actions/download-artifact@v7
        with:
          pattern: tl-*
          merge-multiple: true
          path: danh-muc/cache_du_lieu/tai_lieu
      - name: Lưu đệm chữ tài liệu (cũ + mới) cho lần sau
        uses: actions/cache/save@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
      - name: Lưu kết quả theo mã vào danh-muc (lần sau bỏ qua mã đã đọc)
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          pip install -q -r requirements.txt > /dev/null
          ls ../ra/*.json > /dev/null 2>&1 || { echo "Không có kết quả nhóm"; exit 0; }
          python -m ptcp.giai_thich_bat_thuong --luu ../ra/*.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          git add du_lieu/bat_thuong_giai_thich
          git commit -q -m "Bất thường BCTC – kết quả đọc giải thích $(date +%F)" > /dev/null 2>&1 || { echo "Không có thay đổi"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Gộp Excel & gửi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m ptcp.giai_thich_bat_thuong --gop ../ra/*.json --ra Bat_thuong_BCTC_giai_thich.xlsx --gui
