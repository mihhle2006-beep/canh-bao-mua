# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – log CÔNG KHAI); code ở repo riêng tư danh-muc (checkout vào danh-muc/).
# BẤT THƯỜNG BCTC: bước 1 dò bất thường số liệu (ptcp/bat_thuong_bctc.py – phải thu, dự phòng, tồn kho, dòng tiền, biên
# gộp… + riêng theo ngành; năm tài chính + 4 QUÝ GẦN NHẤT khi BCTC quý mới hơn năm) → bước 2–3 đọc báo cáo thường niên +
# BCTC kiểm toán năm đó tìm lời giải thích, đối chiếu kế hoạch đầu tư với chi đầu tư / tài sản dở dang
# (ptcp/giai_thich_bat_thuong.py) → Excel gửi Telegram.
# TỰ CHẠY sau "Loc quy But Pha" (sáng, kho_bctc --moi 80) và "BCTC moi hang dem" (đêm, mọi mã – kho_bctc --moi_het)
# – 2 bước đó tải BCTC quý / năm vừa công bố: job chon chỉ lấy mã
# có BCTC MỚI (kỳ mới nhất của kho khác lần đọc trước) hoặc có năm đang "chờ báo cáo thường niên" mà BCTN vừa ra
# (BCTN giải thích → ĐÃ GIẢI THÍCH). Không có mã nào → dừng, không chạy nhóm đọc. Tin Telegram: thay đổi (🆕 bất thường
# mới · ✅ đã giải thích · 🔁 đổi mức) + Excel các mã lần này; 🆕 của mã top 100 GTGD
# bỏ khỏi tin (đã gộp trong tin "BCTC mới"). Chạy tay: Excel đủ mã như cũ.
# Nhóm song song: ≤ 12 mã → 1 nhóm, nhiều hơn → 6 nhóm (≤ 320 phút / nhóm). CONG_KHAI=1: log chỉ in số mã.
# ĐỆM CHỮ TÀI LIỆU (cache_du_lieu/tai_lieu – chữ từng trang đã OCR, theo URL): mỗi nhóm khôi phục bản đệm chung (actions/cache),
# đọc thêm tài liệu mới, gửi phần đệm lên artifact; job gop gộp lại lưu bản đệm mới → lần sau không tải / OCR lại.
# KẾT QUẢ theo mã commit vào danh-muc du_lieu/bat_thuong_giai_thich/ (kèm kỳ BCTC đã đọc & năm chờ BCTN).
name: Bat thuong BCTC

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã, phân cách dấu phẩy – bỏ trống = các mã có RỦI RO / CẦN KIỂM TRA hoặc trọng yếu ≥ 5%"
        default: ""
      lam_moi:
        description: "Đọc lại cả mã đã có kết quả lưu (chấm lại sau khi đổi cách đọc; chữ tài liệu lấy từ đệm)"
        type: boolean
        default: false
  workflow_run:                    # sau khi "Loc quy But Pha" (sáng) / "BCTC moi hang dem" (đêm) tải BCTC mới công bố
    workflows: ["Loc quy But Pha", "BCTC moi hang dem"]
    types: [completed]

permissions:
  contents: read
  actions: read                    # tải artifact danh sách mã giữa các job

concurrency:
  group: bat-thuong-bctc
  cancel-in-progress: false

env:
  CONG_KHAI: "1"

jobs:
  chon:                            # mã cần đọc: có BCTC / BCTN mới (chạy tay: theo ô mã, hoặc tất cả khi lam_moi)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      n: ${{ steps.chon.outputs.n }}
      nhom: ${{ steps.chon.outputs.nhom }}
      so_nhom: ${{ steps.chon.outputs.so_nhom }}
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json trang_thai_ptdttc.json lich_su_danh_muc.csv lich_su_ptdttc.csv nhap*.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Chọn mã có báo cáo mới
        id: chon
        env:
          MA: ${{ inputs.ma }}
          LAM_MOI: ${{ inputs.lam_moi && '--lam_moi' || '' }}
        run: |
          pip install -q -r requirements.txt > /dev/null
          python -m ptcp.giai_thich_bat_thuong ${MA:+--ma "$MA"} $LAM_MOI --ds_ra ../ds_ma.txt
          n=$(tr ',' '\n' < ../ds_ma.txt | grep -c . || true)
          if [ "$n" -eq 0 ]; then nhom='[]'; so=0; elif [ "$n" -le 12 ]; then nhom='[1]'; so=1; else nhom='[1,2,3,4,5,6]'; so=6; fi
          echo "n=$n" >> "$GITHUB_OUTPUT"; echo "nhom=$nhom" >> "$GITHUB_OUTPUT"; echo "so_nhom=$so" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] || echo "Không có BCTC / BCTN mới → không đọc"
      - uses: actions/upload-artifact@v6
        if: steps.chon.outputs.n != '0'
        with:
          name: ds-ma
          path: ds_ma.txt
          retention-days: 1

  doc:
    needs: chon
    if: needs.chon.outputs.n != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        nhom: ${{ fromJSON(needs.chon.outputs.nhom) }}
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json trang_thai_ptdttc.json lich_su_danh_muc.csv lich_su_ptdttc.csv nhap*.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cài thư viện + OCR tiếng Việt
        run: |
          pip install -q -r requirements.txt > /dev/null
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-vie poppler-utils > /dev/null
      - name: Khôi phục đệm chữ tài liệu (lần chạy trước)
        uses: actions/cache/restore@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
          restore-keys: tai-lieu-bt-
      - uses: actions/download-artifact@v7
        with:
          name: ds-ma
          path: .
      - name: Đọc tài liệu tìm giải thích (nhóm ${{ matrix.nhom }}/${{ needs.chon.outputs.so_nhom }})
        # danh sách đã chọn ở job chon → --lam_moi để không lọc lại
        run: python -m ptcp.giai_thich_bat_thuong --ma "$(cat ../ds_ma.txt)" --lam_moi --chia ${{ matrix.nhom }}/${{ needs.chon.outputs.so_nhom }} --han_phut 320 --ra ../ra/nhom_${{ matrix.nhom }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bt-${{ matrix.nhom }}
          path: ra/*.json
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tl-${{ matrix.nhom }}
          path: danh-muc/cache_du_lieu/tai_lieu
          retention-days: 1
          if-no-files-found: ignore

  gop:
    needs: [chon, doc]
    if: always() && needs.chon.result == 'success' && needs.chon.outputs.n != '0'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - uses: actions/download-artifact@v7
        with:
          pattern: bt-*
          merge-multiple: true
          path: ra
      - name: Khôi phục đệm chữ cũ
        uses: actions/cache/restore@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
          restore-keys: tai-lieu-bt-
      - uses: actions/download-artifact@v7
        with:
          pattern: tl-*
          merge-multiple: true
          path: danh-muc/cache_du_lieu/tai_lieu
      - name: Lưu đệm chữ tài liệu (cũ + mới) cho lần sau
        uses: actions/cache/save@v4
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-bt-${{ github.run_id }}
      - name: Lưu kết quả theo mã vào danh-muc (lần sau bỏ qua mã đã đọc)
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          pip install -q -r requirements.txt > /dev/null
          ls ../ra/*.json > /dev/null 2>&1 || { echo "Không có kết quả nhóm"; exit 0; }
          python -m ptcp.giai_thich_bat_thuong --luu ../ra/*.json --thay_doi ../thay_doi.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          git add du_lieu/bat_thuong_giai_thich
          git commit -q -m "Bất thường BCTC – kết quả đọc giải thích $(date +%F)" > /dev/null 2>&1 || { echo "Không có thay đổi"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Gộp Excel & gửi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          HANG_NGAY: ${{ github.event_name == 'workflow_run' && '--chi_lan_nay' || '' }}
        run: |
          ls ../ra/*.json > /dev/null 2>&1 || { echo "Không có kết quả nhóm"; exit 0; }
          python -m ptcp.giai_thich_bat_thuong --gop ../ra/*.json --ra Bat_thuong_BCTC_giai_thich.xlsx --gui $HANG_NGAY --thay_doi ../thay_doi.txt
