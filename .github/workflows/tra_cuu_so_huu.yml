# TRA CỨU CƠ CẤU SỞ HỮU (chạy tay) – công cụ riêng cong_cu/so_huu/so_huu.py, KHÔNG thuộc bot: Vietcap IQ → cơ cấu cổ
# đông hiện tại (Nhà nước · nước ngoài · HĐQT · tổ chức) + sở hữu nước ngoài cuối mỗi năm → Excel gửi Telegram.
# 28/10/2026: bỏ phần dò tỷ lệ từ báo cáo thường niên (OCR) – không kiểm chứng được.
name: Tra cứu sở hữu

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã, phân cách dấu phẩy"
        default: "GMD,VSC,PHP,CDN,MVN,DXP,PDN,SGP,ILB,TCL,DVP,HAH,VOS,VTO,PVT,GSP,VIP,VNA,TMS,STG,VNL,SFI,PJT,HTV,SCS,NCT,SAS,VTP"
      tu:
        description: "Nước ngoài cuối năm – từ năm"
        default: "2018"
      den:
        description: "Đến năm"
        default: "2025"

permissions:
  contents: read

jobs:
  so_huu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: cong_cu/so_huu
      - name: Lấy cơ cấu sở hữu & gửi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          MA: ${{ inputs.ma }}
        run: |
          pip install -q pandas openpyxl requests
          f=So_huu_$(date +%Y%m%d).xlsx
          python cong_cu/so_huu/so_huu.py --ma "$MA" --tu ${{ inputs.tu }} --den ${{ inputs.den }} --ra "$f"
          if [ -n "$TELEGRAM_TOKEN" ]; then
            curl -sS -o /dev/null -w "Telegram %{http_code}\n" -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"$f" \
              -F caption="Cơ cấu sở hữu hiện tại + nước ngoài cuối năm (Vietcap)" \
              "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
          fi
