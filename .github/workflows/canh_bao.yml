# Cảnh báo MUA đa khung – chạy mỗi 15 phút trong phiên, tổng kết lúc 15:20 (giờ Việt Nam).
# ptcp KHÔNG nằm trong repo này: bước "Lấy ptcp" chép từ repo danh-muc (một nguồn duy nhất).
name: Canh bao mua

on:
  schedule:
    # Lịch 15' của GitHub trễ / bỏ lượt (thực tế 35–60 phút một lần, mất cả khung ATC) → mỗi buổi MỘT job hẹn sớm,
    # tự lặp đúng mỗi 15 phút trong phiên (bước "Quét & gửi cảnh báo", VONG_LAP)
    - cron: "15 1 * * 1-5"         # 08:15 giờ VN – vòng lặp buổi sáng 09:00–11:30
    - cron: "15 5 * * 1-5"         # 12:15 giờ VN – vòng lặp buổi chiều 13:00–14:45 (gồm lượt 14:30 báo MUA ATC)
    - cron: "20 8 * * 1-5"         # 15:20 giờ VN – tổng kết cuối ngày (kèm chấm đúng/sai tín hiệu)
    - cron: "7 2 * * 6"            # 09:07 thứ Bảy giờ VN – chạy LỊCH SỬ hằng tuần (chấm lại mọi tín hiệu, xuất Excel)
  workflow_dispatch:
    inputs:
      che_do:
        description: "tu_dong | trong_phien | tong_ket | lich_su"
        default: "tong_ket"
        type: choice
        options: [tu_dong, trong_phien, tong_ket, lich_su]
      ma:
        description: "Chỉ xem mã này (VD FPT hoặc FPT,HPG) – bỏ trống = chạy bình thường; xem mã không ghi trạng thái"
        default: ""
        type: string
      chi_thu:
        description: "Chỉ thử – KHÔNG gửi Telegram, KHÔNG lưu trạng thái (kết quả xem trong log)"
        default: false
        type: boolean
      gio:
        description: "Chạy lại thời điểm cũ, giờ VN (VD 2026-10-22 14:30) – chỉ in log, KHÔNG gửi Telegram / lưu trạng thái"
        default: ""
        type: string
      nhanh_ptcp:
        description: "Nhánh danh-muc lấy ptcp (chạy thử code chưa gộp) – bỏ trống = main"
        default: ""
        type: string

permissions:
  contents: write
  actions: write                   # gọi danh_muc.yml khi nhap*.txt có lệnh mới (GITHUB_TOKEN – cùng repo)

concurrency:
  group: canh-bao${{ (inputs.gio != '' || inputs.chi_thu) && '-thu' || '' }}   # chạy thử không huỷ vòng lặp đang chạy
  cancel-in-progress: true

jobs:
  chay:
    runs-on: ubuntu-24.04
    timeout-minutes: 240                # vòng lặp buổi sáng ~3h20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Lấy ptcp – MỘT nguồn duy nhất (repo danh-muc)
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}   # token repo danh-muc (lấy ptcp, đọc danh mục)
          REPO: ${{ vars.PTCP_REPO || vars.DANH_MUC_REPO }}          # mặc định: chính repo danh-muc
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}  # thư mục ptcp trong repo đó
          NHANH: ${{ inputs.nhanh_ptcp }}
        run: python lay_ptcp.py

      - name: Khôi phục cache giá, phân tích ngày & nhật ký riêng
        uses: actions/cache@v5
        with:
          path: |
            cache_gia
            cache_ptcp
          key: gia-${{ github.run_id }}
          restore-keys: gia-

      - name: Giải mã trạng thái riêng (cache công khai chỉ giữ bản mã hoá)
        env:
          KHOA: ${{ secrets.CACHE_KEY || secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          [ -f cache_ptcp/rieng.enc ] || exit 0
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KHOA -in cache_ptcp/rieng.enc 2>/dev/null | tar -xz 2>/dev/null \
            || echo "Không giải mã được trạng thái riêng → bắt đầu lại"
          rm -f cache_ptcp/rieng.enc

      - name: Quét & gửi cảnh báo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DANH_MUC_TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}   # token repo danh-muc (cảnh báo BÁN)
          DANH_MUC_REPO: ${{ vars.DANH_MUC_REPO }}           # VD: ten-ban/danh-muc
          DANH_MUC_PATH: ${{ vars.DANH_MUC_PATH }}           # để trống = danh_muc.csv
          GH_TOKEN: ${{ github.token }}
          MA: ${{ inputs.ma }}
          CHI_THU: ${{ inputs.chi_thu || inputs.gio != '' }}
          GIO: ${{ inputs.gio }}
        # lịch thứ Bảy → lich_su; chạy tay → chế độ đã chọn; còn lại → tu_dong
        # có nhập mã → chỉ xem mã đó · chỉ thử → không gửi Telegram, khôi phục trạng thái riêng (cache_ptcp) sau khi chạy
        run: |
          THEM=""
          if [ "$CHI_THU" = "true" ]; then THEM="--khong_gui"; rm -rf /tmp/ptcp_goc; cp -a cache_ptcp /tmp/ptcp_goc 2>/dev/null || true; fi
          ma_thoat=0
          case "${{ github.event.schedule }}" in
            "15 1 * * 1-5") HET=1135 ;;
            "15 5 * * 1-5") HET=1447 ;;
            *) HET="" ;;
          esac
          # nhap*.txt ở danh-muc còn lệnh chưa áp → chạy danh mục ngay (không đợi cuối phiên). Không gọi khi danh mục đang
          # chạy hoặc đã chạy trong 45' (lệnh nhập sai không áp được → không gọi lặp mỗi 15'); log không in nội dung lệnh
          kiem_nhap() {
            gan=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/danh_muc.yml/runs?per_page=5" --jq \
                  '[.workflow_runs[] | select(.status != "completed" or (now - (.created_at | fromdate)) < 2700)] | length' \
                  2>/dev/null || echo 1)
            [ "$gan" = 0 ] || return 0
            for f in nhap.txt nhap_ptdttc.txt; do
              if curl -sf -H "Authorization: Bearer $DANH_MUC_TOKEN" -H "Accept: application/vnd.github.raw" \
                   "https://api.github.com/repos/${DANH_MUC_REPO:-mihhle2006-beep/danh-muc}/contents/$f" \
                   | sed 's/#.*//' | grep -q '[A-Za-z0-9]'; then
                gh workflow run danh_muc.yml --ref main -R "$GITHUB_REPOSITORY" && echo "có lệnh nhập mới → đã gọi danh mục"
                return 0
              fi
            done
          }
          if [ -n "$HET" ]; then                       # vòng lặp: chạy mỗi mốc 15 phút (giờ VN) tới HET
            while [ "$(TZ=Asia/Ho_Chi_Minh date +%H%M)" -lt "$HET" ]; do
              python chay.py --che_do tu_dong || echo "⚠ lượt $(TZ=Asia/Ho_Chi_Minh date +%H:%M) lỗi – lượt sau chạy tiếp"
              kiem_nhap || true
              bay_gio=$(date +%s); sleep $(( (bay_gio / 900 + 1) * 900 - bay_gio + 5 ))
            done
            exit 0
          fi
          if [ -n "$MA" ]; then
            python chay.py --chi_ma "$MA" $THEM || ma_thoat=$?
          else
            python chay.py ${GIO:+--gio "$GIO"} --che_do ${{ github.event.schedule == '7 2 * * 6' && 'lich_su' || github.event.schedule == '20 8 * * 1-5' && 'tong_ket' || inputs.gio != '' && 'tu_dong' || inputs.che_do || 'tu_dong' }} $THEM || ma_thoat=$?
          fi
          if [ "$CHI_THU" = "true" ] && [ -d /tmp/ptcp_goc ]; then rm -rf cache_ptcp; cp -a /tmp/ptcp_goc cache_ptcp; fi
          exit $ma_thoat

      - name: Mã hoá trạng thái riêng trước khi lưu cache
        if: always()
        env:
          KHOA: ${{ secrets.CACHE_KEY || secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          ds=$(ls cache_ptcp/trang_thai_ban.json cache_ptcp/lich_su_danh_gia_rieng.csv 2>/dev/null || true)
          [ -n "$ds" ] || exit 0
          tar -cz $ds | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KHOA -out cache_ptcp/rieng.enc && rm -f $ds

      - name: Tải file Excel độ chính xác (chế độ lịch sử)
        if: always() && hashFiles('danh_gia_tin_hieu.xlsx') != ''
        uses: actions/upload-artifact@v6
        with:
          name: danh-gia-tin-hieu-${{ github.run_id }}
          path: danh_gia_tin_hieu.xlsx
          retention-days: 30

      - name: Lưu trạng thái, nhật ký tín hiệu & trang tổng hợp (công khai)
        if: always() && inputs.chi_thu != true && inputs.gio == ''   # chỉ thử / chạy lại → không commit gì
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # chỉ thêm file đang có – thiếu 1 file không được làm hỏng cả lần commit
          for f in trang_thai_canh_bao.json lich_su_tin_hieu.csv lich_su_danh_gia.csv trang_thai_chien_luoc.json tong_ket_da_gui.json \
                   docs/index.html ma_bo_loc.json theo_doi_kn.json lich_su_sao.csv lich_su_nen; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && echo "Không có thay đổi" && exit 0
          git commit -m "Trạng thái cảnh báo $(date -u +%F' '%H:%M) UTC"
          git pull --rebase || true
          git push || echo "Không đẩy được – Settings → Actions → General → Workflow permissions: Read and write"
