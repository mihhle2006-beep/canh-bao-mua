# Cảnh báo MUA đa khung – chạy mỗi 15 phút trong phiên, tổng kết lúc 15:20 (giờ Việt Nam).
# ptcp KHÔNG nằm trong repo này: bước "Lấy ptcp" chép từ repo danh-muc (một nguồn duy nhất).
name: Canh bao mua

on:
  schedule:
    - cron: "*/15 2-4 * * 1-5"     # 09:00–11:45 giờ VN (UTC+7) – code tự bỏ qua ngoài phiên
    - cron: "*/15 6-7 * * 1-5"     # 13:00–14:45 giờ VN
    - cron: "20 8 * * 1-5"         # 15:20 giờ VN – tổng kết cuối ngày (kèm chấm đúng/sai tín hiệu)
    - cron: "7 2 * * 6"            # 09:07 thứ Bảy giờ VN – chạy LỊCH SỬ hằng tuần (chấm lại mọi tín hiệu, xuất Excel)
  workflow_dispatch:
    inputs:
      che_do:
        description: "tu_dong | trong_phien | tong_ket | lich_su"
        default: "tong_ket"
        type: choice
        options: [tu_dong, trong_phien, tong_ket, lich_su]
      ma:
        description: "Chỉ xem mã này (VD FPT hoặc FPT,HPG) – bỏ trống = chạy bình thường; xem mã không ghi trạng thái"
        default: ""
        type: string
      chi_thu:
        description: "Chỉ thử – KHÔNG gửi Telegram, KHÔNG lưu trạng thái (kết quả xem trong log)"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: canh-bao
  cancel-in-progress: true

jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Lấy ptcp – MỘT nguồn duy nhất (repo danh-muc)
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN }}                       # token CHỈ ĐỌC – dùng chung với cảnh báo BÁN
          REPO: ${{ vars.PTCP_REPO || vars.DANH_MUC_REPO }}          # mặc định: chính repo danh-muc
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp_phan_tich/ptcp' }}  # thư mục ptcp trong repo đó
        run: python lay_ptcp.py

      - name: Khôi phục cache giá, phân tích ngày & nhật ký riêng
        uses: actions/cache@v5
        with:
          path: |
            cache_gia
            cache_ptcp
          key: gia-${{ github.run_id }}
          restore-keys: gia-

      # lần chạy 15' trong phiên bỏ kiểm thử (~30 giây) để tin MUA NGAY đến sớm hơn – tổng kết / chạy tay vẫn kiểm thử
      - name: Kiểm thử
        if: github.event.schedule != '*/15 2-4 * * 1-5' && github.event.schedule != '*/15 6-7 * * 1-5'
        run: python -m pytest -q

      - name: Quét & gửi cảnh báo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DANH_MUC_TOKEN: ${{ secrets.DANH_MUC_TOKEN }}      # token CHỈ ĐỌC repo danh-muc (cảnh báo BÁN)
          DANH_MUC_REPO: ${{ vars.DANH_MUC_REPO }}           # VD: ten-ban/danh-muc
          DANH_MUC_PATH: ${{ vars.DANH_MUC_PATH }}           # để trống = danh_muc.csv
          BO_LOC_TOKEN: ${{ secrets.BO_LOC_TOKEN }}          # token CHỈ ĐỌC repo Bo_Loc (bỏ trống nếu Bo_Loc công khai)
          BO_LOC_REPO: ${{ vars.BO_LOC_REPO }}               # để trống = cau_hinh.BO_LOC_REPO
          MA: ${{ inputs.ma }}
          CHI_THU: ${{ inputs.chi_thu }}
        # lịch thứ Bảy → lich_su; chạy tay → chế độ đã chọn; còn lại → tu_dong
        # có nhập mã → chỉ xem mã đó · chỉ thử → không gửi Telegram, khôi phục trạng thái riêng (cache_ptcp) sau khi chạy
        run: |
          THEM=""
          if [ "$CHI_THU" = "true" ]; then THEM="--khong_gui"; rm -rf /tmp/ptcp_goc; cp -a cache_ptcp /tmp/ptcp_goc 2>/dev/null || true; fi
          ma_thoat=0
          if [ -n "$MA" ]; then
            python chay.py --chi_ma "$MA" $THEM || ma_thoat=$?
          else
            python chay.py --che_do ${{ github.event.schedule == '7 2 * * 6' && 'lich_su' || inputs.che_do || 'tu_dong' }} $THEM || ma_thoat=$?
          fi
          if [ "$CHI_THU" = "true" ] && [ -d /tmp/ptcp_goc ]; then rm -rf cache_ptcp; cp -a /tmp/ptcp_goc cache_ptcp; fi
          exit $ma_thoat

      - name: Tải file Excel độ chính xác (chế độ lịch sử)
        if: always() && hashFiles('danh_gia_tin_hieu.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: danh-gia-tin-hieu-${{ github.run_id }}
          path: danh_gia_tin_hieu.xlsx
          retention-days: 30

      - name: Lưu trạng thái, nhật ký tín hiệu & trang tổng hợp (công khai)
        if: always() && inputs.chi_thu != true        # chỉ thử → không commit gì
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # chỉ thêm file đang có – thiếu 1 file không được làm hỏng cả lần commit
          for f in trang_thai_canh_bao.json lich_su_tin_hieu.csv lich_su_danh_gia.csv trang_thai_chien_luoc.json \
                   docs/index.html ma_bo_loc.json theo_doi_kn.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet && echo "Không có thay đổi" && exit 0
          git commit -m "Trạng thái cảnh báo $(date -u +%F' '%H:%M) UTC"
          git pull --rebase || true
          git push || echo "Không đẩy được – Settings → Actions → General → Workflow permissions: Read and write"
