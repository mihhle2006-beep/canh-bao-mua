# KẾ HOẠCH ĐHCĐ (chạy tay + MỖI ĐÊM từ 09/11/2026: --con_lai – mã CHƯA có file, HOSE + HNX theo GTGD rồi UPCoM, 4 nhóm × 150'): kế hoạch doanh thu / LNTT / LNST năm Y từ Nghị quyết – Biên bản ĐHCĐ thường niên (tin công bố
# Vietcap) + tỷ lệ hoàn thành (thực tế kho BCTC ÷ kế hoạch; câu "đạt X % kế hoạch" của BCTN) – danh-muc
# ptcp/ke_hoach_dhcd.py, nền cho dự phóng tự làm. Tài liệu công bố công khai → in log được; KHÔNG đọc danh mục thật.
# Kết quả commit vào danh-muc du_lieu/ke_hoach/<MÃ>.json. Đệm chữ tài liệu (OCR) dùng chung với "Tra tai lieu".
name: Ke hoach DHCD

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã (phân cách dấu phẩy) – trống = top GTGD"
        default: ""
      top:
        description: "Top N GTGD (lọc Quỹ Bứt Phá) khi không nhập mã"
        default: "100"
      tu:
        description: "Từ năm kế hoạch"
        default: "2021"
      den:
        description: "Đến năm kế hoạch"
        default: "2026"
      lam_moi:
        description: "Đọc lại cả năm đã có kế hoạch (sau khi sửa cách trích)"
        type: boolean
        default: false
      luu_hong:
        description: "Lưu chữ trang 'kế hoạch' của văn bản không trích được số (du_lieu/van_ban – soát tay)"
        type: boolean
        default: false
      con_lai:
        description: "Sàn: đọc mọi mã CHƯA có file kế hoạch (VD HOSE,HNX,UPCOM) – lịch đêm / đồng hồ dùng"
        default: ""
  schedule:
    - cron: "23 17 * * *"          # 00:23 giờ VN mỗi đêm: mã còn lại (đồng hồ truyền con_lai)

permissions:
  contents: read                   # repo này; ghi danh-muc bằng DANH_MUC_TOKEN_GHI

concurrency:
  group: ke-hoach-dhcd
  cancel-in-progress: false

jobs:
  gac:                             # lịch GitHub tới trễ mà đồng hồ / bấm tay đã chạy từ mốc này → bỏ lượt (gac.yml)
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gac.yml
    with:
      wf: ke_hoach_dhcd.yml
    permissions:
      actions: read
      contents: read
  doc:
    needs: gac
    if: ${{ !cancelled() && needs.gac.outputs.chay != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        nhom: [1, 2, 3, 4, 5, 6, 7, 8]          # 09/11/2026: 4 → 8 nhóm (mỗi nhóm ~22 mã / 150 phút)
    defaults:
      run:
        working-directory: danh-muc
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv nhap*.txt trung_vang*.json; [ "$(git config --get core.sparseCheckout)" = true ] || git sparse-checkout set --no-cone '/*' '!/danh_muc*.csv' '!/da_ban*.csv' '!/lenh_that*.csv' '!/tien_mat_*.json' '!/trang_thai_vi_the.json' '!/lich_su_danh_muc.csv' '!/nhap*.txt' '!/trung_vang*.json' 2>/dev/null || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cài thư viện + OCR tiếng Việt
        run: |
          pip install -q -r requirements.txt > /dev/null
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-vie poppler-utils > /dev/null
      - name: Khôi phục đệm chữ tài liệu
        uses: actions/cache@v5
        with:
          path: danh-muc/cache_du_lieu/tai_lieu
          key: tai-lieu-kh-${{ matrix.nhom }}-${{ github.run_id }}
          restore-keys: |
            tai-lieu-kh-${{ matrix.nhom }}-
            tai-lieu-kh-
            tai-lieu-bt-
      - name: Đọc kế hoạch ĐHCĐ (nhóm ${{ matrix.nhom }}/8)
        env:
          MA: ${{ inputs.ma }}
          CON_LAI: ${{ inputs.con_lai || (github.event_name == 'schedule' && 'HOSE,HNX,UPCOM' || '') }}
          CONG_KHAI: "1"
        run: |
          if [ -n "$CON_LAI" ]; then                  # đêm: mã còn lại, 150 phút / nhóm
            python -m ptcp.ke_hoach_dhcd --con_lai "$CON_LAI" --tu ${{ inputs.tu || '2021' }} --den ${{ inputs.den || '2026' }} --chia ${{ matrix.nhom }}/8 --han_phut 150
          else
            python -m ptcp.ke_hoach_dhcd ${MA:+--ma "$MA"} --top ${{ inputs.ma == '' && inputs.top || 0 }} --tu ${{ inputs.tu || '2021' }} --den ${{ inputs.den || '2026' }} --chia ${{ matrix.nhom }}/8 --han_phut 300 ${{ inputs.lam_moi && '--lam_moi' || '' }} ${{ inputs.luu_hong && '--luu_hong' || '' }}
          fi
      - name: Lưu kết quả vào danh-muc (du_lieu/ke_hoach)
        if: always()
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          [ -d du_lieu/ke_hoach ] || { echo "Chưa có kết quả"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          git add du_lieu/ke_hoach
          [ -d du_lieu/van_ban ] && git add du_lieu/van_ban
          git commit -q -m "Kế hoạch ĐHCĐ nhóm ${{ matrix.nhom }}/8" > /dev/null 2>&1 || { echo "Không có thay đổi"; exit 0; }
          # 12–14/11/2026: --autostash cất cả tệp danh mục thật đã xoá (+ tệp phụ job làm đổi: đệm giá, kho) → áp lại xung đột
          # (xoá ↔ sửa) với commit đồng bộ danh mục / nhóm khác → mọi lần thử sau hỏng ("unmerged files"), mất kết quả 2,5 giờ
          # đọc. Tệp danh mục thật đã ra ngoài vùng làm việc từ bước xoá (sparse); kết quả đã commit → bỏ thay đổi phụ còn lại
          # (tệp chưa theo dõi – đệm chữ tài liệu – giữ nguyên) rồi pull --rebase sạch.
          git checkout -q -- .
          for i in 1 2 3 4 5 6 7 8; do
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5 + ${{ matrix.nhom }} * 3))
          done
          exit 1
