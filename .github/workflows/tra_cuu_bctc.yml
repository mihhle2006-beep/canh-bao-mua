# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – log CÔNG KHAI); code ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/
# bằng secret DANH_MUC_TOKEN_GHI. CONG_KHAI=1: log chỉ in số mã, không in mã / tên file.
# TRA CỨU BCTC – bấm "Run workflow", nhập MÃ (VD GMD hoặc GMD,VSC,HAH) hoặc NGÀNH (tên trong ptcp/nganh.py, gõ 1 phần
# cũng được – VD logistics, thép, ngân hàng) → file Excel BCTC năm & quý (Cân đối kế toán · KQKD · LCTT · Thuyết minh,
# giao diện trắng – xanh lá) gửi qua Telegram. 1 mã → 4 sheet; ngành / nhiều mã → sheet Tổng hợp + 1 sheet / mã.
# File chỉ gửi Telegram, không lưu artifact (repo công khai).
name: Tra cứu BCTC

on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã cổ phiếu, phân cách dấu phẩy (VD GMD hoặc GMD,VSC,HAH) – bỏ trống nếu xuất theo ngành"
        default: ""
      nganh:
        description: "Hoặc tên ngành (VD logistics, thép, ngân hàng) – có ngành thì bỏ qua ô mã"
        default: ""

permissions:
  contents: read

jobs:
  tra_cuu_bctc:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json trang_thai_ptdttc.json lich_su_danh_muc.csv lich_su_ptdttc.csv nhap*.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Xuất BCTC & gửi Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN_DANH_MUC || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANH_MUC || secrets.TELEGRAM_CHAT_ID }}
          MA: ${{ inputs.ma }}
          NGANH: ${{ inputs.nganh }}
        run: |
          if [ -n "$NGANH" ]; then
            python -m ptcp.xuat_bctc --nganh "$NGANH" --gui
          elif [ -n "$MA" ]; then
            python -m ptcp.xuat_bctc --ma "$MA" --gui
          else
            echo "::error::Nhập mã hoặc tên ngành"; exit 1
          fi
