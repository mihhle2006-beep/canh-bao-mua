# BACKTEST điểm vào 15' & điểm bán / mua thêm – chạy đêm mùng 2 hằng tháng (02:17 giờ VN, ngoài giờ giao dịch)
# hoặc chạy tay. Kết quả ket_qua_backtest.json được commit → cảnh báo trong phiên tự dùng cách vào tốt nhất
# (CACH_VAO_15P = "tu_dong"). Workflow riêng để các lần chạy 15' của bot không huỷ backtest giữa chừng.
name: Backtest

on:
  schedule:
    - cron: "17 19 1 * *"          # 19:17 UTC mùng 1 = 02:17 giờ VN mùng 2
  workflow_dispatch:
    inputs:
      ro:
        description: "hose_hnx = toàn sàn HOSE + HNX (mặc định, chỉ cách vào 15') · chien_luoc = 41 mã (đủ phần: điểm bán, mua thêm)"
        default: hose_hnx
        type: choice
        options: [hose_hnx, chien_luoc]

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Lấy ptcp – MỘT nguồn duy nhất (repo danh-muc)
        env:
          TOKEN: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          REPO: ${{ vars.PTCP_REPO || vars.DANH_MUC_REPO }}
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}
        run: python lay_ptcp.py

      - name: Lấy kho BCTC (định giá → mã ĐẮT ½ KL trong backtest 15' – chỉ du_lieu/bctc, không lấy file danh mục)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_DOC || secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: _kho_dm
          sparse-checkout: du_lieu/bctc/
          sparse-checkout-cone-mode: false

      - name: Nối kho BCTC vào cạnh ptcp
        run: |
          [ -d _kho_dm/du_lieu/bctc ] && ln -sfn _kho_dm/du_lieu du_lieu && ls du_lieu/bctc | wc -l || echo "Không có kho BCTC → backtest không áp ĐẮT"
          rm -f _kho_dm/*.csv _kho_dm/*.json _kho_dm/*.txt

      # restore + save riêng (save if: always) → lượt hết giờ / lỗi vẫn giữ nến 15' đã tải & kết quả từng mã
      - name: Khôi phục cache giá & kết quả (riêng cho backtest)
        uses: actions/cache/restore@v5
        with:
          path: |
            cache_gia
            cache_ptcp
            cache_du_lieu
          key: bt-${{ github.run_id }}
          restore-keys: |
            bt-
            gia-

      - name: Backtest điểm vào 15' & điểm bán
        timeout-minutes: 300                 # dừng bước trước hạn job → các bước lưu cache vẫn chạy
        # không gửi Telegram (người dùng 17/10/2026) – kết quả xem log / artifact
        run: python chay.py --che_do backtest --ro ${{ inputs.ro || 'chien_luoc' }}

      - name: Lưu cache giá & kết quả (kể cả khi lỗi / hết giờ)
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            cache_gia
            cache_ptcp
            cache_du_lieu
          key: bt-${{ github.run_id }}

      - name: Kết quả rổ HOSE + HNX
        if: always() && hashFiles('ket_qua_backtest_*.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ket-qua-backtest-${{ inputs.ro || 'chien_luoc' }}-${{ github.run_id }}
          path: |
            ket_qua_backtest_*.json
            backtest_chien_luoc.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: Lưu kết quả backtest (công khai – chỉ thống kê)
        if: always()
        run: |
          [ -f ket_qua_backtest.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ket_qua_backtest.json
          git diff --cached --quiet && echo "Không có thay đổi" && exit 0
          git commit -m "Kết quả backtest $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          echo "::error::Không đẩy được kết quả backtest – Settings → Actions → General → Workflow permissions: Read and write"; exit 1
