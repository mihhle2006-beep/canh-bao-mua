# CHẠY Ở canh-bao-mua (repo CÔNG KHAI – phút Actions miễn phí, log & artifact CÔNG KHAI) từ 10/2026; code & dữ
# liệu ở repo riêng tư danh-muc: checkout vào thư mục danh-muc/ bằng secret DANH_MUC_TOKEN_GHI (token có quyền
# GHI Contents repo danh-muc – kết quả commit về danh-muc). CONG_KHAI=1: không đọc / in danh mục
# thật hay mã PTĐTTC (ptcp.cau_hinh.CONG_KHAI).
# BỘI SỐ NGÀNH – tải giá + BCTC năm 10–20 doanh nghiệp mỗi ngành (ptcp/nganh.py) → du_lieu/boi_so_nganh.json:
# P/E, P/B, EV/EBITDA ngành gia quyền vốn hoá cho định giá J8. Chạy Chủ nhật hằng tuần (vnstock chưa có khoá ~18
# lượt/phút → cả bản đồ mất 1,5–3 giờ). Bị ngắt giữa chừng: chạy lại, mã đã cập nhật trong 6 ngày được bỏ qua.
name: Boi so nganh

on:
  workflow_dispatch:
    inputs:
      nganh:
        description: "Chỉ cập nhật 1 ngành (để trống = tất cả), VD: Bán lẻ"
        default: ""
      lam_moi:
        description: "Tải lại cả mã đã cập nhật trong 6 ngày"
        type: boolean
        default: false
  schedule:
    - cron: "13 20 * * 6"          # 03:13 Chủ nhật giờ VN – sau Kho BCTC (đọc BCTC từ kho)

permissions:
  contents: read

concurrency:
  group: dm-boi-so-nganh
  cancel-in-progress: false

jobs:
  cap_nhat:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: danh-muc
    env:
      CONG_KHAI: "1"
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
      - name: Xoá file danh mục thật (job log công khai – code không cần, CONG_KHAI)
        working-directory: .
        run: cd danh-muc 2>/dev/null || exit 0; rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json trang_thai_ptdttc.json lich_su_danh_muc.csv lich_su_ptdttc.csv nhap*.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: danh-muc/requirements.txt
      - name: Cache thư viện Python (bỏ bước cài ~30 giây khi requirements không đổi)
        id: cache_py
        uses: actions/cache@v5
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('**/requirements.txt') }}

      - name: Cài thư viện
        if: steps.cache_py.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Tải số liệu ngành
        timeout-minutes: 270           # hết giờ vẫn lưu phần đã tải (bước sau chạy với always())
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          NGANH: ${{ inputs.nganh }}
          LAM_MOI: ${{ inputs.lam_moi && '--lam_moi' || '' }}
        run: |
          if [ -n "$NGANH" ]; then
            python -m ptcp.boi_so_nganh --nganh "$NGANH" $LAM_MOI
          else
            python -m ptcp.boi_so_nganh $LAM_MOI
          fi

      - name: Lưu kết quả
        if: always()
        env:
          TOKEN_GHI: ${{ secrets.DANH_MUC_TOKEN_GHI }}
        run: |
          [ -f du_lieu/boi_so_nganh.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN_GHI" | base64 -w0)"
          git add du_lieu/boi_so_nganh.json
          git commit -q -m "Bội số ngành $(date +%F)" > /dev/null 2>&1 || { echo "Không có thay đổi"; exit 0; }
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep $((i * 5)); done
          echo "Không đẩy được – kiểm tra Settings → Actions → Workflow permissions"; exit 1
