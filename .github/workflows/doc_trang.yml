# THĂM DÒ (nhánh tạm) – API quỹ mở Fmarket công khai: danh sách quỹ, NAV, top nắm giữ.
name: Doc trang

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL trang công khai"
        required: true

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          X="--extra-index-url https://vnstocks.com/api/simple"
          for p in vnstock vnstock_ezchart vnstock-ezchart vnai; do echo "== $p"; pip index versions $p $X 2>&1 | head -3; done
          for u in vnstock-ezchart vnstock_ezchart vnstock; do echo "== simple $u"; curl -sS -m 30 -o /tmp/s.html -w '%{http_code} %{size_download}\n' https://vnstocks.com/api/simple/$u/; grep -o '[a-z_-]*-[0-9][0-9.]*[^"<]*\.whl' /tmp/s.html | tail -4; done
          echo "== dry vnstock"; pip install --dry-run -q "vnstock>=4.0.9" $X 2>&1 | tail -5
          pip download --no-deps -q -d /tmp/v "vnstock>=4.0.9" $X 2>&1 | tail -2; ls /tmp/v; python3 -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('/tmp/v/*.whl')[0]); m=[n for n in z.namelist() if n.endswith('METADATA')][0]; print([l for l in z.read(m).decode().splitlines() if l.startswith('Requires-Dist')])"
          for v in 4.0.9 4.0.8 3.2.6; do echo "== dry vnstock==$v"; pip install --dry-run -q "vnstock==$v" $X 2>&1 | tail -2; done
