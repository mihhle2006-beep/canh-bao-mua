# THĂM DÒ (nhánh tạm) – API quỹ mở Fmarket công khai: danh sách quỹ, NAV, top nắm giữ.
name: Doc trang

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL trang công khai"
        required: true

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          timeout 900 python .github/tam/do.py
          X="--extra-index-url https://vnstocks.com/api/simple"
          pip download --no-deps -q -d /tmp/v "vnstock==4.0.9" $X 2>&1 | tail -1; cd /tmp/v && python3 -m zipfile -e vnstock-*.whl w && grep -rhn "fmarket\|api\.fmarket\|/res/" w --include=*.py | head -40
