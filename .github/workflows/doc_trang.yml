# THĂM DÒ (nhánh tạm) – API quỹ mở Fmarket công khai: danh sách quỹ, NAV, top nắm giữ.
name: Doc trang

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL trang công khai"
        required: true

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request as u
          def lay(url, body=None):
              r = u.Request(url, data=json.dumps(body).encode() if body is not None else None, headers={"Content-Type": "application/json"})
              return u.urlopen(r, timeout=40).read()
          d = json.loads(lay("https://api.fmarket.vn/res/products/23"))["data"]
          print("fundReport", json.dumps(d.get("fundReport"), ensure_ascii=False)[:800])
          print("extra", json.dumps(d.get("extra"), ensure_ascii=False)[:300])
          for x in (d.get("productDocuments") or [])[:40]:
              print("TL", json.dumps({k: x.get(k) for k in ("name", "url", "fileName", "documentType", "createAt", "updateAt", "type")}, ensure_ascii=False)[:300])
          try:
              h = lay("https://fmarket.vn/quy/VESAF").decode("utf-8", "ignore")
              js = sorted(set(re.findall(r'src="([^"]+\.js)"', h)))
              print("so js", len(js))
              ep = set()
              for s in js:
                  url = s if s.startswith("http") else "https://fmarket.vn" + s
                  try: t = lay(url).decode("utf-8", "ignore")
                  except Exception as e: continue
                  ep |= set(re.findall(r'["\'`](/?res/[A-Za-z0-9_\-/{}$.]+)', t))
              print("ENDPOINT", "\n".join(sorted(ep)))
          except Exception as e: print("web loi", e)
          try:
              c = lay("https://web.archive.org/cdx/search/cdx?url=api.fmarket.vn/res/products/*&output=json&limit=20&filter=statuscode:200").decode()
              print("wayback", c[:1500])
          except Exception as e: print("wayback loi", e)
          PY
