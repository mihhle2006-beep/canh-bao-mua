# THĂM DÒ (nhánh tạm) – API quỹ mở Fmarket công khai: danh sách quỹ, NAV, top nắm giữ.
name: Doc trang

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL trang công khai"
        required: true

permissions:
  contents: read

jobs:
  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: |
          U=https://raw.githubusercontent.com/mihhle2006-beep/canh-bao-mua/du-lieu-nhanh/du_lieu.json
          for k in 1 2 3 4 5 6 7 8; do
            for q in "" "?t=$(date +%s%N)"; do
              h=$(curl -sS -D - -o /tmp/b.json "$U$q" | tr -d '\r' | grep -iE '^(cache-control|age|x-cache|x-cache-hits|etag|access-control-allow-origin):' | tr '\n' ' ')
              echo "$(date -u +%T) q=${q:+co} cap_nhat=$(python3 -c "import json; print(json.load(open('/tmp/b.json'))['cap_nhat'])") | $h"
            done
            sleep 45
          done
