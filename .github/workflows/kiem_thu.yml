# Kiểm thử canh-bao-mua + gia_lap + danh-muc (cả bộ test của repo kín danh-muc – 11/2026) với ptcp MỚI NHẤT của
# danh-muc – trước phiên mỗi ngày, mỗi lần push và khi danh-muc vừa gộp code (chạy tay / workflow_dispatch).
# ptcp không ghim phiên bản (dmuc chạy ptcp mới nhất; ghim ở đây sẽ làm 2 bên chạy 2 luật khác nhau) → bắt lỗi sớm:
# ptcp mới làm hỏng bot → Telegram báo trước 9:00 thay vì bot hỏng giữa phiên.
name: Kiem thu

on:
  schedule:
    - cron: "41 0 * * 1-5"          # 07:41 giờ VN, thứ Hai – thứ Sáu
  push:
    branches: [main]
  # bỏ pull_request (11/2026): PR được gộp ngay → mỗi thay đổi bị test 2 lần (PR + push lên main)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiem-thu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gac:                             # lịch GitHub tới trễ mà đồng hồ / bấm tay đã chạy từ mốc này → bỏ lượt (gac.yml)
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/gac.yml
    with:
      wf: kiem_thu.yml
    permissions:
      actions: read
      contents: read
  kiem_thu:
    needs: gac
    if: ${{ !cancelled() && needs.gac.outputs.chay != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKEN: ${{ secrets.DANH_MUC_TOKEN_GHI }}
    steps:
      - name: Bỏ qua khi không có secret (PR từ fork)
        id: co
        run: echo "co=$([ -n "$TOKEN" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.co.outputs.co == '1'

      - uses: actions/setup-python@v6
        if: steps.co.outputs.co == '1'
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài thư viện
        if: steps.co.outputs.co == '1'
        run: pip install -q -r requirements.txt > /dev/null

      - name: Lấy ptcp mới nhất (repo danh-muc)
        if: steps.co.outputs.co == '1'
        env:
          REPO: ${{ vars.PTCP_REPO || vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          DUONG_DAN: ${{ vars.PTCP_PATH || 'ptcp' }}
        run: python lay_ptcp.py

      - name: Test canh-bao-mua
        if: steps.co.outputs.co == '1'
        run: python -m pytest -q

      - uses: actions/checkout@v5
        if: steps.co.outputs.co == '1'
        with:
          repository: ${{ vars.GIA_LAP_REPO || 'mihhle2006-beep/gia_lap' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: gia_lap

      - name: Test gia_lap (repo kín – log chỉ in dòng tổng kết)
        if: steps.co.outputs.co == '1'
        run: |
          rm -f gia_lap/giao_dich_ao*.json gia_lap/giao_dich_ao*.csv     # không cần trạng thái tài khoản ảo để test
          ln -s "$GITHUB_WORKSPACE" gia_lap/canh-bao-mua
          cd gia_lap && pip install -q -r requirements.txt > /dev/null
          ma=0; python -m pytest -q -p no:cacheprovider > /tmp/gl.txt 2>&1 || ma=$?
          tail -n 1 /tmp/gl.txt; exit $ma

      - uses: actions/checkout@v5
        if: steps.co.outputs.co == '1'
        with:
          repository: ${{ vars.DANH_MUC_REPO || 'mihhle2006-beep/danh-muc' }}
          token: ${{ secrets.DANH_MUC_TOKEN_GHI }}
          persist-credentials: false
          path: danh-muc
          sparse-checkout: |              # bỏ kho BCTC + chiến lược DN (~585 MB / ~615 MB repo); giữ HPG.json – test_dinh_gia đọc file thật
            /*
            !/du_lieu/bctc/*
            /du_lieu/bctc/HPG.json
            !/du_lieu/chien_luoc_dn/
          sparse-checkout-cone-mode: false

      - name: Test danh-muc (repo kín – xoá file danh mục thật, log chỉ in dòng tổng kết)
        if: steps.co.outputs.co == '1'
        run: |
          cd danh-muc
          rm -f danh_muc*.csv da_ban*.csv lenh_that*.csv tien_mat_*.json trang_thai_vi_the.json lich_su_danh_muc.csv \
                nhap*.txt trung_vang*.json
          pip install -q -r requirements.txt > /dev/null
          ma=0; python -m pytest -q -p no:cacheprovider tests/ > /tmp/dm.txt 2>&1 || ma=$?
          tail -n 1 /tmp/dm.txt
          [ $ma -eq 0 ] || grep -E "^(FAILED|ERROR) " /tmp/dm.txt | cut -d' ' -f2 | cut -d'[' -f1 | sort -u   # chỉ tên test hỏng
          exit $ma

      - name: Báo Telegram khi hỏng
        if: failure() && github.event_name != 'pull_request'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Kiểm thử hỏng (ptcp mới hoặc code mới) – bot có thể lỗi trong phiên. Xem: ${URL}"
