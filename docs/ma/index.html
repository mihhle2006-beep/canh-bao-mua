<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tra cứu mã</title>
<meta name="description" content="Tra cứu cổ phiếu HOSE / HNX: biểu đồ nến, báo cáo tài chính đầy đủ, định giá, cổ đông, cổ tức, lịch sử giá, tin & báo cáo CTCK, hồ sơ, phân tích hệ thống.">
<style>
:root{
  --nen:#f3f5f8;--the:#fff;--vien:#e3e7ee;--luoi:#edf0f4;--nhat:#f7f9fc;
  --chu:#1d2430;--chu2:#4b5565;--mo:#7a8494;
  --tang:#0f8a4a;--giam:#d1342b;--dung:#b88a00;--tran:#9b3fd1;--san:#0e9fb3;
  --tang-nen:#e3f4ea;--giam-nen:#fde8e6;--dung-nen:#fbf3d6;
  --nhan:#1f6feb;--nhan-nen:#e8f0fe;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nen);color:var(--chu);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--nhan);text-decoration:none}a:hover{text-decoration:underline}
.so,td,.v{font-variant-numeric:tabular-nums}
.t{color:var(--tang)}.g{color:var(--giam)}.d{color:var(--dung)}.m{color:var(--mo)}.tr{color:var(--tran)}.sa{color:var(--san)}
button{font:inherit;color:inherit;cursor:pointer}
header.dau{background:var(--the);border-bottom:1px solid var(--vien);position:sticky;top:0;z-index:30}
.dau-trong{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dau-trong h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap}
.dau-trong h1 a{color:inherit}
/* ô tìm kiểu Google: bo tròn, bóng khi rê / gõ, gợi ý thả xuống (mã · tên · sàn), ↑↓ Enter Esc */
.gg{position:relative;flex:1 1 300px;max-width:560px}
.gg input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;height:40px;border:1px solid #dfe1e5;border-radius:20px;
  padding:0 40px 0 18px;background:#fff;color:inherit;outline:0;transition:box-shadow .15s;text-transform:uppercase;letter-spacing:.3px}
.gg input::placeholder{text-transform:none;letter-spacing:0}
.gg input:hover,.gg input:focus,.gg.mo input{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.gg.mo input{border-radius:20px 20px 0 0}
.gg .xoa{position:absolute;right:8px;top:0;height:40px;width:32px;border:0;background:none;font-size:22px;line-height:1;color:#70757a;display:none}
.gg.co .xoa{display:block}
.gg ul{display:none;position:absolute;left:0;right:0;top:100%;margin:0;padding:4px 0 10px;list-style:none;background:#fff;
  border-radius:0 0 20px 20px;box-shadow:0 4px 6px rgba(32,33,36,.28);z-index:60;border-top:1px solid #e8eaed}
.gg.mo ul{display:block}
.gg li{padding:7px 18px;display:flex;gap:12px;align-items:baseline;cursor:pointer;white-space:nowrap}
.gg li.chon,.gg li:hover{background:#f1f3f4}
.gg li b{min-width:46px;font-weight:650}
.gg li span{color:var(--mo);font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.gg li i{margin-left:auto;font-style:normal;color:var(--mo);font-size:12px}
.gg-lon{max-width:620px;margin:0 auto}
.gg-lon input{height:50px;font-size:17px;border-radius:25px;padding:0 46px 0 24px}
.gg-lon .xoa{height:50px;right:12px}
.gg-lon.mo input{border-radius:25px 25px 0 0}.gg-lon ul{border-radius:0 0 25px 25px}.gg-lon li{padding:8px 24px}
.dau-chinh{text-align:center;padding:42px 0 30px}
.dau-chinh h2{font-size:30px;font-weight:650;margin:0 0 22px;letter-spacing:-.3px}
.dau-chinh p{color:var(--mo);font-size:13px;margin:14px 0 0}
body.o-dau .dau-trong .gg{display:none}
.lien{margin-left:auto;display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;margin-bottom:14px}
.khoi-dau{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--luoi);flex-wrap:wrap}
.khoi-dau h2{font-size:15px;margin:0;font-weight:650}
.khoi-dau .phu{color:var(--mo);font-size:12.5px}
.khoi-dau .nut{margin-left:auto}
.than{padding:12px 14px}
.trong{padding:14px;color:var(--mo)}
.nut{display:inline-flex;gap:2px;background:var(--nen);border-radius:8px;padding:2px;flex-wrap:wrap}
.nut button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--chu2);white-space:nowrap}
.nut button[aria-pressed=true]{background:var(--the);color:var(--chu);font-weight:600;box-shadow:0 1px 2px #0001}
/* đầu mã */
.ma-dau{position:sticky;top:53px;z-index:20;background:var(--the);border:1px solid var(--vien);border-radius:12px;margin-bottom:12px}
.ma-tren{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 14px 8px}
.ma-ten{flex:1 1 280px;min-width:0}
.ma-ten h2{margin:0;font-size:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ma-ten .ten-dd{color:var(--chu2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhan-san{font-size:11px;font-weight:600;color:var(--mo);border:1px solid var(--vien);border-radius:4px;padding:0 5px}
.ma-gia{text-align:right}
.ma-gia .lon{font-size:28px;font-weight:700;line-height:1.1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px;margin-left:6px}
.pill.t{background:var(--tang-nen)}.pill.g{background:var(--giam-nen)}.pill.d{background:var(--dung-nen)}
.ma-gia .nho{color:var(--mo);font-size:12px;margin-top:2px}
.huy{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;margin:4px 6px 0 0;white-space:nowrap}
.huy.re{background:var(--tang-nen);color:var(--tang)}.huy.dat{background:var(--giam-nen);color:var(--giam)}
.huy.hl{background:var(--luoi);color:var(--chu2)}.huy.bot{background:var(--nhan-nen);color:var(--nhan)}
.huy.giu{background:var(--dung-nen);color:#6b5200}
.tab{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 8px;border-top:1px solid var(--luoi)}
.tab::-webkit-scrollbar{display:none}
.tab a{padding:9px 10px;color:var(--chu2);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;text-decoration:none}
.tab a[aria-current=page]{color:var(--nhan);border-bottom-color:var(--nhan);font-weight:650}
@media (max-width:600px){.dau-trong .gg{flex:1 1 100%;order:3}.dau-chinh{padding:22px 0 18px}.dau-chinh h2{font-size:24px}.ma-dau{top:auto;position:relative}.ma-gia{text-align:left}.ma-gia .lon{font-size:24px}.an-dt{display:none}
  .lien{margin-left:0}}
/* lưới số */
.luoi-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.luoi-so>div{padding:9px 14px;box-shadow:inset -1px -1px 0 var(--luoi)}
.luoi-so .n{color:var(--mo);font-size:12px}
.luoi-so .v{font-size:16px;font-weight:650}
.luoi-so .c{color:var(--mo);font-size:11.5px}
.hai{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.hai,.ba{grid-template-columns:minmax(0,1fr)}}
.bieu{position:relative}
.bieu svg{display:block;width:100%;height:auto}
.hieu-suat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--luoi)}
.hieu-suat div{padding:8px 6px;text-align:center;box-shadow:inset -1px 0 0 var(--luoi)}
.hieu-suat .n{color:var(--mo);font-size:12px}.hieu-suat b{font-size:14px}
@media (max-width:600px){.hieu-suat{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* nến */
.nen-khung{position:relative;padding:4px 8px 6px}
.nen-khung canvas{display:block;width:100%;height:360px;touch-action:pan-y}
@media (max-width:600px){.nen-khung canvas{height:300px}}
.nen-dk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px 0}
.nen-dk label{font-size:12.5px;color:var(--chu2);display:inline-flex;gap:4px;align-items:center}
.goi-y{position:absolute;pointer-events:none;background:#1d2430;color:#fff;font-size:12px;line-height:1.45;
  padding:6px 9px;border-radius:6px;z-index:5;display:none;white-space:nowrap;box-shadow:0 4px 14px #0003}
.chu-giai{display:flex;gap:12px;font-size:11.5px;color:var(--mo);padding:4px 14px 10px;flex-wrap:wrap}
.chu-giai i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.chu-giai i.o{height:9px}
/* bảng */
.bang-boc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--mo);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;text-align:right;
  padding:7px 10px;border-bottom:1px solid var(--vien);white-space:nowrap;background:var(--the)}
th:first-child,th.trai,td.trai{text-align:left}
td{padding:6px 10px;border-bottom:1px solid var(--luoi);text-align:right;white-space:nowrap}
td.bo{white-space:normal;min-width:220px;max-width:520px}
tr.c1 td{font-weight:650;background:#fafbfd}
.bctc td:first-child,.bctc th:first-child{position:sticky;left:0;background:inherit;z-index:1;min-width:220px;max-width:340px;white-space:normal}
.bctc tr{background:var(--the)}.bctc tr.c1{background:#fafbfd}
.sort th{cursor:pointer;user-select:none}
.sort th[aria-sort]::after{content:" ▾";color:var(--nhan)}
.sort th[aria-sort=ascending]::after{content:" ▴"}
tbody tr.bam{cursor:pointer}tbody tr.bam:hover{background:#f7f9fc}
.them{display:block;margin:10px auto;border:1px solid var(--vien);background:var(--the);border-radius:8px;padding:6px 14px}
/* thẻ nhỏ */
.dong{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--luoi)}
.dong:last-child{border-bottom:0}.dong .n{color:var(--chu2)}.dong .v{font-weight:600;text-align:right}
.ds-tin a{display:block;padding:9px 14px;border-bottom:1px solid var(--luoi);color:var(--chu)}
.ds-tin a:hover{background:var(--nhat);text-decoration:none}
.ds-tin .ngay{color:var(--mo);font-size:12px}
.thanh-pt{height:8px;background:var(--luoi);border-radius:4px;position:relative;overflow:hidden}
.thanh-pt span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.vach{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--chu)}
.nhan-xet{margin:0;padding:10px 14px;background:var(--dung-nen);color:#5c4700;font-size:13px}
.nhan-xet:empty{display:none}
.bt{padding:10px 14px;border-bottom:1px solid var(--luoi)}.bt:last-child{border-bottom:0}
.muc{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px}
.muc.rr{background:var(--giam-nen);color:var(--giam)}.muc.cy{background:var(--dung-nen);color:#6b5200}.muc.ok{background:var(--tang-nen);color:var(--tang)}
.bt p{margin:4px 0 0;font-size:13px;color:var(--chu2)}
blockquote{margin:6px 0 0;padding:6px 10px;border-left:3px solid var(--vien);color:var(--chu2);font-size:12.5px;background:#fafbfc}
details{padding:10px 14px;border-bottom:1px solid var(--luoi)}details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600}
details p,.van{font-size:13px;color:var(--chu2);white-space:pre-line;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--vien);border-radius:999px;padding:3px 10px;
  margin:0 6px 6px 0;background:var(--the);font-size:13px;color:var(--chu)}
a.chip:hover{border-color:var(--nhan);text-decoration:none}
.nhom-chip h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mo);margin:10px 0 6px;font-weight:650}
.f-ds{list-style:none;margin:0;padding:6px 14px 10px}.f-ds li{padding:4px 0;font-size:13px;display:flex;gap:8px}
.f-ds .k{width:18px;text-align:center;font-weight:700}
.diem-lon{font-size:30px;font-weight:700}
.cty{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--luoi)}
.cty:last-child{border-bottom:0}
.cty .ic{width:36px;height:36px;border-radius:9px;background:var(--nhan-nen);display:grid;place-items:center;font-size:17px;flex:none}
.cty .tt{flex:1;min-width:0}.cty .tt>b{display:block}.cty .tt span{color:var(--mo);font-size:12.5px}
.loc-dau{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.loc-dau input,.loc-dau select{font:inherit;border:1px solid var(--vien);border-radius:8px;padding:6px 10px;background:var(--the)}
.bat{border:1px solid var(--vien);border-radius:8px;padding:6px 10px;background:var(--the)}
.bat[aria-pressed=true]{background:var(--nhan-nen);border-color:var(--nhan);color:var(--nhan);font-weight:600}
.loc-dau .dem{margin-left:auto;color:var(--mo);font-size:12.5px}
.cuoi{color:var(--mo);font-size:12px;margin:18px 0}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.sub button{border:1px solid var(--vien);background:var(--the);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--chu2)}
.sub button[aria-pressed=true]{background:var(--nhan);border-color:var(--nhan);color:#fff;font-weight:600}
.nut-tai{border:1px solid var(--nhan);color:var(--nhan);background:var(--the);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600}
.nut-tai:hover{background:var(--nhan-nen)}
.bd-gia{position:relative;height:480px;margin:0 8px 8px}
@media (max-width:600px){.bd-gia{height:380px}}
.chu-bd{position:absolute;left:8px;top:6px;z-index:3;font-size:12px;line-height:1.5;background:#ffffffd9;border-radius:6px;padding:2px 6px;pointer-events:none}
.chu-bd b{font-weight:650}
.cham-song{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tang);margin-right:5px;vertical-align:middle}
.the-chu{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle}
.the-chu.giu{background:var(--dung-nen);color:#6b5200}.the-chu.bot{background:var(--nhan-nen);color:var(--nhan)}
.cty .ic{font-size:13px;font-weight:700;color:var(--nhan)}
tr.chon td{background:var(--nhan-nen)}
.cs-ten{cursor:pointer}.cs-ten:hover{color:var(--nhan)}
</style>
</head>
<body>
<header class="dau"><div class="dau-trong">
  <h1><a href="#">Tra cứu mã</a></h1>
  <div class="gg" id="tim-dau"><input id="o-tim" placeholder="Nhập mã – VD HPG" aria-label="Tìm mã cổ phiếu"
    maxlength="10" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list"><button class="xoa" type="button"
    aria-label="Xoá">×</button><ul role="listbox"></ul></div>
  <div class="lien"><a href="#loc">Lọc KQKD</a><a href="#nganh">Ngành</a><a href="../thi_truong/">Thị trường</a><a href="../">Tổng hợp</a></div>
</div></header>
<main>
  <div id="noi-dung"><div class="trong">Đang tải dữ liệu…</div></div>
  <p class="cuoi" id="cuoi"></p>
</main>
<div class="goi-y" id="goi-y"></div>
<script>
"use strict";
const DL = "du_lieu/", TT = "../thi_truong/du_lieu.json";
const TAB = [["tong-quan", "Tổng quan"], ["tin", "Tin tức"], ["ho-so", "Hồ sơ"], ["lanh-dao", "Lãnh đạo"], ["co-dong", "Cổ đông"],
  ["co-tuc", "Cổ tức"], ["tai-chinh", "Tài chính"], ["chi-so", "Chỉ số"], ["dinh-gia", "Định giá"], ["lich-su", "Lịch sử giá"],
  ["bao-cao", "Báo cáo CTCK"], ["tai-lieu", "Tài liệu"], ["he-thong", "Hệ thống"]];
let DS = null, META = {}, NG = null, MKT = null, LIVE = {}, BOT = {}, GIU = new Set(), CT_BCTC = null, TEN_CT = null;
const KHO = {};                     // mã → {r, g, n, b}
const ST = {ky: "q", bang: "kd", ls: "gia", ls_n: 30, nen: 130, ma_tb: [20, 50], kl: true, sk: "tat", khung: "D", duoi: "kl", tc: "bc", cd: "co-cau", cs: 0, cs_chon: null, tl: "BCTC"};
let CS_NGANH = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const url = u => /^https?:\/\//i.test(u || "") ? esc(u) : "";
const so = (v, l = 0) => v == null || !isFinite(v) ? "–" : Number(v).toLocaleString("vi-VN", {minimumFractionDigits: l, maximumFractionDigits: l});
const ty = v => v == null || !isFinite(v) ? "–" : so(v, Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2);
const pt = (v, l = 0, dau = true) => v == null || !isFinite(v) ? "–" : (dau && v > 0 ? "+" : "") + so(v * 100, l) + "%";
const mau = v => v == null || !isFinite(v) ? "" : v > 0 ? "t" : v < 0 ? "g" : "d";
const kl = v => v == null ? "–" : Math.abs(v) >= 1e9 ? so(v / 1e9, 2) + " tỷ" : Math.abs(v) >= 1e6 ? so(v / 1e6, 2) + " tr" : Math.abs(v) >= 1e3 ? so(v / 1e3, 1) + " N" : so(v, 0);
const ngay_vn = d => d ? String(d).slice(0, 10).split("-").reverse().join("/") : "–";
const MA_OK = m => /^[A-Z0-9]{3,8}$/.test(m || "");
const tb = a => { const x = a.filter(v => v != null && isFinite(v)); return x.length ? x.reduce((s, v) => s + v, 0) / x.length : null; };
const trung_vi = a => { const x = a.filter(v => v != null && isFinite(v)).sort((p, q) => p - q); return x.length ? (x.length % 2 ? x[(x.length - 1) / 2] : (x[x.length / 2 - 1] + x[x.length / 2]) / 2) : null; };
const W_RONG = () => innerWidth < 700 ? 400 : Math.max(640, Math.min(1100, innerWidth - 140));   // biểu đồ hết khung
const MAU = ["#1f6feb", "#0f8a4a", "#e8710a", "#9b3fd1", "#0e9fb3", "#d1342b", "#7a8494"];

async function lay(u, bat_buoc = true) {
  try {
    const r = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Math.floor(Date.now() / 300000), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status + " " + u);
    return await r.json();
  } catch (e) { if (bat_buoc) throw e; return null; }
}
async function tai_thi_truong() {
  const m = await lay(TT, false);
  if (!m) return;
  MKT = m; LIVE = {}; BOT = {};
  const c = m.loc?.cot || [];
  for (const r of m.loc?.dong || []) { const o = {}; c.forEach((k, i) => o[k] = r[i]); LIVE[o.ma] = o; }
  for (const r of m.tin_hieu?.ma || []) BOT[r[0]] = r;
  GIU = new Set((m.danh_muc || []).filter(MA_OK));
}
async function tai_ma(ma) {
  const k = KHO[ma] || (KHO[ma] = {});
  if (!k.p) k.p = Promise.all([lay(DL + "ma/" + ma + ".json", false), lay(DL + "gia/" + ma + ".json", false),
    lay(DL + "dn/" + ma + ".json", false)]).then(([r, g, n]) => { k.r = r; k.g = g; k.n = n; });
  await k.p; return k;
}
async function tai_bctc(ma) {
  const k = KHO[ma];
  if (k.b === undefined) {
    [k.b, CT_BCTC, TEN_CT] = await Promise.all([lay(DL + "bctc/" + ma + ".json", false),
      CT_BCTC ?? lay(DL + "cau_truc_bctc.json", false).then(x => x || {}), TEN_CT ?? lay(DL + "chi_tieu.json", false).then(x => x || {})]);
  }
  return k.b;
}

// ---------------------------------------------------------------- giá hiện tại & chỉ báo
function gia_nay(ma, k) {                      // nghìn đồng
  const l = LIVE[ma];

  const g = k.g, n = g?.c?.length;
  if (n) return {gia: g.c[n - 1], tc: n > 1 ? g.c[n - 2] : null, pt: n > 1 ? g.c[n - 1] / g.c[n - 2] - 1 : null,
    cao: g.h[n - 1], thap: g.l[n - 1], mo: g.o[n - 1], gt: g.gt[n - 1], kl: g.v[n - 1], ngay: g.d[n - 1]};
  if (k.r?.gia) return {gia: k.r.gia / 1000};

}
function chuoi_gia(k, ma) {                    // lịch sử + nến hôm nay (bảng giá trong phiên) nếu chưa có
  const g = k.g;

  const x = {d: [...g.d], o: [...g.o], h: [...g.h], l: [...g.l], c: [...g.c], v: [...g.v], nn: [...(g.nn || [])]};
  const l = LIVE[ma], ph = MKT?.phien, cuoi = x.d[x.d.length - 1];
  if (l && l.gia && ph && ph > cuoi && l.co_gd) {
    const c0 = x.c[x.c.length - 1];
    if (phien_sau(cuoi) !== ph) x.cu = cuoi;                     // lịch sử giá chưa cập nhật tới phiên trước
    else if (l.tc && c0 && Math.abs(l.tc / c0 - 1) > .01 && !/UPCOM/i.test(k.r?.san || "")) {   // ngày GDKHQ (cổ tức / tách):
                                                                 // tham chiếu đã điều chỉnh (UPCoM: tham chiếu = giá BQ, bỏ)
      const k = l.tc / c0; for (const a of [x.o, x.h, x.l, x.c]) for (let i = 0; i < a.length; i++) if (a[i] != null) a[i] *= k;
      x.dc = k;

    x.d.push(ph); x.o.push(l.tc || l.gia); x.h.push(l.cao || l.gia); x.l.push(l.thap || l.gia); x.c.push(l.gia); x.v.push(null); x.nn.push(l.nn);

function f_cs(kieu) { return kieu === "%" ? v => pt(v, 2, false) : kieu === "%a" ? v => pt(Math.abs(v), 2, false) : kieu === "d" ? v => so(v, 0) : kieu === "ty" ? v => so(v, 0) : v => so(v, 2); }

  $("#l-tim").oninput = e => { LOC.tim = e.target.value.trim().toUpperCase(); ve_loc(); };
  $("#l-san").onchange = e => { LOC.san = e.target.value; ve_loc(); };
  $("#l-nganh").onchange = e => { LOC.nganh = e.target.value; ve_loc(); };
  document.querySelectorAll("[data-bat]").forEach(b => b.onclick = () => { const k = b.dataset.bat; LOC.bat.has(k) ? LOC.bat.delete(k) : LOC.bat.add(k); b.setAttribute("aria-pressed", LOC.bat.has(k)); ve_loc(); });
  document.querySelectorAll("#bang-loc th").forEach(th => th.onclick = () => { const k = th.dataset.k; LOC.tang = LOC.sx === k ? !LOC.tang : ["ma", "nganh", "pe_h", "pb_h"].includes(k); LOC.sx = k; ve_loc(); });
  ve_loc();
  $("#cuoi").textContent = `BCTC tới ${(META.quy || []).slice(-1)[0] || ""} · cập nhật ${META.cap_nhat || ""}`;
}
function ve_loc() {
  const ds = DS.filter(r => (!LOC.san || r.san === LOC.san) && (!LOC.nganh || r.nganh === LOC.nganh)
    && (!LOC.tim || r.ma.includes(LOC.tim) || (r.nganh || "").toUpperCase().includes(LOC.tim) || (r.ten || "").toUpperCase().includes(LOC.tim)) && [...LOC.bat].every(k => BAT[k][1](r)));
  const k = LOC.sx, d = LOC.tang ? 1 : -1;
  ds.sort((a, b) => { const x = a[k], y = b[k]; if (x == null || x === "") return 1; if (y == null || y === "") return -1; return (typeof x === "string" ? x.localeCompare(y, "vi") : x - y) * d; });
  document.querySelectorAll("#bang-loc th").forEach(th => th.dataset.k === k ? th.setAttribute("aria-sort", LOC.tang ? "ascending" : "descending") : th.removeAttribute("aria-sort"));
  $("#l-dem").textContent = `${ds.length} / ${DS.length} mã`;
  $("#bang-loc tbody").innerHTML = ds.slice(0, 400).map(r => `<tr class="bam" data-ma="${esc(r.ma)}">${COT.map(([c]) => o_loc(r, c)).join("")}</tr>`).join("")
    + (ds.length > 400 ? `<tr><td class="trai m" colspan="${COT.length}">… còn ${ds.length - 400} mã – lọc hẹp hơn để xem</td></tr>` : "");
  $("#bang-loc tbody").onclick = e => { const tr = e.target.closest("tr[data-ma]"); if (tr && !e.target.closest("a")) location.hash = tr.dataset.ma; };
}
async function hien_nganh() {
  document.title = "Ngành – Tra cứu mã";
  if (!NG) NG = (await lay(DL + "nganh.json", false)) || {ds: []};
  $("#noi-dung").innerHTML = the("Bội số ngành", `năm kiểm toán gần nhất · P/E, P/B gia quyền vốn hoá · ROE, tăng LNST trung vị · cập nhật ${esc(NG.cap_nhat || "")}`,
    `<div class="bang-boc"><table><thead><tr><th class="trai">Ngành</th><th>Số mã</th><th>P/E</th><th>P/B</th><th>ROE</th><th>Tăng LNST</th><th>Vốn hoá (tỷ)</th><th class="trai">Mã lớn nhất</th></tr></thead><tbody>` +
    (NG.ds || []).map(x => `<tr><td class="trai"><b>${esc(x.nganh)}</b></td><td>${x.so_ma}</td><td>${x.pe ? so(x.pe, 1) : "–"}</td><td>${x.pb ? so(x.pb, 2) : "–"}</td><td>${x.roe != null ? so(x.roe, 1) + "%" : "–"}</td><td class="${mau(x.tang)}">${x.tang != null ? so(x.tang, 1) + "%" : "–"}</td><td>${so(x.von_hoa, 0)}</td><td class="trai">${(x.ma || []).slice(0, 6).map(m => `<a href="#${esc(m)}">${esc(m)}</a>`).join(" ")}</td></tr>`).join("") + `</tbody></table></div>`);
  $("#cuoi").textContent = "";
}

// ---------------------------------------------------------------- xuất Excel
function xlsx_bctc(ma) {
  const b = KHO[ma]?.b; if (!b) return;
  const sheets = [];
  for (const [bang, ten] of [["kd", "KQKD"], ["cd", "CDKT"], ["lc", "LCTT"]]) for (const q of [true, false]) {
    const nq = b.q.length, nhan = q ? b.q : b.y, cay = (CT_BCTC || {})[b.loai]?.[bang] || [], co = b[bang] || {};
    const dong = cay.filter(x => co[x[0]]).map(x => [x[0], x[1], x[2]]);
    for (const c of Object.keys(co)) if (!dong.some(x => x[0] === c)) dong.push([c, 1, ten_ct(b, bang, c)]);
    sheets.push([`${ten} ${q ? "quy" : "nam"}`, [["Tỷ đồng", ...nhan], ...dong.map(([c, lv, t]) => ["  ".repeat(Math.max(0, lv - 1)) + t, ...(q ? co[c].slice(0, nq) : co[c].slice(nq))])]]);
  }
  tai_xlsx(`${ma}_BCTC.xlsx`, sheets);
}
function xlsx_so_huu(ma, k) {
  const n = k.n || {}, cc = n.cc || {};
  tai_xlsx(`${ma}_co_cau_so_huu.xlsx`, [
    ["Co cau", [["Nhóm", "% sở hữu"], ["Nhà nước", cc.nha_nuoc], ["Nước ngoài", cc.nuoc_ngoai], ["Khác", cc.khac], ["HĐQT & ban điều hành", cc.hdqt], ["Tổ chức", cc.to_chuc], ["Tổng CP", cc.tong_cp]]],
    ["Co dong lon", [["Cổ đông", "Mã", "Chức vụ", "Loại", "Số CP", "Tỷ lệ %", "Cập nhật"], ...(n.cd || []).map(x => [x.ten, x.ma, x.cv, x.loai, x.sl, x.pt, x.ngay])]],
    ["NN cuoi nam", [["Năm", "% nước ngoài"], ...(n.nn_nam || [])]],
    ["Giao dich noi bo", [["Công bố", "Người GD", "Chức vụ", "Liên quan", "Loại", "Đăng ký", "Thực hiện", "Trước", "Sau", "Sau %", "Trạng thái"], ...(n.nb || []).map(x => [x.ngay, x.ten, x.cv, x.lien_quan, x.hd, x.dk, x.kq, x.truoc, x.sau, x.sau_pt, x.tt])]]]);
}
function xlsx_chi_so(ma, k) {
  const cs = k.n?.cs; if (!cs) return;
  const rows = [["Chỉ số", ...cs.ky]];
  for (const [t, ds] of NHOM_CS) for (const [key, ten] of ds) if (cs[key]) rows.push([`${t} – ${ten}`, ...cs[key]]);
  tai_xlsx(`${ma}_chi_so.xlsx`, [["Chi so", rows]]);
}

// ---------------------------------------------------------------- điều hướng
async function hien_ma(ma, tab) {
  const nd = $("#noi-dung");
  if (!KHO[ma]?.r && !KHO[ma]?.p) nd.innerHTML = `<div class="trong">Đang tải ${esc(ma)}…</div>`;
  const k = await tai_ma(ma);
  if (!k.r && !k.g && !k.n) {
    const l = LIVE[ma];
    nd.innerHTML = `<div class="the"><div class="trong">Không có dữ liệu cho <b>${esc(ma)}</b>${l ? ` (giá ${so(l.gia, 2)} · ${pt(l.pt / 100, 2)})` : ""}. Trang có ${DS.length} mã HOSE / HNX có BCTC.</div></div>`;
    return;
  }
  document.title = `${ma} – ${TAB.find(t => t[0] === tab)?.[1] || ""} – Tra cứu mã`;
  const ve = {"tong-quan": tong_quan, "tin": tin, "ho-so": ho_so, "lanh-dao": lanh_dao, "co-dong": co_dong, "co-tuc": co_tuc, "tai-chinh": tai_chinh,
    "chi-so": chi_so, "dinh-gia": dinh_gia, "lich-su": lich_su, "bao-cao": bao_cao, "tai-lieu": tai_lieu, "he-thong": he_thong}[tab] || tong_quan;
  const than = await ve(ma, k);
  nd.innerHTML = dau_ma(ma, k, tab) + than;
  gan_su_kien(ma, k, tab);
  $("#cuoi").textContent = `BCTC cập nhật ${k.r?.cap_nhat || "–"} · giá & doanh nghiệp ${k.g?.cap_nhat || k.n?.cap_nhat || "–"} · giá trong phiên từ Bảng thị trường · không phải khuyến nghị đầu tư.`;
}
function gan_su_kien(ma, k, tab) {
  const ve_lai = () => hien_ma(ma, tab);
  document.querySelectorAll("[data-nen]").forEach(b => b.onclick = () => { ST.nen = +b.dataset.nen; ve_lai(); });
  document.querySelectorAll("[data-ma]").forEach(b => b.onchange = () => { const m = +b.dataset.ma; ST.ma_tb = b.checked ? [...new Set([...ST.ma_tb, m])].sort((a, c) => a - c) : ST.ma_tb.filter(x => x !== m); ve_lai(); });
  document.querySelectorAll("[data-ky]").forEach(b => b.onclick = () => { ST.ky = b.dataset.ky; ve_lai(); });
  document.querySelectorAll("[data-bang]").forEach(b => b.onclick = () => { ST.bang = b.dataset.bang; ve_lai(); });
  document.querySelectorAll("[data-ls]").forEach(b => b.onclick = () => { ST.ls = b.dataset.ls; ST.ls_n = 30; ve_lai(); });
  document.querySelectorAll("[data-sk]").forEach(b => b.onclick = () => { ST.sk = b.dataset.sk; ve_lai(); });
  if ($("#ls-them")) $("#ls-them").onclick = () => { ST.ls_n += 30; ve_lai(); };
  document.querySelectorAll("[data-khung]").forEach(b => b.onclick = () => { ST.khung = b.dataset.khung; ve_lai(); });
  document.querySelectorAll("[data-duoi]").forEach(b => b.onclick = () => { ST.duoi = b.dataset.duoi; ve_lai(); });
  document.querySelectorAll("[data-tc]").forEach(b => b.onclick = () => { ST.tc = b.dataset.tc; ve_lai(); });
  document.querySelectorAll("[data-cd]").forEach(b => b.onclick = () => { ST.cd = b.dataset.cd; ve_lai(); });
  document.querySelectorAll("[data-tl]").forEach(b => b.onclick = () => { ST.tl = b.dataset.tl; ve_lai(); });
  document.querySelectorAll("[data-csn]").forEach(b => b.onclick = () => { ST.cs = +b.dataset.csn; ST.cs_chon = null; ve_lai(); });
  document.querySelectorAll("[data-cs]").forEach(b => b.onclick = () => { ST.cs_chon = b.dataset.cs; ve_lai(); });
  if ($("#tai-bctc")) $("#tai-bctc").onclick = () => xlsx_bctc(ma);
  if ($("#tai-so-huu")) $("#tai-so-huu").onclick = () => xlsx_so_huu(ma, k);
  if ($("#tai-cs")) $("#tai-cs").onclick = () => xlsx_chi_so(ma, k);
  const bb = $("#bang-bctc"); if (bb) bb.scrollLeft = bb.scrollWidth;
  const bd = $("#bd-gia");
  if (bd) ve_bd_gia(bd, chuoi_gia(k, ma)).catch(() => { bd.innerHTML = '<div class="trong">Không tải được thư viện biểu đồ – thử tải lại trang.</div>'; });
  else if (BD_GIA) { try { BD_GIA.remove(); } catch (e) {} BD_GIA = null; }
}
function tim_ma(q) {
  q = (q || "").trim().toUpperCase(); if (!q) return null;
  if (DS.some(r => r.ma === q) || (MA_OK(q) && LIVE[q])) return q;
  const k = BO_DAU(q), r = DS.find(r => r.ma.startsWith(q)) || DS.find(r => BO_DAU(ten_ma(r)).includes(k));
  return r ? r.ma : MA_OK(q) ? q : null;
}
function dinh_tuyen() {
  const [a, b] = decodeURIComponent(location.hash.slice(1)).split("/"), h = (a || "").toUpperCase();
  const dat = v => { $("#o-tim").value = v; $("#tim-dau").classList.toggle("co", !!v); };
  document.body.classList.toggle("o-dau", !h);
  if (h === "LOC") { dat(""); return hien_loc(); }
  if (h === "NGANH") { dat(""); return hien_nganh(); }
  if (MA_OK(h)) { dat(h); return hien_ma(h, TAB.some(t => t[0] === b) ? b : "tong-quan"); }
  dat(""); return hien_dau();
}
// ---------------------------------------------------------------- ô tìm kiểu Google (gợi ý theo mã rồi theo tên, bỏ dấu)
const BO_DAU = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toUpperCase();
const ten_ma = r => r.ten || MKT?.ten?.[r.ma] || "";          // ds.json chưa có tên → tên từ Bảng thị trường
function goi_y_ma(q) {                        // CHỈ theo mã: "V" → VIC, VHM, VCB… (vốn hoá lớn trước – DS đã xếp)
  q = (q || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, ""); if (!q || !DS) return [];
  const ds = DS.filter(r => r.ma.startsWith(q)), dung = ds.findIndex(r => r.ma === q);
  if (dung > 0) ds.unshift(ds.splice(dung, 1)[0]);
  return ds.slice(0, 10);
}
function gan_tim(o, di) {
  const inp = o.querySelector("input"), ul = o.querySelector("ul");
  let kq = [], i = -1;
  const ve = () => { ul.innerHTML = kq.map((r, j) => `<li role="option" class="${j === i ? "chon" : ""}" data-ma="${esc(r.ma)}"><b>${esc(r.ma)}</b><span>${esc(ten_ma(r) || r.nganh || "")}</span><i>${esc(r.san || "")}</i></li>`).join("");
    o.classList.toggle("mo", kq.length > 0); };
  const dong = () => { kq = []; i = -1; ve(); };
  const goi = () => { o.classList.toggle("co", !!inp.value); kq = goi_y_ma(inp.value); i = kq.length ? 0 : -1; ve(); };
  const chon = m => { dong(); inp.blur(); location.hash = m; };
  inp.addEventListener("input", goi);
  inp.addEventListener("focus", () => { inp.select(); if (inp.value && !MA_OK(inp.value.trim().toUpperCase())) goi(); });
  inp.addEventListener("blur", () => setTimeout(dong, 120));
  inp.addEventListener("keydown", e => {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && kq.length) { e.preventDefault(); i = (i + (e.key === "ArrowDown" ? 1 : -1) + kq.length) % kq.length; ve(); }
    else if (e.key === "Escape") { dong(); inp.blur(); }
    else if (e.key === "Enter") { e.preventDefault(); const m = i >= 0 && kq[i] ? kq[i].ma : inp.value.trim().toUpperCase(); if (MA_OK(m)) chon(m); }
  });
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); chon(li.dataset.ma); } });
  o.querySelector(".xoa").addEventListener("click", () => { inp.value = ""; o.classList.remove("co"); dong(); inp.focus(); });
  return inp;
}
gan_tim($("#tim-dau"));
let MA_TRUOC = "";
addEventListener("hashchange", () => { const m = location.hash.split("/")[0]; dinh_tuyen(); if (m !== MA_TRUOC) scrollTo(0, 0); MA_TRUOC = m; });

(async () => {
  try {
    const [d] = await Promise.all([lay(DL + "ds.json"), tai_thi_truong()]);
    DS = d.ds || []; META = d;
  } catch (e) {
    $("#noi-dung").innerHTML = `<div class="the"><div class="trong">Chưa có dữ liệu tra cứu (workflow "Du lieu tra cuu" chưa chạy xong). Thử lại sau ít phút.</div></div>`;
    return;
  }
  MA_TRUOC = location.hash.split("/")[0];
  dinh_tuyen();
  setInterval(async () => {                                  // giá trong phiên: tải lại 1 phút / lần khi đang xem
    if (document.hidden || !MKT?.dang_gd) return;
    await tai_thi_truong();
    const [a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
    if (MA_OK((a || "").toUpperCase()) && (!b || ["tong-quan", "dinh-gia"].includes(b))) dinh_tuyen();
  }, 60000);
})();
</script>
