<title>Tra cứu mã</title>
<meta name="description" content="Tra cứu cổ phiếu HOSE / HNX: biểu đồ nến, báo cáo tài chính đầy đủ, định giá, cổ đông, cổ tức, lịch sử giá, tin & báo cáo CTCK, hồ sơ, phân tích hệ thống.">
<style>
:root{
  --nen:#f4f8f5;--the:#fff;--vien:#d9e7dc;--luoi:#ebf2ed;--nhat:#f6faf7;
  --chu:#1d2430;--chu2:#4b5565;--mo:#7a8494;
  --tang:#0f8a4a;--giam:#d1342b;--dung:#b88a00;--tran:#9b3fd1;--san:#0e9fb3;
  --tang-nen:#e3f4ea;--giam-nen:#fde8e6;--dung-nen:#fbf3d6;
  --nhan:#2E7D32;--nhan-nen:#E8F5E9;--nhan-dam:#1B5E20;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nen);color:var(--chu);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--nhan);text-decoration:none}a:hover{text-decoration:underline}
.so,td,.v{font-variant-numeric:tabular-nums}
.t{color:var(--tang)}.g{color:var(--giam)}.d{color:var(--dung)}.m{color:var(--mo)}.tr{color:var(--tran)}.sa{color:var(--san)}
button{font:inherit;color:inherit;cursor:pointer}
/* tông XANH LÁ + TRẮNG – cùng bảng màu trang Tổng hợp (1B5E20 · 2E7D32 · 43A047 · 66BB6A · C8E6C9 · E8F5E9) */
header.dau{background:linear-gradient(135deg,#43A047,var(--nhan-dam));color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(27,94,32,.25)}
header.dau h1 a{color:#fff;text-shadow:0 1px 2px rgba(0,60,20,.35)}
header.dau .lien a{color:#f0fff4;opacity:.92}header.dau .lien a:hover{opacity:1;text-decoration:none}
header.dau .gg input{border-color:transparent;color:var(--chu)}header.dau .gg ul{color:var(--chu)}
.dau-trong{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dau-trong h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap}
.dau-trong h1 a{color:inherit}
/* ô tìm kiểu Google: bo tròn, bóng khi rê / gõ, gợi ý thả xuống (mã · tên · sàn), ↑↓ Enter Esc */
.gg{position:relative;flex:1 1 300px;max-width:560px}
.gg input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;height:40px;border:1px solid #dfe1e5;border-radius:20px;
  padding:0 40px 0 18px;background:#fff;color:inherit;outline:0;transition:box-shadow .15s;text-transform:uppercase;letter-spacing:.3px}
.gg input::placeholder{text-transform:none;letter-spacing:0}
.gg input:hover,.gg input:focus,.gg.mo input{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.gg.mo input{border-radius:20px 20px 0 0}
.gg .xoa{position:absolute;right:8px;top:0;height:40px;width:32px;border:0;background:none;font-size:22px;line-height:1;color:#70757a;display:none}
.gg.co .xoa{display:block}
.gg ul{display:none;position:absolute;left:0;right:0;top:100%;margin:0;padding:4px 0 10px;list-style:none;background:#fff;
  border-radius:0 0 20px 20px;box-shadow:0 4px 6px rgba(32,33,36,.28);z-index:60;border-top:1px solid #e8eaed}
.gg.mo ul{display:block}
.gg li{padding:7px 18px;display:flex;gap:12px;align-items:baseline;cursor:pointer;white-space:nowrap}
.gg li.chon,.gg li:hover{background:#f1f3f4}
.gg li b{min-width:46px;font-weight:650;text-align:left}
.gg li span{color:var(--mo);font-size:13.5px;overflow:hidden;text-overflow:ellipsis}
.gg li i{margin-left:auto;font-style:normal;color:var(--mo);font-size:12px}
.gg-lon{max-width:620px;margin:0 auto}
.gg-lon input{height:50px;font-size:17px;border-radius:25px;padding:0 46px 0 24px}
.gg-lon .xoa{height:50px;right:12px}
.gg-lon.mo input{border-radius:25px 25px 0 0}.gg-lon ul{border-radius:0 0 25px 25px}.gg-lon li{padding:8px 24px}
.dau-chinh{text-align:center;padding:42px 0 30px}
.dau-chinh h2{font-size:30px;font-weight:650;margin:0 0 22px;letter-spacing:-.3px;color:var(--nhan-dam)}
.dau-chinh p{color:var(--mo);font-size:13px;margin:14px 0 0}
body.o-dau .dau-trong .gg{display:none}
.lien{margin-left:auto;display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
main{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;margin-bottom:14px}
.khoi-dau{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--luoi);flex-wrap:wrap}
.khoi-dau h2{font-size:15px;margin:0;font-weight:650}
.khoi-dau .phu{color:var(--mo);font-size:12.5px}
.khoi-dau .nut{margin-left:auto}
.than{padding:12px 14px}
.trong{padding:14px;color:var(--mo)}
.nut{display:inline-flex;gap:2px;background:var(--nen);border-radius:8px;padding:2px;flex-wrap:wrap}
.nut button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--chu2);white-space:nowrap}
.nut button[aria-pressed=true]{background:var(--the);color:var(--chu);font-weight:600;box-shadow:0 1px 2px #0001}
/* đầu mã */
.ma-dau{position:sticky;top:53px;z-index:20;background:var(--the);border:1px solid var(--vien);border-radius:12px;margin-bottom:12px}
.ma-tren{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 14px 8px}
.ma-ten{flex:1 1 280px;min-width:0}
.ma-ten h2{margin:0;font-size:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ma-ten .ten-dd{color:var(--chu2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nhan-san{font-size:11px;font-weight:600;color:var(--mo);border:1px solid var(--vien);border-radius:4px;padding:0 5px}
.ma-gia{text-align:right}
.ma-gia .lon{font-size:28px;font-weight:700;line-height:1.1}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px;margin-left:6px}
.pill.t{background:var(--tang-nen)}.pill.g{background:var(--giam-nen)}.pill.d{background:var(--dung-nen)}
.ma-gia .nho{color:var(--mo);font-size:12px;margin-top:2px}
.huy{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;margin:4px 6px 0 0;white-space:nowrap}
a.huy:hover{text-decoration:none;box-shadow:inset 0 0 0 1px currentColor}
.huy.re{background:var(--tang-nen);color:var(--tang)}.huy.dat{background:var(--giam-nen);color:var(--giam)}
.huy.hl{background:var(--luoi);color:var(--chu2)}.huy.bot{background:var(--nhan-nen);color:var(--nhan)}
.huy.giu{background:var(--dung-nen);color:#6b5200}
.tab{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 8px;border-top:1px solid var(--luoi)}
.tab::-webkit-scrollbar{display:none}
.tab a{padding:9px 10px;color:var(--chu2);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;text-decoration:none}
.tab a[aria-current=page]{color:var(--nhan);border-bottom-color:var(--nhan);font-weight:650}
@media (max-width:600px){.dau-trong .gg{flex:1 1 100%;order:3}.dau-chinh{padding:22px 0 18px}.dau-chinh h2{font-size:24px}.ma-dau{top:auto;position:relative}.ma-gia{text-align:left}.ma-gia .lon{font-size:24px}.an-dt{display:none}
  .lien{margin-left:0}}
/* lưới số */
.luoi-so{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.luoi-so>div{padding:9px 14px;box-shadow:inset -1px -1px 0 var(--luoi)}
.luoi-so .n{color:var(--mo);font-size:12px}
.luoi-so .v{font-size:16px;font-weight:650}
.luoi-so .c{color:var(--mo);font-size:11.5px}
.hai{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.hai,.ba{grid-template-columns:minmax(0,1fr)}}
.bieu{position:relative}
.bieu svg{display:block;width:100%;height:auto}
.hieu-suat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--luoi)}
.hieu-suat div{padding:8px 6px;text-align:center;box-shadow:inset -1px 0 0 var(--luoi)}
.hieu-suat .n{color:var(--mo);font-size:12px}.hieu-suat b{font-size:14px}
@media (max-width:600px){.hieu-suat{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* nến */
.nen-khung{position:relative;padding:4px 8px 6px}
.nen-khung canvas{display:block;width:100%;height:360px;touch-action:pan-y}
@media (max-width:600px){.nen-khung canvas{height:300px}}
.nen-dk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px 0}
.bd-cong{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;padding:0 14px 6px;font-size:12.5px}
.bd-cong .goi{color:var(--phu);margin-right:auto}
/* cột công cụ phải (nút sao: watchlist) + bảng watchlist */
body{padding-right:44px}
.rail{position:fixed;right:0;top:var(--dau,56px);bottom:0;width:44px;background:var(--the);border-left:1px solid var(--vien);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:6px;z-index:25}
.rail button{width:34px;height:34px;border-radius:8px;border:0;background:none;line-height:0;color:#9aa3af;cursor:pointer;display:grid;place-items:center}
.rail button:hover{background:var(--nhat)}.rail button[aria-pressed="true"]{background:var(--nhat);color:#e8a400}
.ds-td{position:fixed;right:44px;top:var(--dau,56px);bottom:0;width:300px;background:var(--the);border-left:1px solid var(--vien);box-shadow:-6px 0 18px rgba(0,0,0,.07);z-index:24;display:flex;flex-direction:column}
.ds-td[hidden]{display:none}
body.co-ds main{margin-right:300px}
.dt-dau{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--luoi)}
.dt-dau b{font-size:15px;margin-right:auto}.dt-dau button{border:0;background:none;font-size:18px;cursor:pointer;color:var(--phu)}
.dt-chon{display:flex;gap:4px;padding:8px 12px 4px;flex-wrap:wrap}
.dt-chon button{border:1px solid var(--vien);background:var(--the);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer}
.dt-chon button[aria-pressed="true"]{background:var(--nhan-dam);border-color:var(--nhan-dam);color:#fff}
.dt-them{display:flex;gap:6px;padding:6px 12px}.dt-them input{flex:1;min-width:0;font:inherit;padding:5px 8px;border:1px solid var(--vien);border-radius:6px}
.dt-them button{border:1px solid var(--nhan-dam);background:var(--the);color:var(--nhan-dam);border-radius:6px;padding:4px 10px;cursor:pointer}
.dt-ds{flex:1;overflow:auto}
.dt-r{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--luoi);cursor:pointer;color:var(--chu)}
.dt-r:hover,.dt-r.dang{background:#f3f7f3}
.dt-r .t{flex:1;min-width:0}.dt-r .t b{display:block;font-size:14.5px}.dt-r .t span{display:block;color:var(--phu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-r .p{text-align:right;font-size:12.5px}.dt-r .p b{display:block;font-size:14.5px;color:var(--chu)}
.dt-r .p .nn{display:block;color:var(--mo);font-size:11.5px}.dt-nhan{font-style:normal;font-weight:600;font-size:10.5px;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.dt-nhan.giu{background:#e3f2e5;color:#1b5e20}.dt-nhan.sk{background:#fdecc8;color:#8a4b00}.dt-nhan.td{background:#fff4d6;color:#8a6100}.dt-nhan.bot{background:#e3ecff;color:#1f4fa8}.dt-tom{padding:2px 12px 6px;font-size:12.5px;color:var(--phu)}
.dt-r .x{border:0;background:none;color:#b0b7c2;cursor:pointer;font-size:14px;padding:2px}.dt-r .x:hover{color:#d1342b}
.dt-trong{padding:14px 12px;color:var(--phu);font-size:13px}
@media (max-width:700px){body{padding-right:0}.rail{top:auto;bottom:14px;right:12px;width:auto;height:auto;padding:4px;border:1px solid var(--vien);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .ds-td{right:0;left:0;width:auto;top:auto;height:70vh;border-radius:14px 14px 0 0}body.co-ds main{margin-right:0}}
/* chế độ toàn màn hình kiểu bảng biểu đồ */
.fs{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column}
.fs-tren{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--vien);font-size:13px}
.fs-tren .o{font:inherit;font-weight:700;width:86px;min-width:6ch;field-sizing:content;max-width:13ch;padding:5px 8px;border:1px solid var(--vien);border-radius:6px;text-transform:uppercase}
.fs-tren .ten{color:var(--phu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.fs-tren .thoat{margin-left:auto;border:1px solid var(--vien);background:var(--the);border-radius:6px;padding:5px 10px;cursor:pointer}
.fs-cb{position:relative}.fs-cb>button{border:1px solid var(--vien);background:var(--the);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
.fs-cb-ds{position:absolute;top:calc(100% + 4px);left:0;z-index:5;background:#fff;border:1px solid var(--vien);border-radius:8px;padding:8px 12px;display:grid;gap:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.fs-cb-ds[hidden]{display:none}
.fs-cb-ds{grid-template-columns:minmax(250px,auto) minmax(220px,auto) minmax(230px,auto);gap:4px 18px;max-height:min(70vh,560px);overflow:auto;font-size:13px}
.cb-nhom{display:grid;gap:4px;align-content:start}.cb-nhom>b{font-size:12px;color:var(--mo);text-transform:uppercase;letter-spacing:.03em;margin:2px 0}
.cb-dong{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.cb-chip{flex-wrap:nowrap}.cb-dong label{white-space:nowrap}.cb-dong label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.cb-chip>span{min-width:34px;color:var(--chu2)}.cb-chip label{gap:3px}.cb-g{border:0;background:none;cursor:pointer;padding:0 4px;color:var(--mo);font-size:14px}
.cb-ts{display:flex;gap:4px;padding:0 0 4px 24px}.cb-ts[hidden]{display:none}.cb-ts input{width:62px;font:inherit;padding:2px 4px;border:1px solid var(--vien);border-radius:6px}
.cb-ghi{font-size:11.5px;color:var(--mo);max-width:240px}.cb-cuoi{grid-column:1/-1;text-align:right}.cb-cuoi button{border:1px solid var(--vien);background:var(--the);border-radius:6px;padding:3px 10px;cursor:pointer;font:inherit}
.chu-pane{position:absolute;left:8px;z-index:3;font-size:11.5px;line-height:1.3;background:#ffffffd9;border-radius:5px;padding:1px 6px;pointer-events:none}
.fs-cb-ds{z-index:40}
.fs-cb-ds.lp-ds{grid-template-columns:minmax(270px,auto);gap:6px}.fs-lp>button{font-weight:700;letter-spacing:1px;padding:5px 9px}
.lp-ds .nut{flex-wrap:wrap}.lp-ds .cb-ghi{max-width:290px}.lp-ds .cb-nhom+.cb-nhom{border-top:1px solid var(--vien);padding-top:6px}
@media (max-width:760px){.fs-cb-ds{grid-template-columns:1fr;position:fixed;left:8px;right:8px;top:calc(var(--dau, 56px) + 8px);max-height:calc(100vh - var(--dau, 56px) - 16px);min-width:0;z-index:150}.fs .fs-cb-ds{top:52px;max-height:calc(100vh - 60px)}}
@media (max-width:600px){.chu-non{display:none}}
.fs-than{flex:1;display:flex;min-height:0}
.fs-trai{width:44px;border-right:1px solid var(--vien);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.fs-trai button{width:34px;height:34px;border:0;border-radius:8px;background:none;font-size:16px;cursor:pointer;color:#374151}
.fs-trai button:hover{background:var(--nhat)}.fs-trai button[aria-pressed="true"]{background:#e3f2e5;color:var(--nhan-dam)}
.fs-trai hr{width:24px;border:0;border-top:1px solid var(--vien);margin:4px 0}
.fs.trang{top:var(--dau,56px);z-index:25}.fs:fullscreen{top:0}
.fs.phu-kin{top:0;z-index:300}body.co-phu-kin{overflow:hidden}   /* toàn màn hình khi trình duyệt không cho (Safari iPhone) */
@media (max-height:520px){.fs.phu-kin .fs-tren .ten{display:none}.fs.phu-kin .fs-tren{padding:3px 8px}.fs.phu-kin .fs-day{padding:2px 8px}}
.fs-trai{overflow-y:auto;padding-bottom:8px}.ve-nhom{position:relative;display:flex;align-items:center}
.fs-trai .ve-mo{position:absolute;right:-6px;width:10px;height:22px;padding:0;font-size:12px;color:var(--mo);border-radius:4px}
.fs-trai .ve-mo:hover{background:var(--nhat);color:var(--chu)}
.ve-ds,.ve-tim{position:fixed;z-index:300;background:#fff;border:1px solid var(--vien);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:6px;min-width:270px;max-height:80vh;overflow:auto;font-size:13.5px}
.ve-ds .dau,.ve-tim .dau{font-size:11.5px;font-weight:650;color:var(--mo);letter-spacing:.04em;padding:8px 10px 4px}
.ve-ds button,.ve-tim .kq button{display:flex;justify-content:space-between;gap:18px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;font:inherit;text-align:left;color:var(--chu)}
.ve-ds button:hover,.ve-tim .kq button:hover,.ve-ds button[aria-pressed="true"]{background:#eef3ff}.ve-ds i,.ve-tim i{font-style:normal;color:var(--mo);font-size:12px}
.ve-tim{left:50%;top:12vh;transform:translateX(-50%);width:min(440px,92vw)}
.ve-dsnet .net-r{display:flex;align-items:center;gap:2px;border-radius:6px}.ve-dsnet .net-r.chon{background:#eef3ff}.ve-dsnet .net-r.an [data-nchon]{opacity:.45}
.ve-dsnet .net-r button{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--chu);font:inherit}.ve-dsnet .net-r button:hover{background:#eef3ff}
.ve-dsnet [data-nchon]{flex:1;display:flex;justify-content:space-between;gap:12px;text-align:left}.ve-dsnet .net-r [aria-pressed="false"]{color:var(--mo)}
.ve-dsnet .net-r [data-nkhoa][aria-pressed="true"]{color:#2962ff}.ve-dsnet .trong{padding:10px;color:var(--mo)}
/* ĐIỆN THOẠI: chạm 2 lần nhanh (đặt điểm vẽ) / bấm ô nhập chữ nhỏ làm Safari PHÓNG TO cả trang (thanh công cụ bị cắt) →
   tắt phóng to khi chạm đúp, ô nhập ≥ 16px (Safari chỉ tự phóng ô < 16px), vùng biểu đồ toàn màn hình nhận mọi cử chỉ */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
.fs .fs-bd{touch-action:none}

function canslim_dong(r) {                     // C · A · N · S · L (+ M thị trường) – thi_truong/canslim_web.py

function chuoi_pe(k, ma) {                     // P/E, P/B theo ngày = giá điều chỉnh ÷ EPS / BVPS (theo giá điều chỉnh) của quý gần nhất
  const x = chuoi_gia(k, ma), cs = k.n?.cs, l4 = k.r?.ln4q;
  if (!x || !cs?.ky?.length) return null;
  const cuoi_q = (y, q) => new Date(Date.UTC(y, q * 3, 0)).toISOString().slice(0, 10);
  const gia_tai = d => { let lo = 0, hi = x.d.length - 1, r = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (x.d[m] <= d) { r = m; lo = m + 1; } else hi = m - 1; } return r >= 0 ? x.c[r] : null; };
  const eps = new Map(), bv = new Map();       // ngày cuối quý → EPS / BVPS quy theo giá điều chỉnh (≤ 0 = lỗ / âm vốn)
  cs.ky.forEach((t, i) => { const m = /^Q(\d)\.(\d\d)$/.exec(t); if (!m) return; const d = cuoi_q(2000 + +m[2], +m[1]), g = gia_tai(d); if (!g) return;
    const pe = cs.pe?.[i], pb = cs.pb?.[i];
    if (pe != null) eps.set(d, pe > 0 ? g / pe : -1);
    if (pb != null) bv.set(d, pb > 0 ? g / pb : -1); });
  const vc = [...eps.keys()].sort()[0];
  let uoc = false;
  if (vc && l4?.ky?.length) {                  // trước quý Vietcap đầu tiên: LNST 4 quý × hệ số khớp ở quý đó
    const ln = new Map(l4.ky.map((t, i) => [cuoi_q(+t.slice(0, 4), +t.slice(-1)), l4.v[i]])), e0 = eps.get(vc), n0 = ln.get(vc);
    if (e0 > 0 && n0 > 0) for (const [d, v] of ln) if (d < vc) { eps.set(d, v > 0 ? v * e0 / n0 : -1); uoc = true; }
  }
  if (!eps.size) return null;
  const moc = (M) => { const ds = [...M.keys()].sort(); return d => { let r = null; for (const a of ds) { if (a <= d) r = M.get(a); else break; } return r; }; };
  const e = moc(eps), b = moc(bv), d0 = [...eps.keys()].sort()[0];
  const out = {d: [], pe: [], pb: [], vc, uoc};
  x.d.forEach((d, i) => { if (d < d0) return; const a = e(d), c = b(d);
    out.d.push(d); out.pe.push(a > 0 && x.c[i] / a < 200 ? x.c[i] / a : null); out.pb.push(c > 0 && x.c[i] / c < 50 ? x.c[i] / c : null); });
  return out.pe.some(v => v != null) ? out : null;
}

  if (h === "LUOI") { dat(""); return hien_luoi(); }
  if (MA_OK(h)) { dat(h); return hien_ma(h, TAB.some(t => t[0] === b) ? b : "tong-quan"); }
  dat(""); return hien_dau();
}
// ---------------------------------------------------------------- ô tìm kiểu Google (gợi ý theo mã rồi theo tên, bỏ dấu)
const BO_DAU = s => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toUpperCase();
const ten_ma = r => r.ten || MKT?.ten?.[r.ma] || "";          // ds.json chưa có tên → tên từ Bảng thị trường
function goi_y_ma(q) {                        // CHỈ theo mã: "V" → VIC, VHM, VCB… (vốn hoá lớn trước – DS đã xếp)
  q = (q || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, ""); if (!q || !DS) return [];
  const ds = DS.filter(r => r.ma.startsWith(q)), dung = ds.findIndex(r => r.ma === q);
  if (dung > 0) ds.unshift(ds.splice(dung, 1)[0]);
  const cs = Object.keys(CHI_SO_TEN).filter(m => m.startsWith(q) && (!CS_CO || CS_CO[m])).map(m => ({ma: m, ten: CHI_SO_TEN[m], san: "Chỉ số"}));
  return (CHI_SO_TEN[q] ? [...cs, ...ds] : [...ds.slice(0, 6), ...cs, ...ds.slice(6)]).slice(0, 10);   // chỉ số chen sau 6 mã đầu
}
function gan_tim(o, di) {
  const inp = o.querySelector("input"), ul = o.querySelector("ul");
  let kq = [], i = -1;
  const ve = () => { ul.innerHTML = kq.map((r, j) => `<li role="option" class="${j === i ? "chon" : ""}" data-ma="${esc(r.ma)}"><b>${esc(r.ma)}</b><span>${esc(ten_ma(r) || r.nganh || "")}</span><i>${esc(r.san || "")}</i></li>`).join("");
    o.classList.toggle("mo", kq.length > 0); };
  const dong = () => { kq = []; i = -1; ve(); };
  const goi = () => { o.classList.toggle("co", !!inp.value); kq = goi_y_ma(inp.value); i = kq.length ? 0 : -1; ve(); };
  const chon = m => { dong(); inp.blur(); location.hash = m; };
  inp.addEventListener("input", goi);
  inp.addEventListener("focus", () => { inp.select(); if (inp.value && !MA_OK(inp.value.trim().toUpperCase())) goi(); });
  inp.addEventListener("blur", () => setTimeout(dong, 120));
  inp.addEventListener("keydown", e => {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && kq.length) { e.preventDefault(); i = (i + (e.key === "ArrowDown" ? 1 : -1) + kq.length) % kq.length; ve(); }
    else if (e.key === "Escape") { dong(); inp.blur(); }
    else if (e.key === "Enter") { e.preventDefault(); const m = i >= 0 && kq[i] ? kq[i].ma : inp.value.trim().toUpperCase(); if (MA_OK(m)) chon(m); }
  });
  ul.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); chon(li.dataset.ma); } });
  o.querySelector(".xoa").addEventListener("click", () => { inp.value = ""; o.classList.remove("co"); dong(); inp.focus(); });
  return inp;
}
gan_tim($("#tim-dau"));
document.addEventListener("click", e => { const n = e.target.closest("[data-loc-nganh]"); if (n) { LOC.nganh = n.dataset.locNganh; LOC.tim = ""; } });
document.addEventListener("click", e => { const b = e.target.closest("[data-td]"); if (!b) return;
  doi_td(b.dataset.td); const co = TD.has(b.dataset.td); b.setAttribute("aria-pressed", co); b.textContent = co ? "✓ Đang theo dõi" : "+ Theo dõi"; ds_td_ve(); });
let MA_TRUOC = "";
addEventListener("hashchange", () => {
  if (FS && !FS.trang) return;
  if (FS?.trang) { if (/^#bieu-do/i.test(location.hash)) return; fs_dong(true); } const m = location.hash.split("/")[0]; dinh_tuyen(); ds_td_ve(); if (m !== MA_TRUOC) scrollTo(0, 0); MA_TRUOC = m; });

(async () => {
  try {
    const [d] = await Promise.all([lay(DL + "ds.json"), tai_thi_truong()]);
    DS = d.ds || []; META = d;
  } catch (e) {
    $("#noi-dung").innerHTML = `<div class="the"><div class="trong">Chưa có dữ liệu tra cứu (workflow "Du lieu tra cuu" chưa chạy xong). Thử lại sau ít phút.</div></div>`;
    return;
  }
  MA_TRUOC = location.hash.split("/")[0];
  dinh_tuyen();
  dat_dau(); ds_td_ve();
  setInterval(async () => {                                  // giá trong phiên: tải lại 30 giây / lần khi đang xem
    if (document.hidden || (!MKT?.dang_gd && !trong_gio_gd())) return;
    await tai_thi_truong();
    ds_td_ve();
    if (FS) return fs_ve(true);                          // toàn màn hình: vẽ lại nến hôm nay, giữ vùng đang xem
    const [a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
    if (MA_OK((a || "").toUpperCase()) && (!b || ["tong-quan", "dinh-gia"].includes(b))) dinh_tuyen();
  }, 30000);                                                 // dữ liệu trong phiên ~30 giây / lượt (vòng bảng thị trường)
})();
// ---------------------------------------------------------------- TỰ CẬP NHẬT BẢN MỚI (ứng dụng ở màn hình chính iPhone giữ trang chạy nền;
// GitHub Pages cho trình duyệt giữ trang 10 phút): quay lại trang / 3 giây sau khi mở → hỏi bản đang triển khai (mã BAN do bước
// "Gói trang" của workflow Bang thi truong ghi = băm code trang); khác bản đang chạy → tải lại đúng bản mới.
async function kiem_ban_moi() {
  if (!/^[0-9a-f]{10}$/.test(BAN)) return;                       // chạy cục bộ / chưa qua bước triển khai
  try {
    const t = await (await fetch(location.pathname + "?ban=" + Date.now(), {cache: "no-store"})).text();
    const m = t.match(/const BAN = "([0-9a-f]{10})"/);
    if (!m || m[1] === BAN) return;
    try { if (sessionStorage.getItem("ban_da_tai") === m[1]) return; sessionStorage.setItem("ban_da_tai", m[1]); } catch (e) {}
    location.replace(location.pathname + "?v=" + m[1] + (NHUNG ? "&nhung=1" : "") + location.hash);
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") kiem_ban_moi(); });
setTimeout(kiem_ban_moi, 3000);
// ---------------------------------------------------------------- MẤT MẠNG: sw.js lưu bản tải gần nhất (trang + dữ liệu) → vẫn xem được, kèm dòng báo
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
function bao_mang() {
  let b = $("#bao-mang");
  if (navigator.onLine) { b?.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "bao-mang"; b.className = "bao-mang"; b.setAttribute("role", "status"); document.body.appendChild(b); }
  b.textContent = `Mất mạng – đang xem dữ liệu đã lưu lần tải trước${MKT?.cap_nhat ? ` (thị trường ${MKT.cap_nhat})` : ""}`;
}
addEventListener("online", bao_mang); addEventListener("offline", bao_mang); bao_mang();
