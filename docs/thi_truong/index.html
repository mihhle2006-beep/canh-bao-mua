<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng thị trường</title>
<meta name="description" content="Tổng quan thị trường chứng khoán Việt Nam trong phiên: chỉ số, bản đồ nhiệt HOSE, thống kê phiên, tác động VN-Index, lọc mã.">
<style>
:root{
  --nen:#f3f5f8;--the:#fff;--vien:#e3e7ee;--luoi:#edf0f4;
  --chu:#1d2430;--chu2:#4b5565;--mo:#7a8494;
  --tang:#0f8a4a;--giam:#d1342b;--dung:#b88a00;--tran:#9b3fd1;--san:#0e9fb3;
  --tang-nen:#e3f4ea;--giam-nen:#fde8e6;--dung-nen:#fbf3d6;
  --nhan:#1f6feb;--nhan-nen:#e8f0fe;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nen);color:var(--chu);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.so{font-variant-numeric:tabular-nums}
.t{color:var(--tang)}.g{color:var(--giam)}.d{color:var(--dung)}.tr{color:var(--tran)}.sa{color:var(--san)}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--the);border-bottom:1px solid var(--vien);position:sticky;top:0;z-index:20}
.dau{max-width:1440px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:52px;flex-wrap:wrap}
.dau h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap}
.tab{display:flex;gap:2px;align-self:stretch}
.tab button{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px;font-weight:500;color:var(--chu2)}
.tab button[aria-selected=true]{color:var(--chu);border-bottom-color:var(--nhan)}
.tt-phien{margin-left:auto;color:var(--mo);font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cham{width:8px;height:8px;border-radius:50%;background:var(--mo);display:inline-block}
.cham.song{background:var(--tang);box-shadow:0 0 0 3px #0f8a4a22}
.tt-phien a{color:var(--nhan);text-decoration:none}
main{max-width:1440px;margin:0 auto;padding:16px}
.the{background:var(--the);border:1px solid var(--vien);border-radius:10px}
.cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.cs .the{padding:10px 12px;display:grid;grid-template-columns:1fr 92px;gap:2px 8px;text-align:left;
  border-width:1px;cursor:pointer}
.cs .the[aria-pressed=true]{border-color:var(--nhan);background:var(--nhan-nen)}
.cs .ten{font-weight:600;color:var(--chu2);font-size:13px}
.cs .gia{font-size:19px;font-weight:650}
.cs .tdoi{font-size:12.5px;font-weight:550}
.cs svg{grid-row:1/4;grid-column:2;align-self:center}
.cs .phu{grid-column:1/3;font-size:11.5px;color:var(--mo);text-align:right;margin-top:-2px}
@media (max-width:600px){
  .cs{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .cs .the{grid-template-columns:minmax(0,1fr);padding:8px 10px}
  .cs svg{grid-row:auto;grid-column:1;width:100%;height:30px}
  .cs .phu{grid-column:1;text-align:left;margin-top:0}
  .cs .gia{font-size:17px}
  .an-dt{display:none}
  .tt-phien{margin-left:0;width:100%;padding-bottom:6px}
}
.luoi2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;margin-bottom:16px}
.luoi3{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:16px}
@media (max-width:1000px){.luoi2,.luoi3{grid-template-columns:minmax(0,1fr)}}
.khoi-dau{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--luoi);flex-wrap:wrap}
.khoi-dau h2{font-size:15px;margin:0;font-weight:650}
.khoi-dau .phu{color:var(--mo);font-size:12.5px}
.nut{display:flex;gap:2px;background:var(--nen);border-radius:8px;padding:2px;margin-left:auto}
.nut button{border:0;background:none;padding:3px 9px;border-radius:6px;font-size:12.5px;color:var(--chu2);white-space:nowrap}
#loc-san{overflow-x:auto;max-width:100%}
#loc-nhom{display:none;font:inherit;border:1px solid var(--vien);border-radius:8px;padding:6px 10px;background:var(--the);width:100%}
.nut button[aria-pressed=true]{background:var(--the);color:var(--chu);font-weight:600;box-shadow:0 1px 2px #0001}
.bieu{position:relative;padding:6px 8px 4px}
.bieu svg{display:block;width:100%}
.goi-y{position:fixed;pointer-events:none;background:#1d2430;color:#fff;font-size:12px;line-height:1.4;
  padding:6px 9px;border-radius:6px;z-index:50;display:none;max-width:260px;box-shadow:0 4px 14px #0003}
.goi-y b{font-weight:650}
.chu-giai{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--mo);padding:6px 14px 12px}
.chu-giai i{display:inline-block;width:20px;height:9px;border-radius:2px}
.tk{padding:4px 16px 8px}
.tk .muc{padding:12px 0;border-bottom:1px solid var(--luoi)}
.tk .muc:last-child{border-bottom:0}
.tk .hang{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk .nhan{color:var(--chu2);font-weight:550}
.tk .lon{font-size:19px;font-weight:650;margin-left:auto}
.tk .nho{color:var(--mo);font-size:12px}
.thanh{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px;margin:8px 0 6px;background:var(--the)}
.thanh>span{display:block;height:100%}
.tien-do{position:relative;height:9px;background:var(--luoi);border-radius:5px;margin:8px 0 6px}
.tien-do span{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.tien-do .vach{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--chu)}
.nhan-xet{margin:0 0 4px;padding:8px 10px;border-radius:8px;background:var(--dung-nen);color:#6b5200;font-size:12.5px}
.nhan-xet:empty{display:none}
/* lọc mã */
.loc-dau{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.loc-dau select,.loc-dau input{font:inherit;border:1px solid var(--vien);border-radius:8px;padding:6px 10px;background:var(--the);color:var(--chu)}
.loc-dau input{min-width:200px;flex:0 1 260px}
.bat{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--vien);border-radius:8px;padding:6px 10px;background:var(--the)}
.bat[aria-pressed=true]{background:var(--nhan-nen);border-color:var(--nhan);color:var(--nhan);font-weight:600}
.loc-dau .dem{margin-left:auto;color:var(--mo);font-size:12.5px}
.loc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.loc{grid-template-columns:minmax(0,1fr)}}
.ben{padding:8px 0}
.ben h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mo);margin:12px 14px 4px;font-weight:650}
.ben button{display:flex;width:calc(100% - 12px);margin:0 6px;justify-content:space-between;border:0;background:none;
  padding:6px 8px;border-radius:7px;text-align:left;color:var(--chu)}
.ben button span{color:var(--mo);font-size:12.5px}
.ben button[aria-pressed=true]{background:var(--nhan-nen);color:var(--nhan);font-weight:600}
.ben button[aria-pressed=true] span{color:var(--nhan)}
@media (max-width:860px){.ben{display:none}#loc-nhom{display:block}}
@media (max-width:600px){.cot-nganh{display:none}.loc-dau input{flex:1 1 100%}}
.bang-boc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{position:sticky;top:0;background:var(--the);color:var(--mo);font-weight:600;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.03em;text-align:right;padding:8px 10px;border-bottom:1px solid var(--vien);white-space:nowrap;cursor:pointer;user-select:none}
thead th:first-child,thead th.trai{text-align:left}
thead th[aria-sort]::after{content:" ▾";color:var(--nhan)}
thead th[aria-sort=ascending]::after{content:" ▴"}
tbody td{padding:7px 10px;border-bottom:1px solid var(--luoi);text-align:right;white-space:nowrap}
tbody td.trai{text-align:left}
tbody tr:hover{background:#f7f9fc}
td.ma{font-weight:650;position:sticky;left:0;background:inherit}
tbody tr{background:var(--the)}
.nhan-san{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;color:var(--mo);border:1px solid var(--vien);border-radius:4px;padding:0 4px}
.o-pt{display:inline-block;min-width:62px;padding:2px 6px;border-radius:5px;font-weight:600}
.bien{display:block;width:150px;height:14px}
.khung-bang-dau{padding:10px 14px;border-bottom:1px solid var(--luoi);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.khung-bang-dau b{font-size:14.5px}
.khung-bang-dau .phu{color:var(--mo);font-size:12.5px}
.khung-bang-dau .phai{margin-left:auto;color:var(--mo);font-size:12.5px}
.them{display:block;margin:10px auto 14px;border:1px solid var(--vien);background:var(--the);border-radius:8px;padding:6px 14px}
.trong{padding:30px;text-align:center;color:var(--mo)}
.loi{max-width:640px;margin:40px auto;padding:20px;text-align:center}
[hidden]{display:none!important}
.sao{border:0;background:none;padding:0 4px 0 0;font-size:14px;color:#c4cad4;line-height:1}
.sao[aria-pressed=true]{color:#e0a800}
.lk-ma{color:inherit;text-decoration:none}.lk-ma:hover{color:var(--nhan);text-decoration:underline}
.td-the{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;align-items:stretch}
.td-the button{flex:0 0 auto;border:1px solid var(--vien);background:var(--the);border-radius:8px;padding:6px 10px;text-align:left;min-width:96px}
.td-the b{display:block;font-size:13px}
.td-the .so{font-size:12.5px;font-weight:600}
.cong-cu{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--luoi)}
.cong-cu button{border:1px solid var(--vien);background:var(--the);border-radius:7px;padding:4px 10px;font-size:12.5px}
.bao{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:8px 14px;border-radius:8px;
  font-size:13px;z-index:60;box-shadow:0 4px 14px #0003}
</style>
</head>
<body>
<header>
  <div class="dau">
    <h1>Bảng thị trường</h1>
    <div class="tab" role="tablist">
      <button role="tab" id="tab-tq" aria-selected="true" data-tab="tq">Tổng quan</button>
      <button role="tab" id="tab-loc" aria-selected="false" data-tab="loc">Lọc mã</button>
    </div>
    <div class="tt-phien"><span class="cham" id="cham"></span><span id="trang-thai">Đang tải…</span>
      <a href="../ma/">🔎 Tra cứu mã</a><a href="../">Bảng tổng hợp</a></div>
  </div>
</header>
<main>
  <section id="tq">
    <div class="cs" id="cs"></div>
    <div class="the" id="td-khoi" hidden style="margin-bottom:16px">
      <div class="khoi-dau"><h2>💼 Danh mục & ★ theo dõi</h2><span class="phu so" id="td-tom"></span>
        <button class="bat" style="margin-left:auto;padding:3px 10px" id="td-mo">Xem bảng</button></div>
      <div class="td-the" id="td-ds"></div>
    </div>
    <div class="luoi2">
      <div class="the">
        <div class="khoi-dau"><h2 id="bd-ten">VN-Index</h2><span class="phu so" id="bd-phu"></span>
          <div class="nut" id="bd-khung"></div></div>
        <div class="bieu" id="bd"></div>
      </div>
      <div class="the">
        <div class="khoi-dau"><h2>Bản đồ nhiệt</h2><span class="phu">HOSE</span>
          <div class="nut" id="nd-kich">
            <button data-k="vh" aria-pressed="true">Vốn hóa</button><button data-k="gt" aria-pressed="false">GTGD</button>
            <button data-k="nn" aria-pressed="false">Nước ngoài</button><button data-k="td" aria-pressed="false">Tự doanh</button>
          </div></div>
        <div class="bieu" id="nd"></div>
        <div class="chu-giai" id="nd-giai"></div>
      </div>
    </div>
    <div class="luoi3">
      <div class="the">
        <div class="khoi-dau"><h2>Thống kê phiên</h2><span class="phu">HOSE</span></div>
        <div class="tk" id="tk"></div>
      </div>
      <div class="the">
        <div class="khoi-dau"><h2>Tác động</h2><span class="phu">VN-Index · 10 mã kéo / đè mạnh nhất</span>
          <span class="phu so" style="margin-left:auto" id="td-rong"></span></div>
        <div class="bieu" id="tac"></div>
      </div>
    </div>
  </section>
  <section id="loc" hidden>
    <div class="loc-dau">
      <div class="nut" id="loc-san" style="margin-left:0">
        <button data-s="" aria-pressed="true">Toàn thị trường</button><button data-s="HSX" aria-pressed="false">HSX</button>
        <button data-s="HNX" aria-pressed="false">HNX</button><button data-s="UPCOM" aria-pressed="false">UPCoM</button>
        <button data-s="VN30" aria-pressed="false">VN30</button><button data-s="HNX30" aria-pressed="false">HNX30</button>
      </div>
      <select id="loc-nganh" aria-label="Ngành"><option value="">Mọi ngành</option></select>
      <button class="bat" id="loc-tk" aria-pressed="true" title="GTGD trung bình 20 phiên ≥ 2 tỷ">Đủ thanh khoản</button>
      <input id="loc-tim" type="search" placeholder="Tìm mã hoặc tên…" autocomplete="off">
      <span class="dem so" id="loc-dem"></span>
      <select id="loc-nhom" aria-label="Nhóm lọc"></select>
    </div>
    <div class="loc">
      <nav class="the ben" id="ben" aria-label="Nhóm lọc"></nav>
      <div class="the">
        <div class="khung-bang-dau"><b id="loc-ten"></b><span class="phu" id="loc-mo-ta"></span><span class="phai so" id="loc-so"></span></div>
        <div class="cong-cu" id="td-cong-cu" hidden><button id="td-chep">Sao chép link danh sách (mở trên máy khác)</button>
          <button id="td-xoa">Bỏ hết ★ đánh dấu thêm</button></div>
        <div class="bang-boc"><table><thead id="loc-dau-bang"></thead><tbody id="loc-than"></tbody></table></div>
        <button class="them" id="loc-them" hidden>Xem thêm</button>
      </div>
    </div>
  </section>
</main>
<div class="goi-y" id="goi-y" role="tooltip"></div>
<script>
"use strict";
const URL_DL = "du_lieu.json";
const $ = s => document.querySelector(s);
const MAU = {tang: "#0f8a4a", giam: "#d1342b", dung: "#b88a00", luoi: "#edf0f4", truc: "#7a8494", chu: "#1d2430"};
let D = null, L = null;            // dữ liệu, dòng lọc (đối tượng)
const ST = Object.assign({tab: "tq", cs: "VNINDEX", khung: "1D", kich: "vh", san: "", nganh: "", du_tk: true, tim: "",
  nhom: "gt_lon", sap: null, chieu: -1, so_dong: 100}, doc_st());

function doc_st() { try { return JSON.parse(localStorage.getItem("bang_tt") || "{}"); } catch (e) { return {}; } }
// THEO DÕI: danh sách mã chỉ lưu trong trình duyệt này (localStorage) – trang công khai không chứa danh mục của ai.
// Nạp nhanh: mở trang với #theo_doi=AAA,BBB (link riêng) → lưu vào máy rồi xoá khỏi thanh địa chỉ.
// 05/11/2026: mã đang giữ (💼) lấy thẳng từ dữ liệu trang (D.danh_muc – tự cập nhật theo danh mục) → bỏ danh sách nạp
// bằng link cũ (chỉ là danh mục) 1 lần; TD còn lại = mã đánh dấu ★ thêm.
try { if (localStorage.getItem("bang_tt_td_v") !== "2") { localStorage.removeItem("bang_tt_theo_doi"); localStorage.setItem("bang_tt_td_v", "2"); } } catch (e) {}
let TD = (() => { try { return JSON.parse(localStorage.getItem("bang_tt_theo_doi") || "[]"); } catch (e) { return []; } })();
let GIU = [];
const TDX = () => [...new Set([...GIU, ...TD])];          // 💼 đang giữ trước, rồi ★ đánh dấu thêm
const luu_td = () => { try { localStorage.setItem("bang_tt_theo_doi", JSON.stringify(TD)); } catch (e) {} };
const sach_ma = s => [...new Set(String(s || "").toUpperCase().split(/[^A-Z0-9]+/).filter(m => m.length >= 3 && m.length <= 8))].slice(0, 60);
(() => { const m = location.hash.match(/theo_doi=([^&]*)/);
  if (!m) return;
  const ds = sach_ma(decodeURIComponent(m[1]));
  if (ds.length) { TD = ds; luu_td(); setTimeout(() => bao(`Đã lưu ${ds.length} mã vào Theo dõi trên máy này`), 600); }
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} })();
function bao(t) { const b = document.createElement("div"); b.className = "bao"; b.textContent = t; document.body.appendChild(b); setTimeout(() => b.remove(), 3200); }
function doi_td(ma) { TD = TD.includes(ma) ? TD.filter(x => x !== ma) : TD.concat([ma]); luu_td(); ve_tat(); }
function luu_st() { try { const {tim, so_dong, ...x} = ST; localStorage.setItem("bang_tt", JSON.stringify(x)); } catch (e) {} }

// ---------- định dạng ----------
const nf = (v, n = 2) => v == null || !isFinite(v) ? "–" : v.toLocaleString("en-US", {minimumFractionDigits: n, maximumFractionDigits: n});
const dau = (v, n = 2) => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), n);
const lop = v => v == null ? "" : v > 0 ? "t" : v < 0 ? "g" : "d";
const ty = (v, n = 0) => v == null ? "–" : dau(v, n) + " tỷ";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const bo_dau = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
const ngay_vn = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, at = {}, cha) { const e = document.createElementNS(SVGNS, tag); for (const k in at) e.setAttribute(k, at[k]); if (cha) cha.appendChild(e); return e; }

// ---------- gợi ý (tooltip) ----------
const GY = $("#goi-y");
function hien_gy(html, x, y) {
  GY.innerHTML = html; GY.style.display = "block";
  const r = GY.getBoundingClientRect();
  let l = x + 14, t = y + 14;
  if (l + r.width > innerWidth - 8) l = x - r.width - 14;
  if (t + r.height > innerHeight - 8) t = y - r.height - 14;
  GY.style.left = Math.max(8, l) + "px"; GY.style.top = Math.max(8, t) + "px";
}
const an_gy = () => { GY.style.display = "none"; };

// ---------- trục thời gian phiên: 9:00–11:30 & 13:00–15:00 (bỏ nghỉ trưa) ----------
const PHUT_TRUA = 150, NGHI = 90, PHUT_HET = 360;
const x_phien = m => m <= PHUT_TRUA ? m : m >= PHUT_TRUA + NGHI ? m - NGHI : PHUT_TRUA;
const gio = m => { const h = 9 + Math.floor(m / 60), p = m % 60; return h + ":" + String(p).padStart(2, "0"); };

// ---------- thẻ chỉ số ----------
function ve_the() {
  const cs = $("#cs"); cs.innerHTML = "";
  for (const x of D.chi_so) {
    const b = document.createElement("button");
    b.className = "the"; b.setAttribute("aria-pressed", String(x.ma === ST.cs));
    const l = lop(x.td);
    b.innerHTML = `<span class="ten">${esc(x.ten)}</span><span class="gia so ${l}">${nf(x.gia, x.ma === "VN30F1M" ? 1 : 2)}</span>
      <span class="tdoi so ${l}">${dau(x.td, x.ma === "VN30F1M" ? 1 : 2)} &nbsp;${dau(x.pt)}%</span>
      ${x.basis != null ? `<span class="phu so">Basis ${dau(x.basis, 1)}</span>` : ""}`;
    b.appendChild(sparkline(x, 92, 44));
    b.onclick = () => { ST.cs = x.ma; if (x.ma !== "VNINDEX") ST.khung = "1D"; luu_st(); ve_the(); ve_bieu_do(); };
    b.title = x.ma === "VN30F1M" ? "So với đóng cửa phiên trước" : `${x.tang ?? "–"} tăng · ${x.dung ?? "–"} đứng · ${x.giam ?? "–"} giảm`;
    cs.appendChild(b);
  }
}
function sparkline(x, w, h) {
  const s = el("svg", {width: w, height: h, viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: "none", "aria-hidden": "true"});
  const c = x.c || [], t = x.t || [];
  if (c.length < 2) return s;

function ve_tac() {
  const hop = $("#tac"); hop.innerHTML = "";
  const tac = D.tac_dong, ds = (tac.xuong || []).slice().sort((a, b) => a[1] - b[1]).concat((tac.len || []).slice().sort((a, b) => a[1] - b[1]));
  $("#td-rong").innerHTML = `Ròng <b class="${lop(tac.rong)}">${dau(tac.rong)} điểm</b>`;
  if (!ds.length) return;
  const W = Math.max(hop.clientWidth - 16, 280);
  // mã quá lớn (VD 1 mã gấp > 2,2 lần mã thứ 2) → cắt cột, vẽ dấu gãy, nhãn vẫn ghi đúng giá trị
  const tr = ds.map(d => Math.abs(d[1])).sort((a, b) => b - a);
  const tran = tr[0] > 2.2 * (tr[1] || 0) && tr[1] ? tr[1] * 1.5 : tr[0];
  const dai = v => Math.min(Math.abs(v), tran), gay = v => Math.abs(v) > tran;
  const gy = d => hien_gy(`<b>${esc(d[0])}</b> ${esc((D.ten || {})[d[0]] || "")}<br>Tác động <span class="so">${dau(d[1])} điểm</span><br>Giá <span class="so">${dau(d[2])}%</span>`, ...gy.xy);
  const tro = (vung, d) => { vung.addEventListener("pointermove", e => { gy.xy = [e.clientX, e.clientY]; gy(d); }); vung.addEventListener("pointerleave", an_gy); };
  const mx_d = Math.max(...ds.map(d => d[1] > 0 ? dai(d[1]) : 0), 0), mx_a = Math.max(...ds.map(d => d[1] < 0 ? dai(d[1]) : 0), 0);
  if (W < 560) {                                                   // điện thoại: cột ngang, 1 mã / dòng
    const hang = 21, H = ds.length * hang + 8, x_ten = 46, x_pt = 46, vung_w = W - x_ten - x_pt - 70;
    const s = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Mã tác động mạnh nhất lên VN-Index"}, hop);
    const k = vung_w / ((mx_d + mx_a) || 1), x0 = x_ten + 34 + mx_a * k;
    el("line", {x1: x0, x2: x0, y1: 0, y2: H, stroke: "#cfd5de"}, s);
    ds.slice().reverse().forEach((d, i) => {
      const y = 4 + i * hang, w = Math.max(dai(d[1]) * k, 2), duong = d[1] >= 0, mau = duong ? MAU.tang : MAU.giam;
      el("text", {x: 0, y: y + 14, "font-size": 12, "font-weight": 650, fill: MAU.chu}, s).textContent = d[0];
      el("text", {x: x_ten, y: y + 14, "font-size": 11, fill: d[2] > 0 ? MAU.tang : d[2] < 0 ? MAU.giam : MAU.truc, class: "so"}, s).textContent = d[2] == null ? "" : dau(d[2]) + "%";
      const bx = duong ? x0 : x0 - w;
      el("rect", {x: bx, y: y + 4, width: w, height: 12, rx: 3, fill: mau}, s);
      if (gay(d[1])) for (const dx of [-14, -9]) el("line", {x1: (duong ? bx + w : bx) + (duong ? dx : -dx) - 2, x2: (duong ? bx + w : bx) + (duong ? dx : -dx) + 2, y1: y + 18, y2: y + 2, stroke: "#fff", "stroke-width": 2}, s);
      el("text", {x: duong ? bx + w + 4 : bx - 4, y: y + 14, "font-size": 11, "font-weight": 600, "text-anchor": duong ? "start" : "end", fill: MAU.chu, class: "so"}, s).textContent = dau(d[1]);
      tro(el("rect", {x: 0, y, width: W, height: hang, fill: "transparent"}, s), d);
    });
    return;
  }
  const H = 300, P = {t: 22, b: 40 + (mx_a ? 16 : 0)};
  const s = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "Mã tác động mạnh nhất lên VN-Index"}, hop);
  const cot = W / ds.length, bw = Math.min(24, cot * .62);
  const ty_le = (H - P.t - P.b) / ((mx_d + mx_a) || 1), y0 = P.t + mx_d * ty_le;
  el("line", {x1: 0, x2: W, y1: y0, y2: y0, stroke: "#cfd5de"}, s);
  ds.forEach((d, i) => {
    const cx = cot * i + cot / 2, h = Math.max(dai(d[1]) * ty_le, 2), duong = d[1] >= 0;
    const y = duong ? y0 - h : y0, r = Math.min(4, h / 2), mau = duong ? MAU.tang : MAU.giam;
    const p = duong ? `M${cx - bw / 2} ${y0}V${y + r}Q${cx - bw / 2} ${y} ${cx - bw / 2 + r} ${y}H${cx + bw / 2 - r}Q${cx + bw / 2} ${y} ${cx + bw / 2} ${y + r}V${y0}Z`
                    : `M${cx - bw / 2} ${y0}V${y0 + h - r}Q${cx - bw / 2} ${y0 + h} ${cx - bw / 2 + r} ${y0 + h}H${cx + bw / 2 - r}Q${cx + bw / 2} ${y0 + h} ${cx + bw / 2} ${y0 + h - r}V${y0}Z`;
    el("path", {d: p, fill: mau}, s);
    if (gay(d[1])) for (const dy of [12, 18]) { const yy = duong ? y + dy : y0 + h - dy;
      el("line", {x1: cx - bw / 2 - 1, x2: cx + bw / 2 + 1, y1: yy + 3, y2: yy - 3, stroke: "#fff", "stroke-width": 2.5}, s); }
    el("text", {x: cx, y: duong ? y - 5 : y0 + h + 13, "text-anchor": "middle", "font-size": 11, fill: MAU.chu, class: "so", "font-weight": 600}, s).textContent = dau(d[1]);
    el("text", {x: cx, y: H - 22, "text-anchor": "middle", "font-size": 11.5, "font-weight": 650, fill: MAU.chu}, s).textContent = d[0];
    el("text", {x: cx, y: H - 7, "text-anchor": "middle", "font-size": 10.5, fill: d[2] > 0 ? MAU.tang : d[2] < 0 ? MAU.giam : MAU.truc, class: "so"}, s).textContent = d[2] == null ? "" : dau(d[2]) + "%";
    tro(el("rect", {x: cot * i, y: P.t, width: cot, height: H - P.t, fill: "transparent"}, s), d);
  });
}

  const lo = r.san_gia || r.thap, hi = r.tran || r.cao; if (!(hi > lo)) return "";
  const X = v => 4 + (v - lo) / (hi - lo) * 142;
  const m = r.tt === 1 ? "#a24fd6" : r.tt === -1 ? "#1aa9bb" : r.gia > r.tc ? MAU.tang : r.gia < r.tc ? MAU.giam : "#c99a00";
  return `<svg class="bien" viewBox="0 0 150 14" aria-label="Thấp ${nf(r.thap)} – cao ${nf(r.cao)}"><rect x="4" y="5" width="142" height="4" rx="2" fill="#e6e9ef"/>
    <rect x="${X(r.thap)}" y="5" width="${Math.max(X(r.cao) - X(r.thap), 2)}" height="4" rx="2" fill="#aab3c0"/>
    <rect x="${X(r.tc) - 1}" y="1" width="2" height="12" fill="#c99a00"/><circle cx="${X(r.gia)}" cy="7" r="4" fill="${m}" stroke="#fff" stroke-width="1.5"/></svg>`;
}
function dong_html(r) {
  const nn = v => `<span class="${lop(v)}">${v == null ? "–" : dau(v, Math.abs(v) >= 100 ? 0 : 1)}</span>`;
  const co = TD.includes(r.ma), giu = GIU.includes(r.ma);
  return `<tr><td class="ma trai" title="${esc(r.ten)}">${giu ? `<span class="sao" title="Đang giữ (danh mục)">💼</span>`
    : `<button class="sao" aria-pressed="${co}" data-ma="${esc(r.ma)}" aria-label="${co ? "Bỏ" : "Thêm"} theo dõi ${esc(r.ma)}">${co ? "★" : "☆"}</button>`}<a class="lk-ma" href="../ma/#${esc(r.ma)}" title="Tra cứu ${esc(r.ma)}">${esc(r.ma)}</a>${r.san !== "HSX" ? `<span class="nhan-san">${r.san === "UPCOM" ? "UPC" : r.san}</span>` : ""}</td>
    <td class="trai cot-nganh" style="color:var(--chu2)">${esc(D.nganh[r.nganh] || "")}</td>
    <td class="so ${lop_gia(r)}">${nf(r.gia)}</td>
    <td class="so"><span class="o-pt ${lop_gia(r)}" style="background:${nen_pt(r)}">${dau(r.pt)}%</span></td>
    <td class="so">${nf(r.gt, 1)}</td><td class="so">${r.kl_x == null ? "–" : nf(r.kl_x, 1) + "×"}</td>
    <td class="so ${r.mcd == null ? "" : r.mcd >= 55 ? "t" : r.mcd <= 45 ? "g" : ""}">${r.mcd == null ? "–" : nf(r.mcd, 0) + "%"}</td>
    <td class="so ${lop(r.chuoi)}">${r.chuoi ? (r.chuoi > 0 ? "+" : "−") + Math.abs(r.chuoi) + " phiên" : "–"}</td>
    <td class="so">${nn(r.nn5)}</td><td class="so">${nn(r.nn20)}</td><td class="so">${nn(r.nn)}</td>
    <td class="so ${r.rsi >= 70 ? "g" : r.rsi != null && r.rsi <= 30 ? "t" : ""}">${r.rsi == null ? "–" : nf(r.rsi, 0)}</td>
    <td class="trai">${bien_svg(r)}</td></tr>`;
}

// ---------- điều khiển ----------
function doi_tab(t) {
  ST.tab = t; luu_st();
  for (const b of document.querySelectorAll(".tab button")) b.setAttribute("aria-selected", String(b.dataset.tab === t));
  $("#tq").hidden = t !== "tq"; $("#loc").hidden = t !== "loc";
  ve_tat();
}
document.querySelectorAll(".tab button").forEach(b => b.onclick = () => doi_tab(b.dataset.tab));
document.querySelectorAll("#nd-kich button").forEach(b => b.onclick = () => {
  ST.kich = b.dataset.k; luu_st();
  document.querySelectorAll("#nd-kich button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); ve_ban_do(); });
document.querySelectorAll("#loc-san button").forEach(b => b.onclick = () => { ST.san = b.dataset.s; ST.so_dong = 100; luu_st(); ve_loc(); });
$("#loc-nganh").onchange = e => { ST.nganh = e.target.value; ST.so_dong = 100; luu_st(); ve_loc(); };
$("#loc-tk").onclick = () => { ST.du_tk = !ST.du_tk; luu_st(); ve_loc(); };
$("#loc-tim").oninput = e => { ST.tim = e.target.value; ST.so_dong = 100; ve_loc(); };
$("#loc-them").onclick = () => { ST.so_dong += 200; ve_loc(); };

function ve_tat() {
  if (!D) return;
  const tuoi = (Date.now() - new Date(D.cap_nhat.replace(" ", "T") + "+07:00")) / 60000;
  const cu = D.dang_gd && tuoi > 12;
  $("#cham").className = "cham" + (D.dang_gd && !cu ? " song" : "");
  $("#trang-thai").textContent = `Phiên ${ngay_vn(D.phien)}/${D.phien.slice(0, 4)} · ${D.dang_gd ? (cu ? `dữ liệu cách đây ${Math.round(tuoi)} phút` : "đang giao dịch") : "đã đóng cửa"} · cập nhật ${D.cap_nhat.slice(11, 16)}`;
  if (ST.tab === "tq") { ve_the(); ve_theo_doi(); ve_bieu_do(); ve_ban_do(); ve_tk(); ve_tac(); }
  else ve_loc();
}
async function tai() {
  try {
    const r = await fetch(URL_DL + "?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = await r.json(); dung_loc(); ve_tat();
  } catch (e) {
    if (!D) $("main").innerHTML = `<div class="the loi">Chưa tải được dữ liệu (${esc(e.message)}). Thử tải lại trang sau ít phút.</div>`;
  }
}
document.querySelectorAll("#nd-kich button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.k === ST.kich)));
$("#loc-tim").value = ST.tim;
doi_tab(ST.tab === "loc" ? "loc" : "tq");
tai();
setInterval(() => { if (!document.hidden) tai(); }, 60000);
let hen; addEventListener("resize", () => { clearTimeout(hen); hen = setTimeout(ve_tat, 150); });
</script>
</body>
